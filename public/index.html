  return { group: g, cho: cho.material };
})();

/* ㉟ 天の川と夜雲 ― 夏の天の川が北東から南西へ。墨の雲が月の高さを流れる */
const sora = (function(){
  // 天の川（星の粒と淡い斑を帯状に描いた一枚）
  const c = cv(512, 128), gx = c.getContext('2d');
  let seed = 8181;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  gx.clearRect(0, 0, 512, 128);
  for (let i = 0; i < 8; i++){
    const px = rnd() * 512, py = 34 + rnd() * 60, pr = 30 + rnd() * 55;
    const rg = gx.createRadialGradient(px, py, 0, px, py, pr);
    rg.addColorStop(0, 'rgba(190,205,235,0.10)');
    rg.addColorStop(1, 'rgba(190,205,235,0)');
    gx.fillStyle = rg;
    gx.fillRect(px - pr, py - pr, pr * 2, pr * 2);
  }
  for (let i = 0; i < 420; i++){
    // 帯の芯へ寄せる（端は疎らに）
    const px = rnd() * 512;
    const py = 64 + (rnd() + rnd() + rnd() - 1.5) * 34;
    gx.fillStyle = 'rgba(235,240,252,' + (0.10 + rnd() * 0.35).toFixed(2) + ')';
    const pr = 0.4 + rnd() * 0.9;
    gx.beginPath(); gx.arc(px, py, pr, 0, Math.PI * 2); gx.fill();
  }
  const milky = new THREE.Mesh(new THREE.PlaneGeometry(420, 105),
    new THREE.MeshBasicMaterial({ map: tex(c), transparent: true, opacity: 0.15,
      blending: THREE.AdditiveBlending, depthWrite: false, fog: false, side: THREE.DoubleSide }));
  // そぞろ歩きの見上げ上限（0.5rad）でも入る高さ＝東の峰の上から南東の空へ立ち上る帯にする
  milky.position.set(-75, 60, -160);
  milky.lookAt(0, 2, -70);          // 歩ける中心域へ正対させ
  milky.rotateZ(0.8);               // 帯を斜めに渡す
  scene.add(milky);
  // 夜雲（墨の斑。月の手前をゆっくり流れて、時おり月が翳る）
  const cc = cv(256, 64), cg = cc.getContext('2d');
  cg.clearRect(0, 0, 256, 64);
  for (let i = 0; i < 14; i++){
    const px = 30 + rnd() * 196, py = 18 + rnd() * 28, pr = 14 + rnd() * 22;
    const rg = cg.createRadialGradient(px, py, 0, px, py, pr);
    rg.addColorStop(0, 'rgba(9,13,24,0.55)');
    rg.addColorStop(0.75, 'rgba(13,19,34,0.28)');
    rg.addColorStop(1, 'rgba(13,19,34,0)');
    cg.fillStyle = rg;
    cg.fillRect(px - pr, py - pr, pr * 2, pr * 2);
  }
  const cloudTex = tex(cc);
  const clouds = [];
  [[74, 11, 20, 47, -149, 0.55], [52, 8, -35, 41, -139, 0.34],
   [46, 7, 55, 20, -92, 0.42]].forEach(k => {
    const cl = new THREE.Mesh(new THREE.PlaneGeometry(k[0], k[1]),
      new THREE.MeshBasicMaterial({ map: cloudTex, transparent: true, opacity: 0.9,
        depthWrite: false, fog: false }));
    cl.position.set(k[2], k[3], k[4]);
    cl.userData = { spd: k[5] };
    scene.add(cl); clouds.push(cl);
  });
  return { milky: milky, clouds: clouds };
})();

/* ============================================================
   5m. 愛宕念仏寺出張所（FX ㊱）― 通りの東の隠れ道の先
   嵯峨野の愛宕念仏寺（千二百羅漢）の見立て。本山は嵯峨の北の奥
   なので、ここは「出張所」と名を掲げた出見世の寺として置く。
   停留にも札にもせず、そぞろ歩きで竹の切れ目を東へ折れた人だけが
   辿り着く。空気は半々＝仁王門から本堂までの境内は暖かい灯、その
   先の羅漢の群れと青白い供え灯・鬼火はもの寂しいまま。
   野はくすんだ竹藪でぐるりと囲い、入りは門の小道ひとつ。
   野 x-26.5〜-8.6 / z-57.5〜-77・小道 z-60.4〜-63.4
   本堂は参道の突き当たり（x-26.0, z-67.0）＝歩ける西の際 x-24.3 の外
   ============================================================ */
const adashino = (function(){
  const g = new THREE.Group();
  const stone = new THREE.MeshLambertMaterial({ color: 0x3b4048 });
  // ⚠ r128 の罠：setColorAt を使う InstancedMesh（羅漢の胴と頭）と、色を持たない
  //   InstancedMesh が同じ材質を共用すると、先に確定したプログラムが instanceColor を
  //   要求して描画時に「isInterleavedBufferAttribute of null」で落ちる。色なしの
  //   インスタンス（階・常夜灯の竿と笠）には双子の材質を渡す
  const stoneI = new THREE.MeshLambertMaterial({ color: 0x3b4048 });
  const m4 = new THREE.Matrix4(), q0 = new THREE.Quaternion(), eu = new THREE.Euler(),
        vv = new THREE.Vector3(), sc = new THREE.Vector3(), col = new THREE.Color();
  let seed = 6464;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  // ── 土の面（石畳の広場を土に返す。藪の道と同じ作法。囲いの竹の根方まで敷く） ──
  const tsuchiMat = new THREE.MeshLambertMaterial({ color: 0x191b15 });
  const no = new THREE.Mesh(new THREE.PlaneGeometry(21.2, 22.0), tsuchiMat);
  no.rotation.x = -Math.PI / 2;
  no.position.set(-18.2, 0.012, -67.1);
  g.add(no);
  const komichi = new THREE.Mesh(new THREE.PlaneGeometry(7.4, 3.0), tsuchiMat);
  komichi.rotation.x = -Math.PI / 2;
  komichi.position.set(-5.3, 0.012, -61.9);
  g.add(komichi);

  // ── 仁王門（もとの古い門に切妻の屋根を載せ、両脇に仁王の影を立てる） ──
  [[-8.9, -60.6, 0.05], [-8.9, -63.2, -0.07]].forEach(p => {
    const hashira = new THREE.Mesh(new THREE.BoxGeometry(0.18, 1.9, 0.18), MAT.wallDk);
    hashira.position.set(p[0], 0.95, p[1]);
    hashira.rotation.x = p[2];
    g.add(hashira);
  });
  const kasagi = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.14, 3.1), MAT.wallDk);
  kasagi.position.set(-8.9, 1.86, -61.9);
  kasagi.rotation.x = 0.03;
  g.add(kasagi);
  // 屋根（棟は z 沿い。くぐる向きは x）
  const monRise = 0.42, monRun = 0.95;
  const monSlope = Math.sqrt(monRun * monRun + monRise * monRise), monAng = Math.atan2(monRise, monRun);
  [1, -1].forEach(dir => {
    const p = new THREE.Mesh(new THREE.BoxGeometry(monSlope, 0.1, 3.5), MAT.roof);
    p.rotation.z = -dir * monAng;
    p.position.set(-8.9 + dir * monRun / 2, 2.02 + monRise / 2, -61.9);
    g.add(p);
  });
  const monMune = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.13, 3.6), MAT.roofEdge);
  monMune.position.set(-8.9, 2.02 + monRise + 0.02, -61.9);
  g.add(monMune);
  // 仁王二体（門の内側。夜は影だけ。胴・頭・腕は各一描画）
  const nioMat = new THREE.MeshLambertMaterial({ color: 0x1b1a17 });
  const NIO = [[-9.05, -60.95], [-9.05, -62.85]];
  const nioDou  = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.16, 0.21, 1.25, 7), nioMat, 2);
  const nioAtama = new THREE.InstancedMesh(new THREE.SphereGeometry(0.14, 8, 7), nioMat, 2);
  const nioUde  = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.055, 0.055, 0.72, 6), nioMat, 2);
  NIO.forEach((p, i) => {
    m4.makeTranslation(p[0], 0.63, p[1]); nioDou.setMatrixAt(i, m4);
    m4.makeTranslation(p[0], 1.36, p[1]); nioAtama.setMatrixAt(i, m4);
    eu.set(0, 0, i ? 0.9 : -0.75); q0.setFromEuler(eu);   // 阿形は腕を上げ、吽形は下げる
    m4.compose(vv.set(p[0] + (i ? 0.1 : -0.06), i ? 1.02 : 0.72, p[1] + (i ? -0.2 : 0.2)),
      q0, sc.set(1, 1, 1));
    nioUde.setMatrixAt(i, m4);
  });
  [nioDou, nioAtama, nioUde].forEach(o => { o.instanceMatrix.needsUpdate = true; g.add(o); });
  // 門提灯（境内の暖かさはここから始まる）
  const monCho = new THREE.Mesh(GEO.lantern, new THREE.MeshBasicMaterial({ color: 0xffc98a }));
  monCho.scale.set(0.72, 0.95, 0.72);
  monCho.position.set(-8.9, 1.55, -61.9);
  g.add(monCho);
  const monHi = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.glow, transparent: true,
    opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false }));
  monHi.scale.set(1.7, 1.7, 1);
  monHi.position.set(-8.9, 1.55, -61.9);
  g.add(monHi);

  // ── 寺号標（小道の入り。縦書きの刻字を通りへ向ける） ──
  const hyou = new THREE.Mesh(new THREE.BoxGeometry(0.32, 1.6, 0.3), stone);
  hyou.position.set(-8.05, 0.8, -63.5);
  g.add(hyou);
  const hyouMen = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 1.54),
    new THREE.MeshLambertMaterial({ map: hyouTexture('愛宕念仏寺出張所', '千二百羅漢'),
      emissive: 0x141620 }));
  hyouMen.rotation.y = Math.PI / 2;
  hyouMen.position.set(-7.89, 0.8, -63.5);
  g.add(hyouMen);

  // ── 羅漢さんの群れ（千二百羅漢の見立て。半分は座して裾を広げ、胸の前で手を
  //     合わせる。胴と裾、頭と手をそれぞれ同じ描画の後ろに足すので二描画のまま。
  //     苔をまとった一体を多めに混ぜて「一体ずつ違う」顔つきにする） ──
  const N_SEKI = 118;
  const SEKI = [];
  for (let i = 0; i < N_SEKI; i++){
    let x = -10.2 - rnd() * 15.8;
    let z = -58.4 - rnd() * 17.8;
    if (z < -66.2 && z > -67.8) z += (z > -67 ? 1.9 : -1.9);          // 参道の帯を空ける
    if (x < -24.2 && z < -64.4 && z > -69.6) x = -23.9 + rnd() * 1.4;  // 本堂の敷地を空ける
    SEKI.push([x, z, 0.34 + rnd() * 0.3, rnd() < 0.55]);   // [x, z, 丈, 座す（裾と合掌）]
  }
  const N_SUSO = SEKI.filter(s => s[3]).length;
  const douGeo = new THREE.CylinderGeometry(0.125, 0.16, 1, 6);
  douGeo.translate(0, 0.5, 0);
  const dou = new THREE.InstancedMesh(douGeo, stone, N_SEKI + N_SUSO);
  const atama = new THREE.InstancedMesh(new THREE.SphereGeometry(0.11, 7, 6), stone, N_SEKI + N_SUSO);
  dou.frustumCulled = atama.frustumCulled = false;   // 位置が散るので境界球カリングは切る
  let ex = N_SEKI;
  SEKI.forEach((p, i) => {
    eu.set((rnd() - 0.5) * 0.16, rnd() * Math.PI, (rnd() - 0.5) * 0.16);
    q0.setFromEuler(eu);
    m4.compose(vv.set(p[0], 0, p[1]), q0, sc.set(1, p[2], 1));
    dou.setMatrixAt(i, m4);
    // 頭は胴の傾きなりに上端へ
    vv.set(0, p[2], 0).applyQuaternion(q0);
    m4.compose(vv.set(p[0] + vv.x, vv.y, p[1] + vv.z), q0, sc.set(1, 1, 1));
    atama.setMatrixAt(i, m4);
    const moss = rnd() < 0.58;
    col.setHSL(moss ? 0.32 : 0.6, moss ? 0.16 : 0.04, 0.30 + rnd() * 0.18);
    if (dou.setColorAt){ dou.setColorAt(i, col); atama.setColorAt(i, col); }
    if (!p[3]) return;
    // 裾（座した膝まわり）と、胸の前で合わせた手
    m4.compose(vv.set(p[0], 0, p[1]), q0, sc.set(1.55, p[2] * 0.3, 1.55));
    dou.setMatrixAt(ex, m4);
    vv.set(0, p[2] * 0.6, 0).applyQuaternion(q0);
    m4.compose(vv.set(p[0] + vv.x, vv.y, p[1] + vv.z), q0, sc.set(0.5, 0.5, 0.5));
    atama.setMatrixAt(ex, m4);
    if (dou.setColorAt){ dou.setColorAt(ex, col); atama.setColorAt(ex, col); }
    ex++;
  });
  dou.instanceMatrix.needsUpdate = true;
  atama.instanceMatrix.needsUpdate = true;
  if (dou.instanceColor) dou.instanceColor.needsUpdate = true;
  if (atama.instanceColor) atama.instanceColor.needsUpdate = true;
  g.add(dou, atama);

  // ── 五輪塔二基（地・水・火・風空の見立てを四部品で） ──
  [[-24.6, -59.8], [-25.2, -73.8]].forEach(p => {
    const dai = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.34, 0.52), stone);
    dai.position.set(p[0], 0.17, p[1]); g.add(dai);
    const sui = new THREE.Mesh(new THREE.SphereGeometry(0.21, 8, 7), stone);
    sui.position.set(p[0], 0.52, p[1]); g.add(sui);
    const ka = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.22, 4), stone);
    ka.rotation.y = Math.PI / 4;
    ka.position.set(p[0], 0.82, p[1]); g.add(ka);
    const hou = new THREE.Mesh(new THREE.SphereGeometry(0.1, 7, 6), stone);
    hou.position.set(p[0], 0.99, p[1]); g.add(hou);

  // ── 卒塔婆の列（野の奥の際に、まちまちに傾いて。本堂の敷地 z-64.4〜-69.6 は空ける） ──
  const TOBA_Z = [-59.2, -61.6, -63.7, -70.4, -72.5, -74.3, -75.8];
  const toba = new THREE.InstancedMesh(new THREE.BoxGeometry(0.09, 1.15, 0.02), MAT.wallDk, TOBA_Z.length);
  toba.frustumCulled = false;
  TOBA_Z.forEach((z, i) => {
    eu.set((rnd() - 0.5) * 0.1, 0.2 + rnd() * 0.3, (rnd() - 0.5) * 0.16);
    q0.setFromEuler(eu);
    m4.compose(vv.set(-26.1 + rnd() * 0.5, 0.55, z - rnd() * 0.4), q0, sc.set(1, 1, 1));
    toba.setMatrixAt(i, m4);

  // ── 低い石積みの囲い（野の奥と北の際。歩ける限界がそのまま景色になる） ──
  [[-27.0, -67.2, 0.4, 20.2, 1], [-17.6, -57.2, 0.4, 18.6, 0]].forEach(k => {
    const tsumi = new THREE.Mesh(new THREE.BoxGeometry(k[4] ? 0.5 : k[3], k[2], k[4] ? k[3] : 0.5),

  // ── 石灯篭二基（青白い灯。参道の入りと中ほど） ──
  const rouHalos = [];

    sao.position.set(p[0], 0.25, p[1]); g.add(sao);
    const hib = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.24, 0.28),

    hib.position.set(p[0], 0.62, p[1]); g.add(hib);

    kasa.rotation.y = Math.PI / 4;
    kasa.position.set(p[0], 0.84, p[1]); g.add(kasa);
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.glowCool, color: 0xbcd4ec,

    halo.scale.set(1.2, 1.2, 1);
    halo.position.set(p[0], 0.62, p[1]);
    g.add(halo); rouHalos.push(halo);

  // ── 供えの灯（千灯供養の見立て。石仏の足元に青白い点々） ──
  const TOMO = [];
  for (let i = 0; i < 26; i++){

    TOMO.push(s[0] + (rnd() - 0.5) * 0.5, 0.1, s[1] + 0.25);

  const tomoGeo = new THREE.BufferGeometry();
  tomoGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TOMO), 3));
  const tomoshi = new THREE.Points(tomoGeo, new THREE.PointsMaterial({ map: TEX.glowCool,

    depthWrite: false, blending: THREE.AdditiveBlending }));
  tomoshi.frustumCulled = false;
  g.add(tomoshi);

  // ── 鬼火（青白い光がゆらゆら漂い、ふっと消えてはまた灯る） ──
  const onibi = [];
  for (let i = 0; i < 5; i++){
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.glowCool, color: 0xa9d6ea,
      transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));

    s.userData = {
      cx: -12 - rnd() * 13, cz: -59.5 - rnd() * 15.5,
      rx: 1.2 + rnd() * 1.8, rz: 1.0 + rnd() * 1.6,
      spd: 0.16 + rnd() * 0.12, fade: 0.10 + rnd() * 0.10, ph: rnd() * Math.PI * 2
    };
    g.add(s); onibi.push(s);
  }

  // ── 本堂（参道の突き当たり。入母屋の小堂で、正面＝東を参道へ向ける。

  const BX = -26.3, BZ = -67.0, BW = 3.0, BD = 4.0, BH = 2.35;
  const bKidan = new THREE.Mesh(new THREE.BoxGeometry(BW + 0.9, 0.32, BD + 0.9), stone);

  const bBody = new THREE.Mesh(new THREE.BoxGeometry(BW, BH, BD), MAT.wallDk);
  bBody.position.set(BX, 0.32 + BH / 2, BZ);

  const bRise = 1.15, bRun = BW / 2 + 0.8;

  [1, -1].forEach(dir => {

  [1, -1].forEach((dir, i) => {

  const bKizahashi = new THREE.InstancedMesh(new THREE.BoxGeometry(0.32, 0.12, 1.8), stoneI, 2);
  [[-24.15, 0.06], [-24.45, 0.2]].forEach((s, i) => {

  bKizahashi.instanceMatrix.needsUpdate = true;
  g.add(bKizahashi);
  // 扉の隙間から漏れる灯（境内でいちばん暖かい一点）と、階の両脇の常夜灯
  const tobira = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.95),
    new THREE.MeshBasicMaterial({ color: 0xffc98e, transparent: true, opacity: 0.46 }));
  tobira.rotation.y = -Math.PI / 2;

  honHi.position.set(BX + BW / 2 + 0.22, 1.15, BZ);

  [nioDou, nioAtama, nioUde, bTsuma, bKizahashi, bSao, bHibu, bKasa, sFrame, sKane, bKoke]

/* ============================================================
   5p. 嵯峨野の北（FX ㊴㊵）― 木戸をくぐった先の田の道と、大覚寺・広沢の池
   実際の嵯峨野も、天龍寺・野宮から北へ田をぬけると大覚寺（旧嵯峨御所）、
   その東に広沢の池がひらける。池は平安からの観月の名所。
   この町の月は南南西（42,46,-152・仰角約13度）に懸かるので、池の北の汀に
   立って南を向くと、水面にのびる月の道がそのまま渡月橋の月へつながる。
   ―― 方角は先に検算した：+z 北 / -z 南 / +x 西 / -x 東（愛宕山が[34,74]＝北西）。
   だから池は大覚寺の東＝x が負の側になる。
   停留にも札にもせず、そぞろ歩きで木戸を抜けた人だけが辿り着く。
   使える広さの上限：石畳の地面は北端 z+38、小倉山の南麓は z≈+31。
   実座標＝大覚寺の境内 x-3.0〜+14.0 / z+18.5〜+30.0
           広沢の池 中心(-15.0,+16.0) rx8.0 rz7.0／遍照寺山 中心(-20,+31)
   描画は箱を単位立方体の InstancedMesh でまとめ、群れごと距離で切る
   ============================================================ */

/* 立方体・板を一括で並べる小道具。b = [x,y,z, rx,ry,rz, sx,sy,sz]
   幾何は KITA_BOX などを使い回すので、境界球は複製に持たせる
   ―― 元の幾何に書くと、同じ形を使う他の群れの判定まで変わる（既存の戒め） */
function kitaInst(geo, mat, list){
  const im = new THREE.InstancedMesh(geo, mat, list.length);
  const m4 = new THREE.Matrix4(), q0 = new THREE.Quaternion(), eu = new THREE.Euler(),
        vv = new THREE.Vector3(), sc = new THREE.Vector3();
  list.forEach((b, i) => {
    eu.set(b[3] || 0, b[4] || 0, b[5] || 0); q0.setFromEuler(eu);
    m4.compose(vv.set(b[0], b[1], b[2]), q0, sc.set(b[6], b[7], b[8]));
    im.setMatrixAt(i, m4);
  });
  im.instanceMatrix.needsUpdate = true;
  // 群れ全体を包む球を手で与える＝向いていないときは描かない（後ろを向いて 20 描画の無駄を消す）
  if (!geo.boundingSphere) geo.computeBoundingSphere();
  const br = geo.boundingSphere.radius;
  let cx = 0, cy = 0, cz = 0;
  list.forEach(b => { cx += b[0]; cy += b[1]; cz += b[2]; });
  cx /= list.length; cy /= list.length; cz /= list.length;
  let r = 0;
  list.forEach(b => {
    const sr = br * Math.max(Math.abs(b[6]), Math.abs(b[7]), Math.abs(b[8]));
    const dd = Math.hypot(b[0] - cx, b[1] - cy, b[2] - cz) + sr;
    if (dd > r) r = dd;
  });
  im.geometry = geo.clone();
  im.geometry.boundingSphere = new THREE.Sphere(new THREE.Vector3(cx, cy, cz), r + 0.3);
  im.frustumCulled = true;
  return im;
}
const KITA_BOX   = new THREE.BoxGeometry(1, 1, 1);
const KITA_PLANE = new THREE.PlaneGeometry(1, 1);

/* ── 木戸の先の野（田・畦・道）。石畳が尽きて土になる ── */
const sagano = (function(){
  const g = new THREE.Group();
  let seed = 7373;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  // 野の土（藪の道・野宮の路地と同じ作法で、石畳を土に返す）
  const no = new THREE.Mesh(new THREE.PlaneGeometry(51, 31),
    new THREE.MeshLambertMaterial({ color: 0x111209, emissive: 0x030402 }));
  no.rotation.x = -Math.PI / 2;
  no.position.set(-3.5, 0.012, 20.5);
  g.add(no);

  // 踏み固められた道すじ（街道・辻から東へ折れる畦道・池の西と北の汀）
  const michi = kitaInst(KITA_PLANE,
    new THREE.MeshLambertMaterial({ color: 0x1a1811, emissive: 0x040302 }), [
    [   0, 0.016, 11.4, -Math.PI/2, 0, 0,  4.6, 14.0, 1],   // 街道（木戸 z+4.8 → 表門 z+18.4）
    [-4.05, 0.016, 15.5, -Math.PI/2, 0, 0, 4.9,  3.2, 1],   // 辻から東へ折れる畦道
    [-5.0, 0.016, 19.6, -Math.PI/2, 0, 0,  3.0, 11.4, 1],   // 池の西の汀
    [-10.2, 0.016, 24.3, -Math.PI/2, 0, 0, 13.6, 2.0, 1]    // 池の北の汀（月をのぞむ道）
  ]);
  g.add(michi);

  // 田（水を張った面。月あかりをうっすら返す）
  const ta = kitaInst(KITA_PLANE,
    new THREE.MeshBasicMaterial({ map: TEX.water.clone(), color: 0x4d5f80,
      transparent: true, opacity: 0.5, depthWrite: false }), [
    [  9.8, 0.019, 12.0, -Math.PI/2, 0, 0,  6.2,  7.0, 1],
    [ 18.0, 0.019, 23.5, -Math.PI/2, 0, 0,  7.0, 10.0, 1],
    [ -9.6, 0.019,  7.2, -Math.PI/2, 0, 0,  8.4,  4.4, 1],
    [-22.0, 0.019,  7.0, -Math.PI/2, 0, 0,  9.0,  3.8, 1]
  ]);
  ta.material.map.wrapS = ta.material.map.wrapT = THREE.RepeatWrapping;
  ta.material.map.repeat.set(2, 2);
  ta.renderOrder = -1;
  g.add(ta);

  // 畦（田を区切る土の畝。低く長い箱を寝かせる）
  const AZE = [];
  [[9.8, 8.5, 6.2, 0], [9.8, 15.5, 6.2, 0], [6.7, 12.0, 7.0, 1], [12.9, 12.0, 7.0, 1],
   [-9.6, 5.0, 8.4, 0], [-9.6, 9.4, 8.4, 0], [-22.0, 5.1, 9.0, 0], [-22.0, 8.9, 9.0, 0],
   [18.0, 18.5, 7.0, 0], [18.0, 28.5, 7.0, 0], [14.5, 23.5, 10.0, 1]].forEach(a => {
    AZE.push([a[0], 0.06, a[1], 0, a[3] ? Math.PI / 2 : 0, 0, a[2], 0.12, 0.34]);
  });
  g.add(kitaInst(KITA_BOX, new THREE.MeshLambertMaterial({ color: 0x1e1c15 }), AZE));

  // 辻の道標（東へ折れれば広沢の池。南を向いて立つ＝木戸から歩いてきた目に入る）
  const stone = new THREE.MeshLambertMaterial({ color: 0x343a46 });
  const michishirube = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.25, 0.28), stone);
  michishirube.position.set(-2.25, 0.63, 13.6);
  g.add(michishirube);
  const msMen = new THREE.Mesh(new THREE.PlaneGeometry(0.28, 1.2),
    new THREE.MeshLambertMaterial({ map: hyouTexture('広沢池', 'ひがしへ'), emissive: 0x141620 }));
  msMen.rotation.y = Math.PI;                  // 面を南（-z）へ向ける
  msMen.position.set(-2.25, 0.63, 13.455);
  g.add(msMen);

  scene.add(g);
  return { group: g };
})();

   村雨の廊下が直角に折れて五大堂へ。西の奥に朱の心経宝塔 */

  const shirakabe = new THREE.MeshLambertMaterial({ map: TEX.plaster });
  const PLASTER = [], ROOF = [], ROOFEDGE = [], DARK = [], WALLM = [], STONE = [],
        SHUBOX = [], SHOJI = [], HIBUKURO = [];

  /* 切妻の屋根を二枚の斜面で葺く。mune=true なら棟木も載せる
     yoko=true は棟が x 沿い（＝z 方向にくぐる建物）*/
  function kiritsuma(cx, cy, cz, w, d, rise, eave, yoko, mune){
    const run = (yoko ? d : w) / 2 + eave;
    const slope = Math.sqrt(run * run + rise * rise), ang = Math.atan2(rise, run);
    [1, -1].forEach(dir => {
      if (yoko){
        ROOF.push([cx, cy + rise / 2, cz + dir * run / 2, dir * ang, 0, 0, w + eave * 2, 0.12, slope]);
      } else {
        ROOF.push([cx + dir * run / 2, cy + rise / 2, cz, 0, 0, -dir * ang, slope, 0.12, d + eave * 2]);
      }
    });
    if (mune){
      ROOFEDGE.push(yoko
        ? [cx, cy + rise + 0.04, cz, 0, 0, 0, w * 0.72, 0.16, 0.3]
        : [cx, cy + rise + 0.04, cz, 0, 0, 0, 0.3, 0.16, d * 0.72]);
    }
  }

  // ── 土塀（白壁に瓦の笠）。南面は表門のところ（x-1.4〜+1.4）で切れる ──
  // [中心x, 中心z, 長さ, z沿いか]
  // 東面は五大堂の南（z23.2）で切れ、その先は大沢池にひらける（㊶）。
  // 北面も五大堂と観月台のぶん東端を下げて x3.0 から
  [[-2.2, 18.5, 1.6, 0], [7.7, 18.5, 12.6, 0], [-3.0, 20.85, 4.7, 1],
   [8.5, 30.0, 11.0, 0], [14.0, 24.25, 11.5, 1]].forEach(w => {
    const ry = w[3] ? Math.PI / 2 : 0;
    PLASTER.push([w[0], 0.78, w[1], 0, ry, 0, w[2], 1.56, 0.3]);
    ROOF.push([w[0], 1.63, w[1], 0, ry, 0, w[2] + 0.14, 0.14, 0.52]);
  });

  // ── 表門（薬医門。棟は x 沿い・くぐる向きは z。頭上は目の高さ 1.62 を空ける） ──
  [[-1.4, 18.5], [1.4, 18.5], [-1.4, 19.4], [1.4, 19.4]].forEach(p => {
    DARK.push([p[0], 1.5, p[1], 0, 0, 0, 0.26, 3.0, 0.26]);
  });
  DARK.push([0, 2.86, 18.5, 0, 0, 0, 3.4, 0.28, 0.26]);      // 冠木
  DARK.push([0, 2.20, 18.5, 0, 0, 0, 3.0, 0.16, 0.2]);       // 貫
  kiritsuma(0, 3.0, 18.9, 4.4, 1.9, 0.68, 0.6, true, true);
  const monCho = new THREE.Mesh(GEO.lantern, new THREE.MeshBasicMaterial({ color: 0xffd28a }));
  monCho.scale.set(0.78, 1.05, 0.78);
  monCho.position.set(0, 1.95, 18.5);
  g.add(monCho);
  const monHalo = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.glow, transparent: true,
    opacity: 0.32, blending: THREE.AdditiveBlending, depthWrite: false }));
  monHalo.scale.set(1.7, 1.7, 1);
  monHalo.position.set(0, 1.95, 18.5);
  g.add(monHalo);

  // ── 参道の敷石（表門から北へ、折れて式台玄関へ） ──
  [[0, 19.4], [0, 20.2], [0, 21.0], [0.6, 21.7], [1.4, 22.1],
   [2.2, 22.5], [3.0, 22.9], [3.7, 23.3]].forEach(pp => {
    STONE.push([pp[0], 0.03, pp[1], 0, 0, 0, 0.6, 0.05, 0.6]);
  });

  /* 伽藍は前庭を深くとって北へ寄せる。宸殿を西、五大堂を東に並べ、
     そのあいだを村雨の廊下が直角に折れて渡す（実際の大覚寺の並びに寄せた）。
     ―― 建物を南に寄せると前庭が一間しか残らず、宸殿を離れて見られない */

  // ── 式台玄関（唐破風の車寄せ。宸殿の南東に取り付く） ──
  WALLM.push([4.4, 1.05, 24.5, 0, 0, 0, 2.6, 2.1, 1.6]);
  kiritsuma(4.4, 2.1, 24.5, 2.6, 1.6, 0.5, 0.42, false, false);
  SHOJI.push([4.4, 1.05, 23.69, 0, Math.PI, 0, 1.8, 1.3, 1]);   // 玄関の灯（南面）
  for (let i = 0; i < 4; i++) DARK.push([3.8 + i * 0.4, 1.05, 23.67, 0, 0, 0, 0.05, 1.34, 0.03]);

  // ── 宸殿（寝殿造の見立て。南面に広縁と蔀戸、屋根は入母屋） ──
  const SW = 5.0, SD = 4.2, SH = 2.3, SX = 7.2, SZ = 26.6;
  STONE.push([SX, 0.15, SZ, 0, 0, 0, SW + 1.4, 0.3, SD + 1.4]);
  WALLM.push([SX, 0.3 + SH / 2, SZ, 0, 0, 0, SW, SH, SD]);
  kiritsuma(SX, 0.3 + SH, SZ, SW, SD, 1.2, 0.8, true, true);
  [1, -1].forEach(dir => {                                    // 妻（入母屋の締め）
    DARK.push([SX + dir * SW * 0.3, 0.3 + SH + 1.2 * 0.42, SZ, 0, 0, 0, 1.1, 0.7, SD * 0.5]);
  });
  DARK.push([SX, 0.52, SZ - SD / 2 - 0.45, 0, 0, 0, SW + 0.9, 0.12, 0.85]);   // 広縁
  SHOJI.push([SX, 1.25, SZ - SD / 2 - 0.012, 0, Math.PI, 0, SW - 0.7, 1.35, 1]); // 蔀戸の灯
  for (let i = 0; i < 6; i++){                                                 // 蔀の桟
    DARK.push([SX - SW / 2 + 0.85 + i * ((SW - 1.7) / 5), 1.25, SZ - SD / 2 - 0.03,
               0, 0, 0, 0.05, 1.4, 0.03]);
  }
  const shindenGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.glow, transparent: true,
    opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false }));
  shindenGlow.scale.set(4.6, 2.5, 1);
  shindenGlow.position.set(SX, 1.35, SZ - SD / 2 - 0.6);
  g.add(shindenGlow);

  // ── 五大堂（本堂。宸殿の東。南に広縁、板戸の奥にほのかな灯） ──
  const GW = 3.4, GD = 3.0, GH = 2.4, GX = 0.6, GZ = 27.9;   // 観月台と大沢池のぶん北へ寄せた（㊶）
  STONE.push([GX, 0.16, GZ, 0, 0, 0, GW + 1.0, 0.32, GD + 1.0]);
  WALLM.push([GX, 0.32 + GH / 2, GZ, 0, 0, 0, GW, GH, GD]);
  kiritsuma(GX, 0.32 + GH, GZ, GW, GD, 1.15, 0.7, true, true);
  DARK.push([GX, 0.5, GZ - GD / 2 - 0.4, 0, 0, 0, GW + 0.8, 0.12, 0.8]);      // 広縁
  SHOJI.push([GX, 1.35, GZ - GD / 2 - 0.012, 0, Math.PI, 0, 1.5, 1.6, 1]);     // 扉の灯
  for (let i = 0; i < 4; i++){                                                  // 桟（板戸の格子）
    DARK.push([GX - 0.6 + i * 0.4, 1.35, GZ - GD / 2 - 0.03, 0, 0, 0, 0.05, 1.64, 0.03]);
  }
  DARK.push([GX, 1.35, GZ - GD / 2 - 0.03, 0, 0, 0, 1.54, 0.05, 0.03]);
  const godaiGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.glow, transparent: true,
    opacity: 0.24, blending: THREE.AdditiveBlending, depthWrite: false }));
  godaiGlow.scale.set(3.0, 2.2, 1);
  godaiGlow.position.set(GX, 1.5, GZ - GD / 2 - 0.55);
  g.add(godaiGlow);

  // ── 村雨の廊下（式台玄関から北へ、直角に折れて五大堂へ。刀を振れない低い天井） ──
  //     床・柱・屋根の三点。折れ目をはっきり見せたいので二本を別々に置く
  [[3.9, 26.4, 1.0, 2.4], [3.0, 27.4, 2.4, 1.0]].forEach(r => {
    DARK.push([r[0], 0.34, r[1], 0, 0, 0, r[2], 0.14, r[3]]);           // 床
    ROOF.push([r[0], 1.75, r[1], 0, 0, 0, r[2] + 0.4, 0.1, r[3] + 0.4]);// 檜皮の平屋根
  });
  [[3.5, 25.4], [4.3, 25.4], [3.5, 27.3], [4.3, 27.3],
   [2.0, 27.0], [2.0, 27.8], [3.0, 26.95]].forEach(pp => {
    DARK.push([pp[0], 1.02, pp[1], 0, 0, 0, 0.11, 1.34, 0.11]);         // 柱
  });

  // ── 心経宝塔（朱の多宝塔。境内の北西の隅、小倉山の裾を背にして立つ） ──
  const TX = 12.4, TZ = 26.9;
  STONE.push([TX, 0.18, TZ, 0, 0, 0, 2.8, 0.36, 2.8]);                  // 基壇
  SHUBOX.push([TX, 1.35, TZ, 0, 0, 0, 2.1, 1.98, 2.1]);                 // 初層
  const houtou = new THREE.Group();
  const shokaya = new THREE.Mesh(new THREE.ConeGeometry(1.95, 0.68, 4), MAT.roof);
  shokaya.rotation.y = Math.PI / 4;
  shokaya.position.set(TX, 2.68, TZ); houtou.add(shokaya);
  const kamebara = new THREE.Mesh(
    new THREE.SphereGeometry(0.9, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2), shirakabe);
  kamebara.position.set(TX, 2.9, TZ); houtou.add(kamebara);
  const joso = new THREE.Mesh(new THREE.CylinderGeometry(0.76, 0.8, 1.1, 12), shu);
  joso.position.set(TX, 4.16, TZ); houtou.add(joso);
  const uekaya = new THREE.Mesh(new THREE.ConeGeometry(1.5, 0.58, 4), MAT.roof);
  uekaya.rotation.y = Math.PI / 4;
  uekaya.position.set(TX, 5.0, TZ); houtou.add(uekaya);
  const sourin = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.075, 1.5, 6), MAT.roofEdge);
  sourin.position.set(TX, 6.0, TZ); houtou.add(sourin);
  const houju = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 8), MAT.roofEdge);
  houju.position.set(TX, 6.79, TZ); houtou.add(houju);
  g.add(houtou);
  HIBUKURO.push([TX, 1.35, TZ - 1.07, 0, 0, 0, 0.85, 0.7, 0.03]);       // 初層の扉の灯
  const toHalo = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.glow, transparent: true,
    opacity: 0.20, blending: THREE.AdditiveBlending, depthWrite: false }));
  toHalo.scale.set(2.6, 2.2, 1);
  toHalo.position.set(TX, 1.5, TZ - 1.3);
  g.add(toHalo);

  // ── 石灯篭四基（参道の口に二基、境内に二基）。灯は点で一描画にまとめる ──
  const TOU = [[-2.7, 17.8], [2.7, 17.8], [-2.6, 21.4], [12.6, 19.2]];
  const TOUHI = [];
  TOU.forEach(pp => {
    STONE.push([pp[0], 0.28, pp[1], 0, 0, 0, 0.22, 0.55, 0.22]);          // 竿
    STONE.push([pp[0], 0.92, pp[1], 0, Math.PI / 4, 0, 0.62, 0.16, 0.62]);// 笠
    HIBUKURO.push([pp[0], 0.7, pp[1], 0, 0, 0, 0.3, 0.28, 0.3]);          // 火袋
    TOUHI.push(pp[0], 0.7, pp[1]);
  });
  const touGeo = new THREE.BufferGeometry();
  touGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TOUHI), 3));
  const touHi = new THREE.Points(touGeo, new THREE.PointsMaterial({ map: TEX.glow,
    color: 0xffc37a, size: 1.15, sizeAttenuation: true, transparent: true, opacity: 0.5,
    depthWrite: false, blending: THREE.AdditiveBlending }));
  g.add(touHi);

  // ── 松二本（北の際の歩けない一角に） ──
  const MATSU = [[4.0, 29.0, 0.9]];        // 東の一本は観月台に場所を譲った（㊶）
  const matsuKan = kitaInst(new THREE.CylinderGeometry(0.08, 0.13, 2.0, 6), MAT.wallDk,
    MATSU.map(pp => [pp[0], 1.0 * pp[2], pp[1], 0, 0, 0, 1, pp[2], 1]));
  const matsuHa = kitaInst(new THREE.SphereGeometry(0.6, 8, 6),
    new THREE.MeshLambertMaterial({ color: 0x1d3226 }),
    MATSU.flatMap(pp => [
      [pp[0], 2.05 * pp[2], pp[1], 0, 0, 0, 1.3 * pp[2], 0.5 * pp[2], 1.3 * pp[2]],
      [pp[0] + 0.5 * pp[2], 1.7 * pp[2], pp[1] - 0.4 * pp[2], 0, 0, 0,
       0.9 * pp[2], 0.4 * pp[2], 0.9 * pp[2]]
    ]));
  g.add(matsuKan, matsuHa);

  // ── 寺号標（表門の東。南を向いて立つ） ──
  const hyou = new THREE.Mesh(new THREE.BoxGeometry(0.34, 1.6, 0.3), stone);
  hyou.position.set(2.9, 0.8, 16.6);
  g.add(hyou);
  const hyouMen = new THREE.Mesh(new THREE.PlaneGeometry(0.32, 1.54),
    new THREE.MeshLambertMaterial({ map: hyouTexture('大覚寺', '旧嵯峨御所'), emissive: 0x141620 }));
  hyouMen.rotation.y = Math.PI;
  hyouMen.position.set(2.9, 0.8, 16.445);
  g.add(hyouMen);

  // ── ここまで貯めた箱をまとめて建てる ──
  g.add(kitaInst(KITA_BOX, shirakabe, PLASTER));
  g.add(kitaInst(KITA_BOX, MAT.roof, ROOF));
  g.add(kitaInst(KITA_BOX, MAT.roofEdge, ROOFEDGE));
  g.add(kitaInst(KITA_BOX, MAT.wallDk, DARK));
  g.add(kitaInst(KITA_BOX, MAT.wall, WALLM));
  g.add(kitaInst(KITA_BOX, stone, STONE));
  g.add(kitaInst(KITA_BOX, shu, SHUBOX));
  g.add(kitaInst(KITA_BOX, MAT.inner, HIBUKURO));
  const shojiMat = new THREE.MeshBasicMaterial({ color: 0xffc98e, transparent: true, opacity: 0.85 });
  g.add(kitaInst(KITA_PLANE, shojiMat, SHOJI));

  g.traverse(o => { if (o.isSprite) o.raycast = function(){}; });
  scene.add(g);
  return { group: g, monHalo: monHalo, shindenGlow: shindenGlow, godaiGlow: godaiGlow,
           toHalo: toHalo, touHi: touHi.material, shoji: shojiMat };
})();

/* ㊵ 広沢の池 ― 大覚寺の東。北の汀に立って南を向くと、
   水面の月の道が渡月橋の月まで一本につながる（平安からの観月の池） */
const hirosawa = (function(){
  const g = new THREE.Group();
  const stone = new THREE.MeshLambertMaterial({ color: 0x343a46 });
  let seed = 6161;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const PC = { x: -15.0, z: 16.0, rx: 8.0, rz: 7.0 };

  // ── 池（renderOrder -2 で先に描き、水鏡の光を飲ませない＝川・曹源池と同じ手） ──
  const ike = new THREE.Mesh(new THREE.CircleGeometry(1, 48),
    new THREE.MeshBasicMaterial({ map: TEX.water.clone(), color: 0x8ea4cc,
      transparent: true, opacity: 0.95 }));
  ike.material.map.wrapS = ike.material.map.wrapT = THREE.RepeatWrapping;
  ike.material.map.repeat.set(4, 3);
  ike.rotation.x = -Math.PI / 2;
  ike.scale.set(PC.rx, PC.rz, 1);
  ike.position.set(PC.x, 0.024, PC.z);
  ike.renderOrder = -2;
  g.add(ike);

  // ── 遍照寺山（池の北にもたげる低い山。嵯峨富士とも呼ばれた） ──
  const YX = -21.5, YZ = 31.5;      // 大沢池（㊶）に場所を譲って北西へ退けた
  const yama = new THREE.Mesh(
    new THREE.SphereGeometry(8.5, 22, 12, 0, Math.PI * 2, 0, Math.PI / 2),
    new THREE.MeshLambertMaterial({ color: 0x131c29 }));
  yama.scale.set(1, 0.5, 0.55);
  yama.position.set(YX, 0, YZ);
  g.add(yama);
  // 山肌の木立（つるりとした半球は坊主山に見える。南斜面に叢を散らして稜線を割る）
  const KODACHI = [];
  for (let i = 0; i < 19; i++){
    const u = (i / 18) * 2.9 - 1.45;                 // 山肌をぐるりとなぞる角度
    const rr = 0.4 + rnd() * 0.5;
    const hx = YX + Math.sin(u) * 8.5 * rr;
    const hz = YZ - Math.cos(u) * 4.675 * rr;
    const q = 1 - Math.min(1, ((hx - YX) / 8.5) * ((hx - YX) / 8.5) + ((hz - YZ) / 4.675) * ((hz - YZ) / 4.675));
    const hy = 4.25 * Math.sqrt(Math.max(0, q));
    const sz2 = 0.9 + rnd() * 0.8;
    KODACHI.push([hx, hy + sz2 * 0.25, hz, 0, rnd() * Math.PI, 0, sz2, sz2 * 0.8, sz2]);
  }
  g.add(kitaInst(new THREE.SphereGeometry(0.8, 7, 5),
    new THREE.MeshLambertMaterial({ color: 0x0e1720 }), KODACHI));
  // その山影が水面の北へ落ちる（暗いだけの一枚。月の道の手前で切れる）
  const kage = new THREE.Mesh(new THREE.PlaneGeometry(11, 5.4),
    new THREE.MeshBasicMaterial({ color: 0x060a12, transparent: true, opacity: 0.5,
      depthWrite: false }));
  kage.rotation.x = -Math.PI / 2;
  kage.position.set(-17.6, 0.03, 20.2);
  kage.renderOrder = -1;
  g.add(kage);

  // ── 月の道（南南西＝月の方位へ寝かせる。方位角は camera 側で検算した -0.326rad） ──
  const tsukiMichi = new THREE.Mesh(new THREE.PlaneGeometry(1.9, 12.5),
    new THREE.MeshBasicMaterial({ map: TEX.glow, color: 0xd6e4ff, transparent: true,
      opacity: 0.27, blending: THREE.AdditiveBlending, depthWrite: false }));
  tsukiMichi.rotation.x = -Math.PI / 2;
  tsukiMichi.rotation.z = -0.326;
  tsukiMichi.position.set(-14.6, 0.042, 15.4);
  g.add(tsukiMichi);
  // 水面のきらめき
  const N_KIRA = 16, kpos = new Float32Array(N_KIRA * 3);
  for (let i = 0; i < N_KIRA; i++){
    const th = rnd() * Math.PI * 2, rr = Math.sqrt(rnd()) * 0.86;
    kpos[i*3]   = PC.x + Math.cos(th) * PC.rx * rr;
    kpos[i*3+1] = 0.05;
    kpos[i*3+2] = PC.z + Math.sin(th) * PC.rz * rr;
  }
  const kgeo = new THREE.BufferGeometry();
  kgeo.setAttribute('position', new THREE.BufferAttribute(kpos, 3));
  const shimmer = new THREE.Points(kgeo, new THREE.PointsMaterial({ map: TEX.glow,
    color: 0xcfe0ff, size: 0.19, sizeAttenuation: true, transparent: true, opacity: 0.32,
    depthWrite: false, blending: THREE.AdditiveBlending }));
  g.add(shimmer);

  // ── 汀の石と、観音島の州浜 ──
  // 明るさを二段に分けて二群で置く。
  // ※ r128 の InstancedMesh.setColorAt は、この群れでは描画時に落ちる
  //   （instanceColor が InstancedBufferAttribute にならない既知の穴）。
  //   色のばらつきは材質を二つに分けて出す ―― 増えるのは一描画だけ
  const ISHI = [[], []];
  const ishiMat = [stone, new THREE.MeshLambertMaterial({ color: 0x272c37 })];
  for (let i = 0; i < 20; i++){
    const th = (i / 20) * Math.PI * 2 + rnd() * 0.22;
    const sz = 0.42 + rnd() * 0.5;
    ISHI[rnd() > 0.5 ? 0 : 1].push([
      PC.x + Math.cos(th) * (PC.rx + 0.45), 0.06,
      PC.z + Math.sin(th) * (PC.rz + 0.45),
      rnd() * Math.PI, rnd() * Math.PI, rnd() * 0.4,
      sz, sz * (0.6 + rnd() * 0.4), sz]);
  }
  const ishiGeo = new THREE.DodecahedronGeometry(0.32, 0);
  ISHI.forEach((list, i) => { if (list.length) g.add(kitaInst(ishiGeo, ishiMat[i], list)); });
  const IX = -17.5, IZ = 16.5;
  const suhama = new THREE.Mesh(new THREE.CircleGeometry(1.35, 20),
    new THREE.MeshLambertMaterial({ color: 0x141822 }));
  suhama.rotation.x = -Math.PI / 2;
  suhama.position.set(IX, 0.045, IZ);
  g.add(suhama);
  // 島の石仏（笠と身の二段）と、根方の松
  g.add(kitaInst(KITA_BOX, stone, [
    [IX - 0.42, 0.22, IZ - 0.1, 0, 0.3, 0, 0.24, 0.40, 0.21],   // 石仏の身
    [IX - 0.42, 0.46, IZ - 0.1, 0, 0.3, 0, 0.34, 0.07, 0.3]     // 笠
  ]));
  const shimaMatsu = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.1, 1.15, 6), MAT.wallDk);
  shimaMatsu.position.set(IX + 0.4, 0.58, IZ + 0.15);
  shimaMatsu.rotation.z = 0.1;
  g.add(shimaMatsu);
  const shimaHa = kitaInst(new THREE.SphereGeometry(0.55, 8, 6),
    new THREE.MeshLambertMaterial({ color: 0x1a2c22 }), [

/* ============================================================
/* ㊶ 大沢池と五大堂の観月台 ― 五大堂の東、水の上へ張り出す床
   嵯峨天皇の離宮の池で、日本最古の庭池。中国の洞庭湖に倣って「庭湖」とも
   呼ばれ、いまも観月の夕べに龍頭鷁首の舟が浮かぶ。北の際には名古曽の滝跡
   ―― 水はとうに絶えて石組だけが残る（「滝の音は絶えて久しくなりぬれど
   名こそ流れてなほ聞こえけれ」）。
   五大堂を z26.6→27.9 へ北に寄せ、東の土塀を z23.2 で切って池に開いた。
   観月台は床 0.45m の高さ。実座標＝池 中心(-8.0,+29.2) rx4.4 rz3.8、
   観月台 x-1.1〜-4.8 / z+26.9〜+29.3（北と東に高欄、南は上がり口）
   ============================================================ */
const osawa = (function(){
  const g = new THREE.Group();
  const stone = new THREE.MeshLambertMaterial({ color: 0x343a46 });
  const stone2 = new THREE.MeshLambertMaterial({ color: 0x272c37 });
  let seed = 9091;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const PC = { x: -8.0, z: 29.2, rx: 4.4, rz: 3.8 };
  const BOX = [], DARK = [], ISHI = [[], []], HI = [];

  // ── 池（renderOrder -2 で先に描き、水鏡の光を飲ませない） ──
  const ike = new THREE.Mesh(new THREE.CircleGeometry(1, 44),

  ike.scale.set(PC.rx, PC.rz, 1);
  ike.position.set(PC.x, 0.024, PC.z);
  ike.renderOrder = -2;
  g.add(ike);

  // ── 汀の石（明るさを二段に分けて二群で置く。r128 の setColorAt は使えない） ──
  for (let i = 0; i < 22; i++){
    const th = (i / 22) * Math.PI * 2 + rnd() * 0.24;
    const sz = 0.36 + rnd() * 0.42;
    ISHI[rnd() > 0.5 ? 0 : 1].push([
      PC.x + Math.cos(th) * (PC.rx + 0.4), 0.06, PC.z + Math.sin(th) * (PC.rz + 0.4),
      rnd() * Math.PI, rnd() * Math.PI, rnd() * 0.4,
      sz, sz * (0.6 + rnd() * 0.4), sz]);
  }

  // ── 菊ヶ島と天神島（州浜のうえに、島の松と天神さんの小鳥居） ──
  const SHIMA = [[-9.6, 30.0, 1.15], [-10.6, 28.0, 0.95]];
  const suhama = kitaInst(new THREE.CircleGeometry(1, 18),
    new THREE.MeshLambertMaterial({ color: 0x141822 }),
    SHIMA.map(p => [p[0], 0.045, p[1], -Math.PI / 2, 0, 0, p[2], p[2], 1]));
  g.add(suhama);
  // 菊ヶ島の松
  const shimaKan = kitaInst(new THREE.CylinderGeometry(0.06, 0.1, 1.3, 6), MAT.wallDk,
    [[-9.6, 0.65, 30.0, 0, 0, 0, 1, 1, 1]]);
  const shimaHa = kitaInst(new THREE.SphereGeometry(0.55, 8, 5),
    new THREE.MeshLambertMaterial({ color: 0x1a2c22 }), [
    [-9.55, 1.4, 29.95, 0, 0, 0, 1.15, 0.44, 1.15],
    [-9.25, 1.14, 30.25, 0, 0, 0, 0.78, 0.34, 0.78]
  ]);
  g.add(shimaKan, shimaHa);
  // 天神島の小鳥居（朱は沈ませる。夜は形だけ読めればよい）
  const shu = new THREE.MeshLambertMaterial({ color: 0x7d3128 });
  const TORII = [
    [-10.6, 0.36, 27.72, 0, 0, 0, 0.07, 0.62, 0.07],
    [-10.6, 0.36, 28.28, 0, 0, 0, 0.07, 0.62, 0.07],
    [-10.6, 0.70, 28.00, 0, 0, 0, 0.09, 0.06, 0.86],

  ];
  g.add(kitaInst(KITA_BOX, shu, TORII));

  // ── 庭湖石（島のあいだに立てる二石。庭園の芯） ──
  ISHI[0].push([-8.6, 0.34, 29.0, 0.1, 0.6, 0.08, 0.5, 1.5, 0.44]);
  ISHI[1].push([-8.95, 0.22, 29.32, 0.15, 1.2, -0.1, 0.42, 1.0, 0.4]);

  // ── 名古曽の滝跡（池の北。水はとうに絶えて、石組だけが草に埋もれている） ──
  const TAKI = [
    [-6.2, 0.55, 34.5, 0.1, 0.4, 0.05, 0.8, 2.0, 0.7],     // 立石（滝の左）
    [-5.1, 0.44, 34.2, 0.12, 1.1, -0.06, 0.66, 1.6, 0.6],  // 立石（滝の右）
    [-5.7, 0.26, 34.0, 0, 0.7, 0, 0.9, 0.8, 0.7],          // 水落石
    [-5.8, 0.14, 33.5, 0.2, 0.3, 0.1, 1.0, 0.5, 0.9],
    [-6.6, 0.12, 33.4, 0.1, 1.5, 0.15, 0.8, 0.45, 0.75],
    [-5.0, 0.11, 33.3, 0.25, 0.9, 0, 0.7, 0.4, 0.66],
    [-6.1, 0.09, 33.0, 0, 0.2, 0.08, 0.85, 0.35, 0.8]
  ];
  TAKI.forEach((t, i) => ISHI[i % 2].push(t));

  // ── 龍頭鷁首の舟（観月の夕べの一対。龍の首と、鷁という水鳥の首） ──
  // [中心x, 中心z, 向き, 龍か]
  const FUNE = [[-7.6, 32.0, 0.5, 1], [-8.6, 26.0, -0.9, 0]];
  const KUBI = [], hashi = [], FUNEBOX = [];
  FUNE.forEach(f => {
    const c = Math.cos(f[2]), s2 = Math.sin(f[2]);
    const P = (dx, dz) => [f[0] + dx * c + dz * s2, f[1] - dx * s2 + dz * c];
    const put = (dx, y, dz, sx, sy, sz) => {
      const p = P(dx, dz);
      FUNEBOX.push([p[0], y, p[1], 0, f[2], 0, sx, sy, sz]);
    };
    put(0,     0.08,  0,    0.74, 0.16, 2.5);          // 底
    put(-0.36, 0.21,  0,    0.07, 0.24, 2.4);          // 舷（左）
    put( 0.36, 0.21,  0,    0.07, 0.24, 2.4);          // 舷（右）
    put(0,     0.49, -0.27, 0.70, 0.42, 1.1);          // 屋形
    put(0,     0.74, -0.27, 0.94, 0.08, 1.35);         // 屋形の屋根
    // 首（舳先から斜めに立ち上がる）
    const kp = P(0, 1.27);
    KUBI.push([kp[0], 0.60, kp[1], -0.5, f[2], 0, 1, 1, 1]);
    // 頭 ―― 龍は角ばった顎に二本の角、鷁は細くとがった嘴
    const hp = P(0, 1.58);
    if (f[3]){
      FUNEBOX.push([hp[0], 1.05, hp[1], 0, f[2], 0, 0.19, 0.21, 0.33]);
      FUNEBOX.push([hp[0], 1.19, hp[1], -0.6, f[2] + 0.3, 0, 0.04, 0.22, 0.04]);
      FUNEBOX.push([hp[0], 1.19, hp[1], -0.6, f[2] - 0.3, 0, 0.04, 0.22, 0.04]);
    } else {
      FUNEBOX.push([hp[0], 1.03, hp[1], 0, f[2], 0, 0.15, 0.16, 0.21]);
      hashi.push([hp[0], 1.03, hp[1], f[2]]);
    }
    const lp = P(0, -0.7);
    HI.push(lp[0], 0.63, lp[1]);                       // 屋形の灯
  });
  g.add(kitaInst(KITA_BOX, MAT.wall, FUNEBOX));            // 舟は明るい木で水面から起こす
  g.add(kitaInst(new THREE.CylinderGeometry(0.07, 0.095, 0.8, 7), MAT.wall, KUBI));
  hashi.forEach(h => {                                  // 鷁の嘴
    const beak = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.27, 6), MAT.wall);
    beak.rotation.set(Math.PI / 2 - 0.25, h[3], 0);
    beak.position.set(h[0], h[1] + 0.02, h[2] + 0.16);

  // ── 観月台（五大堂の東面から水の上へ張り出す。北と東に高欄、南は上がり口） ──
  const KD = { x0: -4.8, x1: -1.1, z0: 26.9, z1: 29.3, y: 0.45 };
  const kcx = (KD.x0 + KD.x1) / 2, kcz = (KD.z0 + KD.z1) / 2;
  DARK.push([kcx, KD.y - 0.045, kcz, 0, 0, 0, KD.x1 - KD.x0, 0.09, KD.z1 - KD.z0]);  // 床
  [[-1.5, 27.3], [-1.5, 28.9], [-3.1, 27.3], [-3.1, 28.9],
   [-4.5, 27.3], [-4.5, 28.9]].forEach(p => {                                        // 束柱
    DARK.push([p[0], 0.2, p[1], 0, 0, 0, 0.11, 0.4, 0.11]);
  });
  // 高欄（地覆・笠木・束）。東と北の二面だけ
  [[KD.x0 + 0.05, kcz, 1, KD.z1 - KD.z0 - 0.1], [kcx, KD.z1 - 0.05, 0, KD.x1 - KD.x0 - 0.1]]
    .forEach(r => {
      const ry = r[2] ? Math.PI / 2 : 0;
      DARK.push([r[0], KD.y + 0.06, r[1], 0, ry, 0, r[3], 0.07, 0.09]);   // 地覆
      DARK.push([r[0], KD.y + 0.47, r[1], 0, ry, 0, r[3] + 0.1, 0.08, 0.14]); // 笠木
      const n = Math.max(3, Math.round(r[3] / 0.42));
      for (let i = 0; i <= n; i++){
        const t = -r[3] / 2 + (r[3] * i / n);
        DARK.push([r[2] ? r[0] : r[0] + t, KD.y + 0.26, r[2] ? r[1] + t : r[1],
                   0, 0, 0, 0.05, 0.42, 0.05]);
      }
    });
  // 上がり口の踏石（東の小道から床へ一段）
  ISHI[1].push([-2.4, 0.11, 26.72, 0, 0.2, 0, 1.5, 0.44, 0.7]);
  // 台のかたわらの常夜灯（北東の隅。可動域の外に立てる）
  DARK.push([-4.66, 0.75, 29.14, 0, 0, 0, 0.09, 0.6, 0.09]);
  BOX.push([-4.66, 1.16, 29.14, 0, 0, 0, 0.21, 0.2, 0.21]);
  DARK.push([-4.66, 1.33, 29.14, 0, Math.PI / 4, 0, 0.4, 0.11, 0.4]);
  const daiHalo = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.glow, transparent: true,
    opacity: 0.30, blending: THREE.AdditiveBlending, depthWrite: false }));
  daiHalo.scale.set(1.1, 1.1, 1);
  daiHalo.position.set(-4.66, 1.16, 29.14);
  g.add(daiHalo);

  // ── 月の道 ──
  // 広沢と違い、ここは立つ場所（観月台＝西の汀）と月（南南西）と池（北東）が
  // 一直線に並ばない。視点に追わせると光が足もとに落ちて、見下ろさないと
  // 写らなくなる ―― so 大沢は池のなかほどに置いたままにする。
  // 向きだけは月の方位に合わせる（この位置から月へは -0.269rad）
  const tsukiMichi = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 5.5),
    new THREE.MeshBasicMaterial({ map: TEX.glow, color: 0xd6e4ff, transparent: true,
      opacity: 0.24, blending: THREE.AdditiveBlending, depthWrite: false }));
  tsukiMichi.rotation.x = -Math.PI / 2;

  const N_KIRA = 12, kpos = new Float32Array(N_KIRA * 3);
  for (let i = 0; i < N_KIRA; i++){

  const shimmer = new THREE.Points(kgeo, new THREE.PointsMaterial({ map: TEX.glow,

  // 舟の灯と常夜灯は点でまとめる（沈んだ橙をふたつ、水面近くに）
  const hgeo = new THREE.BufferGeometry();

  const funeHi = new THREE.Points(hgeo, new THREE.PointsMaterial({ map: TEX.glow,

  g.add(funeHi);

  // ── 貯めた箱をまとめて建てる ──
  g.add(kitaInst(KITA_BOX, MAT.wallDk, DARK));
  g.add(kitaInst(KITA_BOX, MAT.inner, BOX));
  const ishiGeo = new THREE.DodecahedronGeometry(0.32, 0);
  [stone, stone2].forEach((m, i) => { if (ISHI[i].length) g.add(kitaInst(ishiGeo, m, ISHI[i])); });

  g.traverse(o => { if (o.isSprite) o.raycast = function(){}; });
  scene.add(g);
  return { group: g, tsukiMichi: tsukiMichi, shimmer: shimmer, funeHi: funeHi.material,
           daiHalo: daiHalo, pond: PC, dai: KD };
})();

/* ============================================================
   5q. 落柿舎 ― 田の向こうの藁葺きの庵（FX ㊷ rakushisha）
   去来の草庵の見立て。庭の四十本の柿が一夜で落ちた逸話が名の由来。
   壁の蓑と笠は「主が庵にいる」しるし。芭蕉がここで嵯峨日記を書いた

   ============================================================ */
const rakushisha = (function(){
  const g = new THREE.Group();
  let seed = 4949;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const tsuchikabe = new THREE.MeshLambertMaterial({ color: 0x352a1b });   // 草庵の土壁
  const kayaM = new THREE.MeshLambertMaterial({ map: TEX.kaya });

  const niwa = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 7.8),

  niwa.rotation.x = -Math.PI / 2;
  niwa.position.set(16.3, 0.014, 10.7);

  const komichi = new THREE.Mesh(new THREE.PlaneGeometry(13.2, 1.0),
    new THREE.MeshLambertMaterial({ color: 0x1a1811, emissive: 0x040302 }));
  komichi.rotation.x = -Math.PI / 2;
  komichi.position.set(8.2, 0.016, 7.85);
  g.add(komichi);

  // 庵：土壁の身に、茅葺きの寄棟（四角錐＋短い棟）をかぶせる。軒は深く
  const HX = 16.2, HZ = 11.7;
  const mi = new THREE.Mesh(new THREE.BoxGeometry(3.0, 1.75, 2.4), tsuchikabe);
  mi.position.set(HX, 0.885, HZ);
  g.add(mi);
  const yane = new THREE.Mesh(new THREE.ConeGeometry(2.62, 1.3, 4), kayaM);
  yane.rotation.y = Math.PI / 4;
  yane.scale.z = 0.82;
  yane.position.set(HX, 2.41, HZ);
  g.add(yane);
  const mune = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.14, 0.3),
    new THREE.MeshLambertMaterial({ color: 0x1c1710 }));
  mune.position.set(HX, 3.06, HZ);
  g.add(mune);
  // 濡れ縁（東の縁先。田と月を眺める腰かけ）
  const en = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.09, 2.0), MAT.wallDk);
  en.position.set(14.42, 0.32, HZ);
  g.add(en);
  // 障子のほの灯（東面＝小道の側へ。留守ではない、というほのめかし）
  const shoji = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.78),
    new THREE.MeshBasicMaterial({ color: 0xffd9a0, transparent: true, opacity: 0.4 }));
  shoji.rotation.y = -Math.PI / 2;
  shoji.position.set(14.68, 0.95, HZ + 0.42);
  g.add(shoji);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.glow, color: 0xffcf8e,
    transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending, depthWrite: false }));
  halo.scale.set(1.6, 1.6, 1);
  halo.position.set(14.45, 1.0, HZ + 0.42);
  g.add(halo);
  // 蓑と笠（東の壁。編笠を上に、蓑を下に掛ける）
  const mino = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.6, 8),
    new THREE.MeshLambertMaterial({ color: 0x33291a, emissive: 0x060503 }));
  mino.scale.x = 0.42;
  mino.position.set(14.6, 1.02, HZ - 0.55);
  g.add(mino);
  const kasa = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.16, 9),
    new THREE.MeshLambertMaterial({ color: 0x4a3d24, emissive: 0x070503 }));
  kasa.scale.x = 0.5;
  kasa.position.set(14.6, 1.48, HZ - 0.55);
  g.add(kasa);

  // 柿の木二本（庭の隅と小道のわき）。実は秋にだけ色づく＝四季の衣替えに相乗り
  function kakiTree(x, z, s){
    const t = new THREE.Group();
    const kan = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.12, 1.9, 6), MAT.wallDk);
    kan.position.y = 0.95;
    kan.rotation.z = (rnd() - 0.5) * 0.16;
    t.add(kan);
    [[0.3, 1.8, 0.1, -0.9], [-0.28, 1.7, -0.1, 0.95]].forEach(e => {
      const eda = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.05, 0.9, 5), MAT.wallDk);
      eda.position.set(e[0], e[1], e[2]);
      eda.rotation.z = e[3];
      t.add(eda);
    });
    const haM = new THREE.MeshLambertMaterial({ color: 0x17251b });
    for (let i = 0; i < 4; i++){
      const b = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 6), haM);
      b.position.set((rnd() - 0.5) * 1.5, 2.0 + rnd() * 0.7, (rnd() - 0.5) * 1.3);
      b.scale.setScalar((0.8 + rnd() * 0.5) * s);
      t.add(b);
    }
    t.position.set(x, 0, z);
    g.add(t);
    return t;
  }
  kakiTree(18.5, 13.3, 1.1);
  kakiTree(12.5, 6.6, 0.9);
  const kakiM = new THREE.MeshLambertMaterial({ color: 0xb35a1e, emissive: 0x2a1004 });
  const MI = [];
  [[18.5, 13.3, 1.1], [12.5, 6.6, 0.9]].forEach(k => {
    for (let i = 0; i < 9; i++){
      MI.push([k[0] + (rnd() - 0.5) * 1.6 * k[2], 1.9 + rnd() * 0.9 * k[2],
               k[1] + (rnd() - 0.5) * 1.4 * k[2], 0, 0, 0, 0.09, 0.09, 0.09]);
    }
  });
  const kaki = kitaInst(new THREE.SphereGeometry(1, 6, 5), kakiM, MI);
  kaki.visible = (SHIKI.current === 'aki');
  SHIKI.extra.push(s => { kaki.visible = (s === 'aki'); });
  g.add(kaki);

  // 小柴垣（野宮と同じ作法。東の南寄りだけ空けて、小道からの入りにする）
  const shibaM = new THREE.MeshLambertMaterial({ map: TEX.shiba });
  const HEI = [                            // [中心x, 中心z, 長さ, z沿いか]
    [16.25, 14.4, 6.1, 0],                 // 北
    [16.25,  7.0, 6.1, 0],                 // 南
    [19.3, 10.7, 7.6, 1],                  // 西（庵の裏）
    [13.3, 11.95, 5.1, 1]                  // 東（z7.0〜9.4 を空けて木戸がわり）
  ];
  const heiBody = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 0.62, 0.17), shibaM, HEI.length);
  const heiTop  = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 0.05, 0.22), MAT.bamboo, HEI.length);
  const m4 = new THREE.Matrix4(), q0 = new THREE.Quaternion(), eu = new THREE.Euler(),
        vv = new THREE.Vector3(), sc = new THREE.Vector3();
  HEI.forEach((k, i) => {
    eu.set(0, k[3] ? Math.PI / 2 : 0, 0); q0.setFromEuler(eu);
    m4.compose(vv.set(k[0], 0.31, k[1]), q0, sc.set(k[2], 1, 1));
    heiBody.setMatrixAt(i, m4);
    m4.compose(vv.set(k[0], 0.645, k[1]), q0, sc.set(k[2] + 0.1, 1, 1));
    heiTop.setMatrixAt(i, m4);
  });
  heiBody.instanceMatrix.needsUpdate = true;
  heiTop.instanceMatrix.needsUpdate = true;
  g.add(heiBody, heiTop);

  // 標（入りのわき。南＝小道の側へ面を向ける）
  const hyou = new THREE.Mesh(new THREE.BoxGeometry(0.26, 1.05, 0.24),
    new THREE.MeshLambertMaterial({ color: 0x343a46 }));
  hyou.position.set(13.0, 0.53, 8.75);
  g.add(hyou);
  const hyouMen = new THREE.Mesh(new THREE.PlaneGeometry(0.24, 1.0),
    new THREE.MeshLambertMaterial({ map: hyouTexture('落柿舎', '去来の草庵'), emissive: 0x141620 }));
  hyouMen.rotation.y = Math.PI;
  hyouMen.position.set(13.0, 0.53, 8.625);
  g.add(hyouMen);

  g.traverse(o => { if (o.isSprite) o.raycast = function(){}; });
  scene.add(g);
  return { group: g, shoji: shoji, halo: halo, kaki: kaki };
})();

/* ㊸ 小倉山の中腹の多宝塔 ― 常寂光寺の見立て。
   堂の影は「近づくと現れる質量」、灯は fog:false（宿の灯と同じ作法）で
   霧の指数則に呑ませない。山肌の高さは峰の式から起こして据える */
const tahoto = (function(){
  const g = new THREE.Group();
  const TX = 8.0, TZ = 36.5;
  const q = 1 - Math.pow((TX - 14) / 34, 2) - Math.pow((TZ - 52) / 21.08, 2);
  const TY = 14.28 * Math.sqrt(Math.max(0, q)) - 0.25;   // 山肌にわずかに沈める
  const yaneM = new THREE.MeshLambertMaterial({ color: 0x212a3a, emissive: 0x060810 });
  const kabeM = new THREE.MeshLambertMaterial({ color: 0x2c3140, emissive: 0x070810 });
  const shita = new THREE.Mesh(new THREE.BoxGeometry(0.92, 0.5, 0.92), kabeM);
  shita.position.set(TX, TY + 0.25, TZ);
  const yane1 = new THREE.Mesh(new THREE.ConeGeometry(1.05, 0.42, 4), yaneM);
  yane1.rotation.y = Math.PI / 4;
  yane1.position.set(TX, TY + 0.68, TZ);
  const kame = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 6), kabeM);   // 亀腹（上層の白い椀）
  kame.scale.y = 0.5;
  kame.position.set(TX, TY + 0.9, TZ);
  const yane2 = new THREE.Mesh(new THREE.ConeGeometry(0.72, 0.36, 4), yaneM);
  yane2.rotation.y = Math.PI / 4;
  yane2.position.set(TX, TY + 1.2, TZ);
  const sorin = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.5, 5),
    new THREE.MeshLambertMaterial({ color: 0x6a5a30, emissive: 0x141006 }));
  sorin.position.set(TX, TY + 1.6, TZ);
  g.add(shita, yane1, kame, yane2, sorin);
  // 塔の灯（南面の連子窓ひとつぶん）
  const mado = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.2),
    new THREE.MeshBasicMaterial({ color: 0xffd9a0, transparent: true, opacity: 0.55, fog: false }));
  mado.rotation.y = Math.PI;
  mado.position.set(TX, TY + 0.3, TZ - 0.47);
  const hi = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.glow, color: 0xffc37a,
    transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  hi.scale.set(1.5, 1.5, 1);
  hi.position.set(TX, TY + 0.45, TZ - 0.52);
  g.add(mado, hi);
  g.traverse(o => { if (o.isSprite) o.raycast = function(){}; });
  scene.add(g);
  return { group: g, hi: hi, mado: mado, y: +TY.toFixed(2) };
})();

/* ㊾' 五重塔のもと ― 東山の書き割りに描かれた五重塔を二度たたくと渡れる隠しの間。
   月の都と同じ作法：ふだんは非表示（描画+0）、月白の幕で転換、なぞって見回し、
   帰りは元の場所・元のモードへ。実物の塔は東の峰（送り火の山・cx-40,cz-172,r48）の
   山肌に建てる＝立ち位置は峰の北斜面の高み。北を向けば渡月橋と町の灯を対岸から
   見返し、振り返れば塔の影が書き割りの淡い稜線を背に立ち上がる */
const goju = (function(){
  const g = new THREE.Group();
  // 東の峰（節㉙ mine の東の峰と同じ式）の山肌の高さ
  const pkY = (x, z) => {
    const q = 1 - Math.pow((x + 40) / 48, 2) - Math.pow((z + 172) / 28.8, 2);
    return 21.12 * Math.sqrt(Math.max(0, q));
  };
  // 実物の五重塔 ― 三重塔（5f）と同じ書法で五層に。訪ねた人だけが見上げる
  // （立ち位置から約13.5m＝五層が一望でき、初層の灯も届く間合い）
  const TX = -67.0, TZ2 = -171.0;
  const tou = new THREE.Group();
  const kidan = new THREE.Mesh(new THREE.BoxGeometry(8.4, 0.9, 8.4),
    new THREE.MeshLambertMaterial({ color: 0x232630 }));
  kidan.position.y = 0.45; tou.add(kidan);
  let baseY = 0.9;
  const tiers = [
    [6.6, 2.5, 5.4, 1.35], [5.8, 2.2, 4.8, 1.25], [5.0, 2.0, 4.2, 1.15],
    [4.2, 1.85, 3.6, 1.05], [3.4, 1.7, 3.1, 1.0]
  ];
  tiers.forEach(t => {
    const body = new THREE.Mesh(new THREE.BoxGeometry(t[0], t[1], t[0]), MAT.wallDk);
    body.position.y = baseY + t[1] / 2; tou.add(body);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(t[2], t[3], 4), MAT.roof);
    roof.rotation.y = Math.PI / 4;
    roof.position.y = baseY + t[1] - 0.12 + t[3] / 2; tou.add(roof);
    baseY += t[1] + t[3] * 0.52;
  });
  // 相輪
  const sorinM = new THREE.MeshLambertMaterial({ color: 0x6a5a30, emissive: 0x0e0a04 });
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 3.6, 6), sorinM);
  pole.position.y = baseY + 1.6; tou.add(pole);
  for (let i = 0; i < 7; i++){
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.5 - i * 0.05, 0.5 - i * 0.05, 0.08, 8), sorinM);
    ring.position.y = baseY + 0.7 + i * 0.34; tou.add(ring);
  }
  const hoju = new THREE.Mesh(new THREE.SphereGeometry(0.24, 8, 6), sorinM);
  hoju.position.y = baseY + 3.5; tou.add(hoju);
  // 初層のあかり（北面＝立ち位置と町の側。板は +z 向きのままでよい）
  const tobira = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 1.5), MAT.dark);
  tobira.position.set(0, 0.9 + 0.95, 6.6 / 2 + 0.01); tou.add(tobira);
  [-1.6, 1.6].forEach(x => {
    const mado = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.72), MAT.inner);
    mado.position.set(x, 0.9 + 1.05, 6.6 / 2 + 0.01); tou.add(mado);
  });
  const toGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.glow,
    transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false }));
  toGlow.scale.set(3.4, 2.2, 1);
  toGlow.position.set(0, 2.1, 6.6 / 2 + 0.4); tou.add(toGlow);
  const touY = pkY(TX, TZ2) - 0.4;                  // 山肌に少し沈めて据える
  tou.position.set(TX, touY, TZ2);
  g.add(tou);
  // 立ち位置わきの灯篭ひとつ（舞台の隅の灯篭と同じ書法）
  const stone2 = new THREE.MeshLambertMaterial({ color: 0x3a3f4c });
  const tY = pkY(-57.0, -162.2);
  const sao = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.52, 0.22), stone2);
  const hib = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.26, 0.3), MAT.inner);
  const kasa = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.09, 0.42), stone2);
  sao.position.set(-57.0, tY + 0.26, -162.2);
  hib.position.set(-57.0, tY + 0.65, -162.2);
  kasa.position.set(-57.0, tY + 0.83, -162.2);
  g.add(sao, hib, kasa);
  // 帰りの的＝実物の塔をすっぽり包む見えない箱
  const kaeriHit = new THREE.Mesh(new THREE.BoxGeometry(9.5, 27, 9.5),
    new THREE.MeshBasicMaterial({ visible: false }));
  kaeriHit.position.set(TX, touY + 13, TZ2);
  g.add(kaeriHit);
  g.traverse(o => { if (o.isSprite) o.raycast = function(){}; });
  g.visible = false;                                // ふだんは描かない（月面ステージと同じ）
  scene.add(g);
  // 入りの的＝書き割りに描かれた五重塔（板 440×77 at (0,20,-195)・テクスチャ 2048×360 の bx718 帯）
  const eHit = new THREE.Mesh(new THREE.BoxGeometry(27, 45, 4),
    new THREE.MeshBasicMaterial({ visible: false }));
  eHit.position.set(-65.7, 36.0, -193.5);
  scene.add(eHit);
  return { group: g, gojuHit: eHit, kaeriHit: kaeriHit, tou: tou };
})();

/* ㊹ 愛宕山の千日詣り ― 文月晦日の宵、山肌をつづら折りに登る提灯の列。
   千日分の御利益を頂きに夜通し愛宕さんへ登る夏の行事。列は頂の
   火伏の常夜灯（㉙）へ向かって、消えては麓からまた続く。
   小倉山（手前の峰・高さ14.3）に麓が隠れるので、列は y20 あたりから上に敷く */
const sennichi = (function(){
  const N = 34;
  const path = [];                 // [行程の位相, 揺らぎ] を控えて毎フレーム位置を起こす
  let seed = 731;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < N; i++) path.push([i / N, rnd() * Math.PI * 2]);
  const surf = (x, z) => {
    const q = 1 - Math.pow((x - 34) / 58, 2) - Math.pow((z - 74) / 34.8, 2);
    return 34.8 * Math.sqrt(Math.max(0, q));
  };
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
  const mat = new THREE.PointsMaterial({ map: TEX.glow, color: 0xffcf9e, size: 0.66,
    sizeAttenuation: true, transparent: true, opacity: 0.7,
    depthWrite: false, blending: THREE.AdditiveBlending, fog: false });
  const p = new THREE.Points(geo, mat);
  p.renderOrder = 2;               // 稜線板・峰の後に描く（送り火と同じ戒め）
  p.frustumCulled = false;         // 位置を毎フレーム書くため境界球が使えない
  let drift = 0;
  function step(dt, el){
    drift = (drift + dt * 0.004) % 1;         // 列はゆっくり登り続ける
    const a = geo.attributes.position.array;
    for (let i = 0; i < N; i++){
      const t = (path[i][0] + drift) % 1;
      const rho = 0.82 - t * 0.62;                                // 中腹 → 頂ちかく
      const ang = -0.38 + Math.sin(t * Math.PI * 5.6) * 0.26;     // つづら折り（南東の面）
      const x = 34 + 58 * rho * Math.sin(ang);
      const z = 74 - 34.8 * rho * Math.cos(ang);
      a[i*3]   = x - 0.4;
      a[i*3+1] = surf(x, z) + 0.4;
      a[i*3+2] = z - 0.7;                     // 面から手前へ浮かせて深度に呑ませない
    }
    geo.attributes.position.needsUpdate = true;
    mat.opacity = 0.62 + Math.sin(el * 2.1) * 0.1;
  }
  step(0.016, 0);
  const g = new THREE.Group();
  g.add(p);
  scene.add(g);
  return { group: g, step: step, N: N };
})();

/* ㊺ 鳥居形の送り火と広沢の池の灯篭流し ― 葉月十六日の宵。
   鳥居形は曼荼羅山の見立て＝小倉山の西の肩の斜面をキャンバスにする
   （如意ヶ嶽の「大」と同じ手）。同じ晩、広沢の池には灯篭が流れ、
   北東の遠い稜線にも左大文字と舟形がかすかに灯る */
const toriigata = (function(){
  const gg = new THREE.Group();              // 全体（世界座標のまま）
  const tor = new THREE.Group();             // 鳥居形だけ山肌へ移す
  let seed = 1616;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const jig = () => (rnd() - 0.5) * 0.26;
  const W = 5.8, H = 5.0;
  const pts = [];
  for (let i = 0; i < 9; i++){ const t = i / 8; pts.push([(-0.5 + t) * W + jig(), 0.94 * H + jig()]); }
  for (let i = 0; i < 7; i++){ const t = i / 6; pts.push([(-0.36 + t * 0.72) * W + jig(), 0.70 * H + jig()]); }
  [-0.30, 0.30].forEach(px => {
    for (let i = 0; i < 6; i++){ const t = i / 5; pts.push([px * W + jig(), t * 0.66 * H + jig()]); }
  });
  const A = [], B = [];
  pts.forEach((p2, i) => (i % 2 ? A : B).push(p2));
  const mk = arr => {
    const pos = new Float32Array(arr.length * 3);
    arr.forEach((p2, i) => { pos[i*3] = p2[0]; pos[i*3+1] = p2[1]; pos[i*3+2] = 0; });
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ map: TEX.glow, color: 0xff8f3e, size: 1.15,
      sizeAttenuation: true, transparent: true, opacity: 0.75,
      depthWrite: false, blending: THREE.AdditiveBlending, fog: false });
    const p2 = new THREE.Points(geo, mat);
    p2.renderOrder = 2;                      // 峰と稜線板の後に描く
    tor.add(p2);
    return mat;
  };
  const matA = mk(A), matB = mk(B);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.glow, color: 0xff7c30,
    transparent: true, opacity: 0.06, blending: THREE.AdditiveBlending,
    depthWrite: false, fog: false }));
  glow.scale.set(10, 8, 1);
  glow.position.set(0, 2.4, 0);
  glow.renderOrder = 2;
  tor.add(glow);
  // 小倉山の西の肩（表面 y≈8.8 の斜面）に立て、広沢の池の汀へ面を向ける
  tor.position.set(29.2, 9.6, 38.3);
  tor.rotation.y = -1.91;
  gg.add(tor);
  // 広沢の池の灯篭流し（北の汀から放たれ、月の道の方角へ流れてゆく）
  const NN = 12, ndata = [];
  for (let i = 0; i < NN; i++) ndata.push({ u: rnd(), lane: rnd() * 2 - 1, spd: 0.55 + rnd() * 0.5 });
  const ngeo = new THREE.BufferGeometry();
  ngeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(NN * 3), 3));
  const nagashi = new THREE.Points(ngeo, new THREE.PointsMaterial({ map: TEX.glow,
    color: 0xffc37a, size: 0.5, sizeAttenuation: true, transparent: true, opacity: 0.55,
    depthWrite: false, blending: THREE.AdditiveBlending }));
  nagashi.frustumCulled = false;             // 位置を毎フレーム書くため境界球が使えない
  gg.add(nagashi);
  // 遠い送り火（左大文字と舟形の見立て）。左大文字＝北東の低い稜線の上、
  // 舟形＝北北東の奥（北山の稜線板の手前）。低く置くと遍照寺山（h4.25＋木立）に
  // 呑まれて汀から見えない ―― 稜線より少し上に掲げるのが肝
  const tooka = [];
  [[-56, 12.3, 58.8, 2.6, 0.16], [-46, 24, 100, 2.4, 0.13]].forEach(k => {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.glow, color: 0xff9350,
      transparent: true, opacity: k[4], blending: THREE.AdditiveBlending,
      depthWrite: false, fog: false }));
    s.scale.set(k[3], k[3] * 0.7, 1);
    s.position.set(k[0], k[1], k[2]);
    s.renderOrder = 2;
    s.userData = { base: k[4] };
    gg.add(s); tooka.push(s);
  });
  function step(dt, el){
    matA.opacity = 0.68 + Math.sin(el * 6.2) * 0.18 + Math.sin(el * 12.7) * 0.06;
    matB.opacity = 0.68 + Math.sin(el * 7.3 + 2.0) * 0.18 + Math.sin(el * 10.9 + 1) * 0.06;
    glow.material.opacity = 0.06 + Math.sin(el * 1.5) * 0.02;
    tooka.forEach((s, k) => {
      s.material.opacity = s.userData.base + Math.sin(el * (2.1 + k * 0.7) + k * 2.4) * 0.04;
    });
    const a = ngeo.attributes.position.array;
    for (let i = 0; i < NN; i++){
      const d = ndata[i];
      d.u += dt * d.spd / 75;
      if (d.u > 1){ d.u = 0; d.lane = Math.random() * 2 - 1; }
      const z = 21.3 - d.u * 10.6;
      const allow = 8 * Math.sqrt(Math.max(0, 1 - Math.pow((z - 16) / 7, 2))) * 0.86;
      a[i*3]   = -15 + d.lane * allow * 0.8 + d.u * 1.2 + Math.sin(el * 0.5 + i) * 0.12;
      a[i*3+1] = 0.06;
      a[i*3+2] = z;
    }
    ngeo.attributes.position.needsUpdate = true;
    nagashi.material.opacity = 0.5 + Math.sin(el * 2.3) * 0.08;
  }
  step(0.016, 0);
  gg.traverse(o => { if (o.isSprite) o.raycast = function(){}; });
  scene.add(gg);
  return { group: gg, tor: tor, matA: matA, matB: matB, glow: glow,
           nagashi: nagashi, tooka: tooka, step: step, count: pts.length };
})();

/* ㊻ 人力車 ― 渡月橋の北詰に停め置き。梶棒を下ろし、
   小さな提灯をひとつ提げて客待ちの風情（嵐山の橋の袂の定番） */
const jinrikisha = (function(){
  const g = new THREE.Group();
  const kuro = new THREE.MeshLambertMaterial({ color: 0x14161c });   // 黒塗りの車体
  const shu  = new THREE.MeshLambertMaterial({ color: 0x8e3628 });   // 緋毛氈
  // 車輪（大きな二輪。輻は細い棒をまとめて一描画）
  const wheelGeo = new THREE.TorusGeometry(0.5, 0.036, 8, 20);
  [-1, 1].forEach(s => {
    const w = new THREE.Mesh(wheelGeo, kuro);
    w.rotation.y = Math.PI / 2;
    w.position.set(s * 0.58, 0.5, 0);
    g.add(w);
  });
  const SPK = [];
  [-1, 1].forEach(s => {
    for (let i = 0; i < 4; i++) SPK.push([s * 0.58, 0.5, 0, i * Math.PI / 4, 0, 0, 1, 0.96, 1]);
  });
  g.add(kitaInst(new THREE.BoxGeometry(0.02, 1, 0.03), kuro, SPK));
  const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.2, 6), kuro);
  axle.rotation.z = Math.PI / 2;
  axle.position.y = 0.5;
  g.add(axle);
  // 車体（座と背、畳んだ幌、足のせ）
  g.add(kitaInst(KITA_BOX, kuro, [
    [0, 0.72, -0.05, 0, 0, 0, 0.72, 0.3, 0.58],        // 座
    [0, 1.06, -0.32, -0.12, 0, 0, 0.72, 0.5, 0.07],    // 背
    [0, 0.36, 0.38, 0, 0, 0, 0.4, 0.04, 0.3],          // 踏み板
    [0, 1.22, -0.38, -0.5, 0, 0, 0.76, 0.06, 0.1],     // 幌（畳んで背の後ろに三段）
    [0, 1.3, -0.43, -0.9, 0, 0, 0.76, 0.06, 0.1],
    [0, 1.34, -0.5, -1.3, 0, 0, 0.76, 0.06, 0.1],
    [0, 0.16, 1.92, 0, 0, Math.PI / 2, 0.02, 0.78, 0.04]   // 梶棒の先の横木（z 軸まわりに倒して x 沿いに）
  ]));
  const mosen = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.06, 0.54), shu);
  mosen.position.set(0, 0.9, -0.05);
  g.add(mosen);
  // 梶棒（下ろして休ませる）
  g.add(kitaInst(new THREE.CylinderGeometry(0.022, 0.022, 1.75, 6), kuro, [
    [-0.33, 0.42, 1.1, 1.42, 0, 0, 1, 1, 1],
    [ 0.33, 0.42, 1.1, 1.42, 0, 0, 1, 1, 1]
  ]));
  // 提灯（右の梶棒に提げる。ゆらゆらは毎フレーム側で）
  const choG = new THREE.Group();
  const cho = new THREE.Mesh(GEO.lantern, new THREE.MeshBasicMaterial({ color: 0xffd28a }));
  cho.scale.set(0.62, 0.78, 0.62);

  choG.add(cho);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.glow, color: 0xffc37a,
    transparent: true, opacity: 0.24, blending: THREE.AdditiveBlending, depthWrite: false }));
  halo.scale.set(1.0, 1.0, 1);
  halo.position.y = -0.14;
  choG.add(halo);
  choG.position.set(0.36, 0.62, 1.45);
  g.add(choG);
  g.position.set(-4.1, 0, -85.7);
  g.rotation.y = -2.84;                      // 梶棒を橋の袂へ向けて停める
  g.traverse(o => { if (o.isSprite) o.raycast = function(){}; });
  scene.add(g);
  return { group: g, choG: choG, halo: halo };
})();

/* ㊼ 保津川下りの舟 ― 西の早瀬から岩のあいだを縫って下ってくる。
   桁下は南の橋脚間（z-109.2）を直角にくぐる＝屋形舟と同じ作法。
   橋の下では船頭が棹を寝かせる（本物の下り舟の仕草）。
   中之島の州は北の水路をまわって霧の向こうへ */
const kudari = (function(){
  const g = new THREE.Group();
  const wood = new THREE.MeshLambertMaterial({ map: TEX.woodDk });
  const boat = new THREE.Group();
  boat.add(kitaInst(KITA_BOX, wood, [
    [0, 0.10, 0, 0, 0, 0, 0.92, 0.14, 3.6],            // 底
    [-0.48, 0.26, 0, 0, 0, 0, 0.09, 0.3, 3.5],         // 舷（左）
    [0.48, 0.26, 0, 0, 0, 0, 0.09, 0.3, 3.5],          // 舷（右）
    [0, 0.28, -1.72, 0, 0, 0, 0.8, 0.22, 0.14],        // 艫
    [0, 0.32, 1.74, 0.35, 0, 0, 0.8, 0.2, 0.14]        // 舳（わずかに反らす）
  ]));
  const silk = new THREE.MeshLambertMaterial({ color: 0x14161f });
  // 船頭（艫に立って棹をさす）
  const sendo = new THREE.Group();
  const sBody = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.15, 1.0, 7), silk);
  sBody.position.y = 0.5;
  const sHead = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), silk);
  sHead.position.y = 1.12;
  sendo.add(sBody, sHead);
  sendo.position.set(0.18, 0.28, -1.45);
  const sao = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.028, 2.7, 6), MAT.bamboo);
  sao.position.set(0.34, 0.9, -1.3);
  sao.rotation.z = 0.4;
  // 客の影（うずくまる三人）
  boat.add(kitaInst(new THREE.SphereGeometry(0.22, 7, 6), silk, [
    [-0.16, 0.42, -0.2, 0, 0, 0, 1, 1.25, 1],
    [ 0.14, 0.42,  0.5, 0, 0, 0, 1, 1.25, 1],
    [-0.10, 0.42,  1.0, 0, 0, 0, 1, 1.25, 1]
  ]));
  const cho = new THREE.Mesh(GEO.lantern, new THREE.MeshBasicMaterial({ color: 0xffd28a }));
  cho.scale.set(0.6, 0.75, 0.6);
  cho.position.set(0, 0.75, 1.62);
  const choHalo = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.glow, color: 0xffc37a,
    transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false }));
  choHalo.scale.set(0.9, 0.9, 1);
  choHalo.position.set(0, 0.8, 1.62);
  boat.add(sendo, sao, cho, choHalo);
  g.add(boat);
  const curve = new THREE.CatmullRomCurve3([
    [58, -103.5], [45, -107], [30, -108.8], [10, -109.2],
    [-10, -109.2], [-22, -106.5], [-33, -97.5], [-56, -93.5]
  ].map(p2 => new THREE.Vector3(p2[0], 0, p2[1])), false, 'catmullrom', 0.3);
  const T = 210, RUN = 130;                  // 百三十秒かけて下り、しばらく間を置く
  function step(dt, el){
    const ph = el % T;
    if (ph > RUN){ boat.visible = false; return; }
    boat.visible = true;
    const u = ph / RUN;
    const pos = curve.getPointAt(u);
    boat.position.set(pos.x, -0.06 + Math.sin(el * 1.1) * 0.03, pos.z);
    const tan = curve.getTangentAt(u);
    boat.rotation.y = Math.atan2(tan.x, tan.z);
    boat.rotation.z = Math.sin(el * 0.9) * 0.02;
    const duck = Math.max(0, 1 - Math.abs(pos.x) / 5);          // 橋の下では棹を寝かせる
    sao.rotation.z = 0.4 + Math.sin(el * 1.5) * 0.25 * (1 - duck) + duck * 0.85;
    choHalo.material.opacity = 0.26 + Math.sin(el * 7 + 1) * 0.06;
  }
  step(0.016, 0);
  g.traverse(o => { if (o.isSprite) o.raycast = function(){}; });
  scene.add(g);
  return { group: g, boat: boat, curve: curve, T: T, RUN: RUN, step: step,
           state: function(){
             return { visible: boat.visible,
                      pos: boat.position.toArray().map(v => +v.toFixed(2)) };
           } };
})();

/* ㊽ 鹿威し ― 鐘楼の庭の隅。水がたまり、こぼれて、こおんとひとつ。
   受け口（西＝水盤の側）が上がって待ち、傾いて水を吐き、
   跳ね戻った尻が当たり石を打つ。当たりの瞬間に音（strikeShishi・9b） */
const shishiodoshi = (function(){
  const g = new THREE.Group();
  const CX = 17.9, CZ = -50.9;
  const stoneM = new THREE.MeshLambertMaterial({ color: 0x343a46 });
  const hachi = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.34, 0.34, 10), stoneM);
  hachi.position.set(CX - 0.72, 0.17, CZ);
  const mizu = new THREE.Mesh(new THREE.CircleGeometry(0.34, 12),
    new THREE.MeshBasicMaterial({ color: 0x39465e }));
  mizu.rotation.x = -Math.PI / 2;
  mizu.position.set(CX - 0.72, 0.345, CZ);
  // 支柱二本と、振り子になる竹筒
  const hashiraG = new THREE.Group();
  [-0.13, 0.13].forEach(dz => {
    const h = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.035, 0.6, 6), MAT.bamboo);
    h.position.set(CX - 0.28, 0.28, CZ + dz);
    hashiraG.add(h);
  });
  const yoku = new THREE.Group();
  const tsutsu = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.055, 1.0, 7), MAT.bamboo);
  tsutsu.rotation.z = Math.PI / 2;
  tsutsu.position.x = -0.06;                 // 受け口の側をやや長く
  yoku.add(tsutsu);
  yoku.position.set(CX - 0.28, 0.56, CZ);
  yoku.rotation.z = -0.28;
  const ate = new THREE.Mesh(new THREE.DodecahedronGeometry(0.16, 0), stoneM);
  ate.position.set(CX + 0.30, 0.12, CZ);
  // こぼれる水の糸（吐いているあいだだけ、ほの白く）
  const ito = new THREE.Mesh(new THREE.PlaneGeometry(0.05, 0.4),
    new THREE.MeshBasicMaterial({ map: TEX.glow, color: 0xbfd4ea, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false }));
  ito.position.set(CX - 0.78, 0.6, CZ);
  g.add(hachi, mizu, hashiraG, yoku, ate, ito);
  let lastPh = -1;
  function step(dt, el, strike){
    const ph = el % 12.0;
    let rot;
    if (ph < 8.8){
      rot = -0.28 + Math.sin(el * 0.9) * 0.008;                   // 受け口を上げて水を待つ
      ito.material.opacity += (0 - ito.material.opacity) * 0.2;
    } else if (ph < 9.3){
      rot = -0.28 + (ph - 8.8) / 0.5 * 0.62;                      // かたんと傾いて
      ito.material.opacity += (0.3 - ito.material.opacity) * 0.5; // 水を吐く
    } else if (ph < 9.9){
      rot = 0.34;
      ito.material.opacity += (0.22 - ito.material.opacity) * 0.3;
    } else if (ph < 10.25){
      rot = 0.34 - (ph - 9.9) / 0.35 * 0.62;                      // 跳ね戻って
      ito.material.opacity += (0 - ito.material.opacity) * 0.4;
    } else {
      const u = ph - 10.25;
      rot = -0.28 + Math.sin(u * 26) * 0.05 * Math.exp(-u * 5);   // こおん、と震えが残る
      if (lastPh >= 0 && lastPh < 10.25 && strike) strike();
      ito.material.opacity += (0 - ito.material.opacity) * 0.3;
    }
    yoku.rotation.z = rot;
    lastPh = ph;
  }
  scene.add(g);
  return { group: g, yoku: yoku, step: step,
           state: function(){ return { rot: +yoku.rotation.z.toFixed(3) }; } };
})();

/* ============================================================
   5r. 月の都（FX ㊾ tsukiusagi）― 月をダブルクリックで月面へ
   星のドームの内側（y120 の高み）にクレーターの原を常設し、
   ふだんは非表示（描画 0）。月白の幕で転換して立つ。
   不透明な月の原（半径 28）が視界の下半分を塞ぐので、眼下の町は
   幾何的に見えない（縁の俯角 3.3°より深いものはみな隠れる＝検算済み）。
   餅つきの兎が二羽、背の空には夜側の日本列島が灯の粒で光る地球。
   ============================================================ */
const tsukimen = (function(){
  const TG = new THREE.Group();
  const S = { x: 0, y: 120, z: -30 };            // 月の原の中心
  let seed = 1515;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  /* 月の原（クレーターは面に描き込む。地球照のわずかな青みも） */
  function tsukiharaTexture(){
    const c = cv(512, 512), g2 = c.getContext('2d');
    const base = g2.createRadialGradient(256, 256, 30, 256, 256, 260);
    base.addColorStop(0, '#6b7078');
    base.addColorStop(0.7, '#565b66');
    base.addColorStop(1, '#3c414c');
    g2.fillStyle = base; g2.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 900; i++){                       // 砂の斑
      const a = (0.03 + rnd() * 0.08).toFixed(2);
      g2.fillStyle = (rnd() > 0.5 ? 'rgba(255,255,255,' : 'rgba(10,12,18,') + a + ')';
      g2.fillRect(rnd() * 512, rnd() * 512, 2, 2);
    }
    for (let i = 0; i < 15; i++){                        // クレーター（北西の陽をうけた縁）
      const px = 40 + rnd() * 432, py = 40 + rnd() * 432, pr = 7 + rnd() * 30;
      g2.fillStyle = 'rgba(20,23,32,0.34)';
      g2.beginPath(); g2.arc(px, py, pr, 0, Math.PI * 2); g2.fill();
      g2.strokeStyle = 'rgba(226,230,238,0.30)';
      g2.lineWidth = 2 + pr * 0.12;
      g2.beginPath(); g2.arc(px, py, pr, Math.PI * 0.8, Math.PI * 1.75); g2.stroke();
      g2.strokeStyle = 'rgba(8,10,16,0.35)';
      g2.beginPath(); g2.arc(px, py, pr, Math.PI * -0.2, Math.PI * 0.75); g2.stroke();
    }
    return tex(c);
  }
  const hara = new THREE.Mesh(new THREE.CircleGeometry(28, 44),
    new THREE.MeshBasicMaterial({ map: tsukiharaTexture() }));
  hara.rotation.x = -Math.PI / 2;
  hara.position.set(S.x, S.y, S.z);
  TG.add(hara);

  /* 月の空の灯り（この一角にだけ届く。distance 55 で下界へは漏れない） */
  const tsukiHi = new THREE.PointLight(0xfdf4e2, 0.95, 55, 2);
  tsukiHi.position.set(S.x + 8, S.y + 11, S.z + 7);
  TG.add(tsukiHi);

  /* 遠い縁の丘とクレーターの土手・岩 */
  const okaM = new THREE.MeshLambertMaterial({ color: 0x4a505c, emissive: 0x111420 });
  const OKA = [];
  [[-16, -12, 6.5, 0.34], [14, -10, 5.0, 0.3], [20, -40, 7.5, 0.36],
   [-19, -46, 5.5, 0.3], [4, -52, 8.0, 0.4]].forEach(o => {
    OKA.push([S.x + o[0], S.y, S.z + o[1], 0, rnd() * Math.PI, 0, o[2], o[2] * o[3], o[2]]);
  });
  TG.add(kitaInst(new THREE.SphereGeometry(1, 14, 9, 0, Math.PI * 2, 0, Math.PI / 2), okaM, OKA));
  const iwaM = new THREE.MeshLambertMaterial({ color: 0x3f4550, emissive: 0x0d1016 });
  const IWA2 = [];
  for (let i = 0; i < 9; i++){
    const th = rnd() * Math.PI * 2, rr = 5 + rnd() * 16;
    const sz = 0.22 + rnd() * 0.5;
    IWA2.push([S.x + Math.cos(th) * rr, S.y + sz * 0.4, S.z + Math.sin(th) * rr,
               rnd() * 0.8, rnd() * Math.PI, rnd() * 0.8, sz, sz * (0.7 + rnd() * 0.5), sz]);
  }
  TG.add(kitaInst(new THREE.DodecahedronGeometry(1, 0), iwaM, IWA2));
  [[-4.6, 4.4, 2.1], [5.4, -4.8, 2.7]].forEach(k => {         // 近くのクレーターの土手（半ば砂に埋める）
    const t2 = new THREE.Mesh(new THREE.TorusGeometry(k[2], 0.2, 7, 24), okaM);
    t2.rotation.x = Math.PI / 2;
    t2.position.set(S.x + k[0], S.y - 0.05, S.z + k[1]);
    t2.scale.set(1, 1, 0.3);
    TG.add(t2);
  });

  /* 臼と餅 */
  const usu = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.62, 0.66, 12),
    new THREE.MeshLambertMaterial({ color: 0x3a2a1c, emissive: 0x0a0705 }));
  usu.position.set(S.x, S.y + 0.33, S.z - 1.6);
  TG.add(usu);
  const mochi = new THREE.Mesh(new THREE.SphereGeometry(0.36, 12, 9),
    new THREE.MeshLambertMaterial({ color: 0xf2efe6, emissive: 0x2e2c26 }));
  mochi.scale.set(1, 0.62, 1);
  mochi.position.set(S.x, S.y + 0.72, S.z - 1.6);
  TG.add(mochi);

  /* 兎（白い毛・紅い目。s で丈を変える） */
  const fur   = new THREE.MeshLambertMaterial({ color: 0xe9e7df, emissive: 0x23242a });
  const pinkM = new THREE.MeshLambertMaterial({ color: 0xc9939d, emissive: 0x2a1c20 });
  const eyeM  = new THREE.MeshLambertMaterial({ color: 0x7a2020, emissive: 0x3a0e0e });
  function usagi(s){
    const u = new THREE.Group();
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.44, 12, 10), fur);
    body.scale.set(0.95, 1.2, 0.9); body.position.y = 0.52;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.30, 12, 10), fur);
    head.position.set(0, 1.26, 0.14);
    // r128 に CapsuleGeometry は無い（既知）＝耳は楕円球のつぶしで
    [-1, 1].forEach(sgn => {
      const mimi = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), fur);
      mimi.scale.set(0.35, 1.15, 0.26);
      mimi.position.set(sgn * 0.13, 1.82, 0.02);
      mimi.rotation.z = -sgn * 0.14;
      u.add(mimi);
      const naka = new THREE.Mesh(new THREE.SphereGeometry(0.3, 7, 7), pinkM);
      naka.scale.set(0.17, 0.85, 0.12);
      naka.position.set(sgn * 0.13, 1.8, 0.1);
      naka.rotation.z = -sgn * 0.14;
      u.add(naka);
    });
    [-1, 1].forEach(sgn => {
      const me = new THREE.Mesh(new THREE.SphereGeometry(0.038, 7, 6), eyeM);
      me.position.set(sgn * 0.115, 1.30, 0.40);
      u.add(me);
    });
    const shippo = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 7), fur);
    shippo.position.set(0, 0.42, -0.42);
    u.add(shippo);
    const ashi = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 6), fur);
    ashi.scale.set(1.5, 0.5, 1.9);
    ashi.position.set(0, 0.09, 0.12);
    u.add(ashi);
    u.add(body, head);
    u.scale.setScalar(s);
    return u;
  }
  // 杵をふるう兎（臼の向こうに立ち、こちらを向く）
  const usagiA = usagi(1.0);
  usagiA.position.set(S.x, S.y, S.z - 0.68 - 0.02);
  usagiA.rotation.y = Math.PI;                    // 顔を南（カメラの側）へ
  TG.add(usagiA);
  // 腕と杵（肩の高さに支点。振りは rotation.x で）
  const kine = new THREE.Group();
  const eA = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.36, 7), fur);
  eA.rotation.z = Math.PI / 2;
  eA.position.set(0, 0, 0);
  kine.add(eA);
  const totte = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.048, 0.98, 7),
    new THREE.MeshLambertMaterial({ color: 0x4a3a26, emissive: 0x0c0906 }));
  totte.position.set(0, 0.44, 0);
  kine.add(totte);
  const kineHead = new THREE.Mesh(new THREE.CylinderGeometry(0.135, 0.15, 0.42, 9),
    new THREE.MeshLambertMaterial({ color: 0x5a4830 , emissive: 0x0e0b07 }));
  kineHead.position.set(0, 1.02, 0);
  kine.add(kineHead);
  kine.position.set(S.x + 0.12, S.y + 0.98, S.z - 0.95);   // わずかに脇へ＝休みの拍でも顔が隠れない
  kine.rotation.x = 0.5;
  TG.add(kine);
  // 手返しの兎（臼の西＝すこし奥に膝をついて、合いの手で餅をかえす。臼を隠さない立ち位置）
  const usagiB = usagi(0.80);
  usagiB.position.set(S.x - 1.15, S.y, S.z - 1.35);
  usagiB.rotation.order = 'YZX';                  // 向き（Y）の内側で前かがみ（X）を利かせる
  usagiB.rotation.y = Math.PI / 2 + 0.35;         // 顔を東南東＝臼へ
  TG.add(usagiB);

  /* 地球 ― 夜側の日本列島が灯の粒で光る。東の縁にあけの光、雲の筋、大気のかさ */
  function chikyuTexture(){
    const c = cv(512, 256), g2 = c.getContext('2d');
    const um = g2.createLinearGradient(0, 0, 0, 256);
    um.addColorStop(0, '#0e2238');
    um.addColorStop(0.5, '#123152');
    um.addColorStop(1, '#0c1f34');
    g2.fillStyle = um; g2.fillRect(0, 0, 512, 256);
    // 大陸（夜側なので影のかたまり。アジアの岸を日本の左に）
    g2.fillStyle = 'rgba(26,42,38,0.85)';
    g2.beginPath();
    g2.moveTo(300, 40); g2.quadraticCurveTo(340, 70, 352, 100);
    g2.quadraticCurveTo(360, 130, 344, 150); g2.quadraticCurveTo(320, 168, 300, 160);
    g2.quadraticCurveTo(280, 140, 284, 100); g2.quadraticCurveTo(286, 60, 300, 40);
    g2.closePath(); g2.fill();
    g2.beginPath();                                     // 朝鮮半島
    g2.moveTo(356, 92); g2.quadraticCurveTo(364, 102, 362, 114);
    g2.quadraticCurveTo(356, 122, 352, 116); g2.quadraticCurveTo(350, 100, 356, 92);
    g2.closePath(); g2.fill();
    // 日本列島（北東から南西へ弓なり。夜のからだ）
    g2.save();
