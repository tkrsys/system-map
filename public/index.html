/* 町屋・川・橋・山をクリックして選ぶ（レール時）／タップで歩き・なぞって見回す（散歩時） */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const clickRoots = houseGroups.concat([tenryuji.group, unryu.group, river, bridgeGroup, mtGroup]);
function setNdc(cx, cy){
  const r = renderer.domElement.getBoundingClientRect();
  ndc.x =  ((cx - r.left) / r.width)  * 2 - 1;
  ndc.y = -((cy - r.top)  / r.height) * 2 + 1;
}
function railPick(){
  const hit = ray.intersectObjects(clickRoots, true)[0];
  if (!hit) return -1;
  let o = hit.object, target = -1;
  while (o){
    const hi = houseGroups.indexOf(o);
    if (hi >= 0)                { target = hi;     break; }
    if (o === tenryuji.group)   { target = NH;     break; }
    if (o === unryu.group)      { target = NH;     break; }
    if (o === river)            { target = NH + 1; break; }
    if (o === bridgeGroup)      { target = NH + 2; break; }
    if (o === mtGroup)          { target = NH + 3; break; }
    o = o.parent;
  }
  return target;
}
let pDown = null, pDrag = false;
renderer.domElement.addEventListener('pointerdown', ev => {
  if (RIDE.entering >= 0) return;                  // 乗り込みの間だけ手を離す
  if (RIDE.on){                                    // 舟上＝なぞって見回すだけ
    pDown = { x: ev.clientX, y: ev.clientY };
    pDrag = false;
    return;
  }
  if (!walkMode){
    setNdc(ev.clientX, ev.clientY);
    ray.setFromCamera(ndc, camera);
    // 舫った舟はどこからでも乗り込める
    if (FX.fune && ray.intersectObject(funaasobi.boat, true)[0]){ enterRide(); return; }
    const t = railPick();
    if (t >= 0 && t !== idx) goTo(t, true);
    return;
  }
  pDown = { x: ev.clientX, y: ev.clientY };
  pDrag = false;
});
window.addEventListener('pointermove', ev => {
  if (!pDown || (!walkMode && !RIDE.on)) return;
  const dx = ev.clientX - pDown.x, dy = ev.clientY - pDown.y;
  if (!pDrag && Math.hypot(dx, dy) > 7) pDrag = true;
  if (pDrag){
    if (RIDE.on){
      RIDE.yaw   = Math.max(-2.4, Math.min(2.4, RIDE.yaw - dx * 0.0042));
      RIDE.pitch = Math.max(-0.5, Math.min(0.5, RIDE.pitch - dy * 0.0032));
    } else {
      WALK.yaw  -= dx * 0.0042;
      // 法堂の中では天井の龍まで見上げられるよう、上向きの上限をゆるめる
      const pUp = (camera.position.x >= -6.3 && camera.position.x <= -4.1 &&
                   camera.position.z <= -68.05 && camera.position.z >= -71.0) ? 1.25 : 0.5;
      WALK.pitch = Math.max(-0.55, Math.min(pUp, WALK.pitch - dy * 0.0032));
      WALK.manualUntil = elapsed + 2.0;
    }
    pDown = { x: ev.clientX, y: ev.clientY };
  }
});
window.addEventListener('pointerup', ev => {
  if (RIDE.on){ pDown = null; pDrag = false; return; }
  if (!walkMode || !pDown) return;
  const wasDrag = pDrag;
  pDown = null; pDrag = false;
  if (wasDrag) return;
  // タップ＝歩く。舫った舟なら乗り込み、町屋なら店先へ、それ以外は地面（or 橋板）の一点へ
  setNdc(ev.clientX, ev.clientY);
  ray.setFromCamera(ndc, camera);
  if (FX.fune && ray.intersectObject(funaasobi.boat, true)[0]){ enterRide(); return; }
  const hit = ray.intersectObjects(houseGroups, true)[0];
  if (hit){
    let o = hit.object;
    while (o && houseGroups.indexOf(o) === -1) o = o.parent;
    const hi = houseGroups.indexOf(o);
    if (hi >= 0){
      const h = HOUSES[hi];
      WALK.target = { x: h.side * 1.55, z: h.z };
      return;
    }
  }
  const g = groundPointFromRay();
  if (g) WALK.target = clampToWalkable(g.x, g.z);
});

/* ============================================================
   9b. 宵の音 ― Web Audio 合成（音源ファイル無し）
   川のせせらぎ・鈴虫とこおろぎ・笹の葉ずれ・遠くの鐘。
   ブラウザの自動再生制限があるため、初回は必ず「♪ 音を灯す」から。
   ============================================================ */
const SND = {
  on   : false,   // 全体（ボタンで灯す・消す）
  kawa : true,    // 川のせせらぎ（側溝の水音が基調。川端に近づくほど満ちる）
  mushi: true,    // 鈴虫・こおろぎ（通り側）
  sasa : true,    // 笹の葉ずれ（竹林の小径だけ）
  kane : true,    // 遠くの鐘（50〜110秒にひとつ。天龍寺の境内では近く響く）
  higu : true,    // 蜩（ひぐらし）。川に近づくほど山の声が届く
  furin: true     // 風鈴（茶店の軒。近くにいるときだけ）
};
let AC = null;                // AudioContext。初回の操作で作る
const sndNodes = {};
const sndBtn = document.getElementById('btn-snd');

/* 梵鐘：不整数倍音の重ね合わせ。低い唸りが長く残ると「遠くの鐘」になる */
function strikeKane(){
  if (!AC || !SND.on || !SND.kane || AC.state !== 'running') return false;
  const t = AC.currentTime;
  const f0 = 106 + Math.random() * 8;
  // [倍率, 強さ, 減衰秒]
  [[1, 1, 10], [2.0, 0.5, 7], [2.67, 0.3, 5], [3.01, 0.2, 4], [4.07, 0.12, 2.6], [5.43, 0.06, 1.8]]
  .forEach(p => {
    const o = AC.createOscillator();
    o.frequency.value = f0 * p[0] * (1 + (Math.random() - 0.5) * 0.004);
    const g = AC.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.16 * p[1], t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0004, t + p[2]);
    o.connect(g); g.connect(sndNodes.kaneBus);
    o.start(t); o.stop(t + p[2] + 0.1);
  });
  return true;
}

/* 出力の実効値（RMS）。耳で確かめられない環境向けの計測口 */
function sndLevel(){
  if (!AC) return null;
  const a = sndNodes.analyser;
  const buf = new Float32Array(a.fftSize);
  if (a.getFloatTimeDomainData){
    a.getFloatTimeDomainData(buf);
  } else {
    const b8 = new Uint8Array(a.fftSize);
    a.getByteTimeDomainData(b8);
    for (let i = 0; i < b8.length; i++) buf[i] = (b8[i] - 128) / 128;
  }
  let s = 0;
  for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
  return Math.sqrt(s / buf.length);
}

function buildSound(){
  AC = new (window.AudioContext || window.webkitAudioContext)();
  const master = AC.createGain(); master.gain.value = 0.55;
  const analyser = AC.createAnalyser(); analyser.fftSize = 2048;
  master.connect(analyser); analyser.connect(AC.destination);
  sndNodes.master = master; sndNodes.analyser = analyser;

  // ノイズの種（2秒ループ）。川・笹はここから濾して作る
  const nbuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const nd = nbuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const noiseSrc = () => {
    const s = AC.createBufferSource();
    s.buffer = nbuf; s.loop = true;
    return s;
  };

  // ── 川のせせらぎ：低いゴウ＋高めのサラサラを LFO でゆらす ──
  const kawaBus = AC.createGain(); kawaBus.gain.value = 0; kawaBus.connect(master);
  sndNodes.kawaBus = kawaBus;
  const low = AC.createBiquadFilter(); low.type = 'lowpass'; low.frequency.value = 620; low.Q.value = 0.7;
  const lowG = AC.createGain(); lowG.gain.value = 0.5;
  const n1 = noiseSrc(); n1.connect(low); low.connect(lowG); lowG.connect(kawaBus); n1.start();
  const band = AC.createBiquadFilter(); band.type = 'bandpass'; band.frequency.value = 1900; band.Q.value = 0.9;
  const burG = AC.createGain(); burG.gain.value = 0.28;
  const n2 = noiseSrc(); n2.connect(band); band.connect(burG); burG.connect(kawaBus); n2.start(0, 0.7);
  const lfo1 = AC.createOscillator(); lfo1.frequency.value = 0.22;
  const lfo1G = AC.createGain(); lfo1G.gain.value = 0.16;
  lfo1.connect(lfo1G); lfo1G.connect(burG.gain); lfo1.start();

  // ── 笹の葉ずれ：竹林の小径でだけ、風がまとまって通る ──
  const sasaG = AC.createGain(); sasaG.gain.value = 0; sasaG.connect(master);
  sndNodes.sasaG = sasaG;
  const sasaF = AC.createBiquadFilter(); sasaF.type = 'bandpass'; sasaF.frequency.value = 2700; sasaF.Q.value = 0.5;
  const windG = AC.createGain(); windG.gain.value = 0.6;
  const n3 = noiseSrc(); n3.connect(sasaF); sasaF.connect(windG); windG.connect(sasaG); n3.start(0, 1.3);
  const lfo2 = AC.createOscillator(); lfo2.frequency.value = 0.13;
  const lfo2G = AC.createGain(); lfo2G.gain.value = 0.4;
  lfo2.connect(lfo2G); lfo2G.connect(windG.gain); lfo2.start();

  // ── 鈴虫二匹とこおろぎ一匹 ──
  const mushiBus = AC.createGain(); mushiBus.gain.value = 0; mushiBus.connect(master);
  sndNodes.mushiBus = mushiBus;
  const voices = [
    { f: 4300, trem: 32, pan: -0.4, amp: 0.05, kind: 'suzu' },
    { f: 4800, trem: 27, pan:  0.5, amp: 0.04, kind: 'suzu' },
    { f: 2150, trem:  0, pan:  0.15, amp: 0.06, kind: 'koro' }
  ];
  voices.forEach(v => {
    const o = AC.createOscillator(); o.frequency.value = v.f;
    const trm = AC.createGain(); trm.gain.value = v.trem ? 0.55 : 1.0;
    if (v.trem){
      const to = AC.createOscillator(); to.frequency.value = v.trem;
      const tg = AC.createGain(); tg.gain.value = 0.45;
      to.connect(tg); tg.connect(trm.gain); to.start();
    }
    const env = AC.createGain(); env.gain.value = 0;
    o.connect(trm); trm.connect(env); o.start();
    let tail = env;
    if (AC.createStereoPanner){
      const pan = AC.createStereoPanner(); pan.pan.value = v.pan;
      env.connect(pan); tail = pan;
    }
    tail.connect(mushiBus);
    v.env = env;
    // 鳴いて、休んで、また鳴く（フラグが消えている間は待つだけ）
    const chirp = () => {
      let next;
      if (SND.on && SND.mushi && AC.state === 'running'){
        const t = AC.currentTime, e = v.env.gain;
        e.cancelScheduledValues(t);
        e.setValueAtTime(0, t);
        if (v.kind === 'suzu'){
          const dur = 0.6 + Math.random() * 0.7;
          e.linearRampToValueAtTime(v.amp, t + 0.06);
          e.setValueAtTime(v.amp, t + dur - 0.12);
          e.linearRampToValueAtTime(0, t + dur);
          next = dur + 0.4 + Math.random() * 1.6;
        } else {
          const n = 3 + Math.floor(Math.random() * 3);   // コロコロ…と三〜五連
          for (let k = 0; k < n; k++){
            const s = t + k * 0.14;
            e.linearRampToValueAtTime(v.amp, s + 0.02);
            e.linearRampToValueAtTime(0, s + 0.10);
          }
          next = n * 0.14 + 0.8 + Math.random() * 1.8;
        }
      } else next = 0.8;
      setTimeout(chirp, next * 1000);
    };
    chirp();
  });

  // ── 蜩（ひぐらし）：カナカナ…と連なって、すこし下がりながら遠ざかる ──
  const higuBus = AC.createGain(); higuBus.gain.value = 0; higuBus.connect(master);
  sndNodes.higuBus = higuBus;
  [{ f: 3950, pan: -0.75 }, { f: 3600, pan: 0.7 }].forEach((v, vi) => {
    const o = AC.createOscillator(); o.frequency.value = v.f;
    const env = AC.createGain(); env.gain.value = 0;
    o.connect(env); o.start();
    let tail = env;
    if (AC.createStereoPanner){
      const pan = AC.createStereoPanner(); pan.pan.value = v.pan;
      env.connect(pan); tail = pan;
    }
    tail.connect(higuBus);
    const series = () => {
      let next;
      if (SND.on && SND.higu && AC.state === 'running'){
        const t = AC.currentTime;
        const n = 12 + Math.floor(Math.random() * 8);
        for (let k = 0; k < n; k++){
          const s = t + k * 0.115;
          const a = 0.05 * (k < 3 ? (k + 1) / 3 : (k > n - 5 ? (n - k) / 5 : 1));
          env.gain.setValueAtTime(0, s);
          env.gain.linearRampToValueAtTime(a, s + 0.025);
          env.gain.linearRampToValueAtTime(0, s + 0.095);
          o.frequency.setValueAtTime(v.f * (1 - k * 0.004), s);
        }
        next = n * 0.115 + 14 + Math.random() * 22;
      } else next = 1.2;
      setTimeout(series, next * 1000);
    };
    setTimeout(series, (3 + vi * 9 + Math.random() * 6) * 1000);
  });

  // ── 風鈴：茶店の軒で、風の気まぐれにちりん。ときどき二度鳴り ──
  const furinBus = AC.createGain(); furinBus.gain.value = 0; furinBus.connect(master);
  sndNodes.furinBus = furinBus;
  const strikeFurin = () => {
    if (!AC || !SND.on || !SND.furin || AC.state !== 'running') return false;
    const t = AC.currentTime;
    [[2950, 0.11, 1.5], [4400, 0.065, 1.2], [5900, 0.04, 0.9], [7300, 0.024, 0.7]]
    .forEach(p => {
      const o = AC.createOscillator();
      o.frequency.value = p[0] * (1 + (Math.random() - 0.5) * 0.01);
      const g = AC.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(p[1], t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0004, t + p[2]);
      o.connect(g); g.connect(furinBus);
      o.start(t); o.stop(t + p[2] + 0.1);
    });
    return true;
  };
  sndNodes.strikeFurin = strikeFurin;
  const furinLoop = () => {
    strikeFurin();
    if (Math.random() < 0.35) setTimeout(strikeFurin, 160 + Math.random() * 120);
    setTimeout(furinLoop, (5 + Math.random() * 9) * 1000);
  };
  setTimeout(furinLoop, (4 + Math.random() * 5) * 1000);

  // ── 遠くの鐘：低域を残して、短い残響をひとさじ ──
  const kaneBus = AC.createGain(); kaneBus.gain.value = 1;
  sndNodes.kaneBus = kaneBus;
  const kaneLp = AC.createBiquadFilter(); kaneLp.type = 'lowpass'; kaneLp.frequency.value = 950;
  sndNodes.kaneLp = kaneLp;
  kaneBus.connect(kaneLp); kaneLp.connect(master);
  const dly = AC.createDelay(1.0); dly.delayTime.value = 0.23;
  const fb = AC.createGain(); fb.gain.value = 0.32;
  const wet = AC.createGain(); wet.gain.value = 0.22;
  kaneLp.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(master);
  const kaneLoop = () => {
    strikeKane();
    setTimeout(kaneLoop, (50 + Math.random() * 60) * 1000);
  };
  setTimeout(kaneLoop, (12 + Math.random() * 8) * 1000);   // 最初のひとつは灯して十数秒後
}

/* 場所で聞こえ方が変わる（毎フレーム。灯していない間は何もしない） */
function updateSoundMix(){
  if (!AC || !SND.on) return;
  const z = camera.position.z, x = camera.position.x;
  // 川：通りでは側溝の水音がかすかに、z-30 から川の気配、川端 z-78 で満ちる
  const rv = Math.min(1, Math.max(0, (-z - 30) / 48));
  const kawaT = SND.kawa ? 0.05 + 0.20 * rv * rv : 0;
  // 虫：通りで満ち、川端では控えめに
  const mushiT = SND.mushi ? 1 - 0.75 * Math.min(1, Math.max(0, (-z - 48) / 32)) : 0;
  // 笹：竹林（z-56〜-78）でだけ山なりに
  const sasaT = SND.sasa ? 0.14 * Math.max(0, 1 - Math.abs(-z - 67) / 13) : 0;
  // 蜩：山と川が近づくほど、対岸の声が届く
  const hf = Math.min(1, Math.max(0, (-z - 44) / 36));
  const higuT = SND.higu ? 0.30 * hf : 0;
  // 風鈴：茶店の軒（10.8, -82.4）の近くにいるときだけ
  const fd = Math.hypot(x - 10.8, z + 82.4);
  const fg = Math.max(0, 1 - fd / 26);
  const furinT = SND.furin ? 0.6 * fg * fg : 0;
  // 鐘：天龍寺の境内にいるあいだは近く、すこし明るく響く
  const inTera = x < -7.3 && z > -77 && z < -58;
  const kaneG = inTera ? 1.75 : 1.0;
  const kaneF = inTera ? 1350 : 950;
  const k = 0.06;
  sndNodes.kawaBus.gain.value  += (kawaT  - sndNodes.kawaBus.gain.value)  * k;
  sndNodes.mushiBus.gain.value += (mushiT - sndNodes.mushiBus.gain.value) * k;
  sndNodes.sasaG.gain.value    += (sasaT  - sndNodes.sasaG.gain.value)    * k;
  sndNodes.higuBus.gain.value  += (higuT  - sndNodes.higuBus.gain.value)  * k;
  sndNodes.furinBus.gain.value += (furinT - sndNodes.furinBus.gain.value) * k;
  sndNodes.kaneBus.gain.value  += (kaneG  - sndNodes.kaneBus.gain.value)  * k;
  sndNodes.kaneLp.frequency.value += (kaneF - sndNodes.kaneLp.frequency.value) * k;
}

function syncSndBtn(){
  sndBtn.textContent = SND.on ? '♪ 音を消す' : '♪ 音を灯す';
  sndBtn.setAttribute('aria-pressed', String(SND.on));
}
sndBtn.addEventListener('click', () => {
  if (!AC) buildSound();
  SND.on = !SND.on;
  if (SND.on) AC.resume(); else AC.suspend();
  syncSndBtn();
  layoutBottom();   // ボタン幅が変わって段組みが動くことがある
});
// 画面を離れている間は鳴らさない
document.addEventListener('visibilitychange', () => {
  if (!AC || !SND.on) return;
  if (document.hidden) AC.suspend(); else AC.resume();
});

/* ============================================================
   10. 毎フレーム
   ============================================================ */
const clock = new THREE.Clock();
let elapsed = 0;

function update(dt){
  elapsed += dt;
  if (RIDE.on || RIDE.entering >= 0) updateRide(dt);
  else if (walkMode) updateWalk(dt);
  else updateCamera(dt);

  // 提灯：ゆらぐ灯り。停留中の一軒だけ明るく
  houseGroups.forEach((g, i) => {
    const u = g.userData;
    const flick = 0.82 + Math.sin(elapsed * 3.1 + i * 1.7) * 0.09
                       + Math.sin(elapsed * 7.9 + i * 3.3) * 0.05;
    const focus = (i === idx && phase === 'dwell') ? 1.45 : 1.0;
    u.halo.material.opacity = 0.5 * flick * focus;
    u.pool.material.opacity = 0.20 * flick * focus;
    u.lantern.scale.set(1, 1.28 + Math.sin(elapsed * 2.2 + i) * 0.015, 1);
    // 暖簾が風に揺れる
    u.noren.forEach((p, k) => {
      p.rotation.x = Math.sin(elapsed * 1.25 + k * 0.9 + i) * 0.11;
    });
  });

  // 灯りは近い三軒へ移す
  const order = houseGroups
    .map((g, i) => ({ i: i, d: g.userData.lanternWorld.distanceTo(camera.position) }))
    .sort((a, b) => a.d - b.d);
  roamLights.forEach((L, k) => {
    const o = order[k];
    if (!o){ L.intensity = 0; return; }
    const w = houseGroups[o.i].userData.lanternWorld;
    L.position.copy(w);
    const flick = 0.85 + Math.sin(elapsed * 3.4 + o.i * 2.1) * 0.12;
    L.intensity = (o.i === idx ? 1.55 : 1.05) * flick;
  });

  // 蛍がふわふわ漂う（通り・川辺の二群）
  [fireflies, kawaFlies].forEach(f => {
    const p = f.geometry.attributes.position;
    const ph = f.userData.phase, base = f.userData.base;
    for (let i = 0; i < ph.length; i++){
      p.array[i*3]   = base[i*3]   + Math.sin(elapsed * 0.55 + ph[i]) * 0.55;
      p.array[i*3+1] = base[i*3+1] + Math.sin(elapsed * 0.42 + ph[i] * 1.7) * 0.32;
      p.array[i*3+2] = base[i*3+2] + Math.cos(elapsed * 0.38 + ph[i]) * 0.5;
    }
    p.needsUpdate = true;
  });

  // 側溝の水が流れる
  waterStrips.forEach(m => { m.material.map.offset.y = (elapsed * 0.045) % 1; });

  // 桂川：水がゆっくり下流へ、月の道がゆらぐ
  river.material.map.offset.x = (elapsed * 0.006) % 1;
  moonPath.material.opacity = 0.14 + Math.sin(elapsed * 0.5) * 0.04;
  moonPath.scale.x = 1 + Math.sin(elapsed * 0.8) * 0.07;

  // 川舟：ゆったり上下、篝火と提灯のまたたき（またたき量は水鏡と共有）
  boats.forEach((b, k) => {
    b.position.y = -0.07 + Math.sin(elapsed * 0.8 + b.userData.phase) * 0.03;
    b.rotation.z = Math.sin(elapsed * 0.66 + b.userData.phase) * 0.022;
    b.position.x = b.userData.baseX + Math.sin(elapsed * 0.05 + k * 2) * 1.6;
    const flick = 0.8 + Math.sin(elapsed * 9 + k * 5) * 0.16 + Math.sin(elapsed * 23) * 0.06;
    b.userData.flick = flick;
    b.userData.flame.material.opacity = (k === 0 ? 0.62 : 0.4) * flick;
  });

  // 石灯篭のまたたき
  touros.forEach((t2, k) => {
    t2.halo.material.opacity = 0.30 + Math.sin(elapsed * 3.7 + k * 1.9) * 0.07;
  });

  /* ―― 川辺の演出十三点（生き死には毎フレーム FX を見る＝赤入れ中に切替できる） ―― */
  // ① 川面のきらめき：三群が位相をずらして明滅
  glintClouds.forEach(p => {
    p.visible = FX.kirameki;
    const tw = Math.sin(elapsed * 1.9 + p.userData.ph);
    p.material.opacity = Math.max(0, tw) * 0.55;
    p.material.size = 0.18 + Math.max(0, tw) * 0.10;
  });
  // ② 二層目の水流は少し速く、わずかに斜めへ
  if (river2){
    river2.visible = FX.nagare2;
    river2.material.map.offset.x = (elapsed * 0.013) % 1;
    river2.material.map.offset.y = (elapsed * 0.0022) % 1;
  }
  // ③ 川霧が水面を這って流れる
  kawagiris.forEach(s => {
    s.visible = FX.kawagiri;
    const u = s.userData;
    s.position.x = u.baseX + Math.sin(elapsed * 0.05 + u.ph) * 7;
    s.material.opacity = u.baseO * (0.75 + Math.sin(elapsed * 0.18 + u.ph * 2) * 0.25);
  });
  // ④ 灯篭流し：西から東へ川面をわたる。灯の照りは Points でまとめて一描画
  if (nagashiGlow){
    nagashiGlow.visible = FX.touronagashi;
    const gp = nagashiGlow.geometry.attributes.position;
    nagashiTouro.forEach((g, i) => {
      g.visible = FX.touronagashi;
      const u = g.userData;
      const x = -58 + ((u.off + elapsed * u.v) % 116);
      g.position.set(x, -0.16 + Math.sin(elapsed * 1.1 + u.ph) * 0.02, u.z);
      g.rotation.y = elapsed * 0.12 + u.ph;
      gp.array[i*3] = x; gp.array[i*3+1] = g.position.y + 0.12; gp.array[i*3+2] = u.z;
    });
    gp.needsUpdate = true;
    nagashiGlow.material.opacity = 0.42 + Math.sin(elapsed * 2.6) * 0.08;
  }
  // ⑤ 水鏡：舟は動くので光の帯を毎フレーム追わせる
  if (streakKagari){
    mirrorStreaks.forEach(m => { m.visible = FX.mizukagami; });
    streakKagari.position.set(boats[0].position.x - 2.29, -0.205, boats[0].position.z + 4.5);
    streakKagari.material.opacity = 0.16 * (boats[0].userData.flick || 1);
    streakYakata.position.set(boats[1].position.x + 1.04, -0.205, boats[1].position.z + 3.5);
    streakYakata.material.opacity = 0.10 * (boats[1].userData.flick || 1);
  }
  // ⑥ 篝火の火の粉が舞い上がる
  if (hinoko){
    hinoko.visible = FX.hinoko;
    const hp = hinoko.geometry.attributes.position;
    hinoko.userData.info.forEach((sp, i) => {
      const h = (sp.off + elapsed * sp.v) % 1.7;
      hp.array[i*3]   = -2.32 + Math.sin(elapsed * 1.8 + sp.sw) * 0.08 * h + h * 0.22;
      hp.array[i*3+1] = 0.80 + h;
      hp.array[i*3+2] = Math.sin(elapsed * 1.4 + sp.sw * 2) * 0.09 * h;
    });
    hp.needsUpdate = true;
    hinoko.material.opacity = 0.55 + Math.sin(elapsed * 11) * 0.2;
  }
  // ⑦ 宵の人影が橋を行き交う（端まで来たら向き直る）
  walkers.forEach((w, k) => {
    w.visible = FX.hitokage;
    if (!FX.hitokage) return;
    const u = w.userData;
    u.t += u.dir * u.v * dt;
    if (u.t >= u.t1){ u.t = u.t1; u.dir = -1; }
    else if (u.t <= u.t0){ u.t = u.t0; u.dir = 1; }
    const face = u.dir > 0 ? Math.PI : 0;
    u.face += (face - u.face) * Math.min(1, dt * 2.5);
    const step = Math.sin(elapsed * 3.1 + k * 2.4);
    w.position.set(u.lane, deckY(u.t) + 0.08 + Math.abs(step) * 0.02, BRIDGE_Z0 - u.t * BRIDGE_L);
    w.rotation.y = u.face;
    w.rotation.z = step * 0.018;
    if (u.cho){
      u.cho.position.z = 0.14 + Math.sin(elapsed * 2.2) * 0.06;
      u.choHalo.position.copy(u.cho.position);
      u.choHalo.material.opacity = 0.5 * (0.82 + Math.sin(elapsed * 8.7) * 0.18);

  // 提灯の灯は欄干を越えて東の水面にもこぼれる
  if (streakChochin && walkers.length > 1){
    streakChochin.visible = FX.mizukagami && FX.hitokage;
    streakChochin.position.set(2.4, -0.205, walkers[1].position.z + 2.6);
    streakChochin.material.opacity = 0.07 * (0.85 + Math.sin(elapsed * 8.7) * 0.15);
  }
  // ⑧ 木立は生き死にだけ
  kodachiPlanes.forEach(m => { m.visible = FX.kodachi; });
  // ⑨ 宿の灯が峰ごとに交互またたき
  yadoClouds.forEach(p => {
    p.material.opacity = FX.yadonoto
      ? 0.78 + Math.sin(elapsed * 1.15 + p.userData.ph) * 0.18 : 0.9;
  });
  // ⑩ 山霞がゆっくり流れて呼吸する
  kasumis.forEach(m => {
    if (!FX.kasumi) return;
    const u = m.userData;
    m.position.x = u.baseX + Math.sin(elapsed * 0.03 + u.ph) * 6;
    m.material.opacity = u.baseO * (0.8 + Math.sin(elapsed * 0.11 + u.ph) * 0.3);

  // ⑪ 月暈の呼吸
  if (moonFx.ring){
    moonFx.ring.visible = FX.tsukigasa;
    if (FX.tsukigasa){
      moonFx.ring.material.opacity = 0.045 + Math.sin(elapsed * 0.21) * 0.025;

  // ⑫ 流れ星：待って、流れて、また待つ
  if (meteor){
    meteor.g.visible = FX.nagareboshi;
    if (FX.nagareboshi){
      if (meteor.life < 0){
        meteor.wait -= dt;
        if (meteor.wait <= 0){
          const r = meteor.rnd;
          meteor.g.position.set(-5 + r() * 85, 52 + r() * 22, -150 - r() * 25);
          const ang = 0.5 + r() * 0.5;
          const spd = 26 + r() * 14;
          meteor.vx = -Math.cos(ang) * spd;
          meteor.vy = -Math.sin(ang) * spd;
          meteor.g.rotation.z = Math.atan2(-meteor.vy, -meteor.vx);
          meteor.life = 0;
          meteor.dur = 0.8 + r() * 0.4;
        }
      } else {
        meteor.life += dt;
        const pr = meteor.life / meteor.dur;
        meteor.g.position.x += meteor.vx * dt;
        meteor.g.position.y += meteor.vy * dt;
        const o = Math.max(0, pr < 0.2 ? pr / 0.2 : (1 - pr) / 0.8);
        meteor.head.material.opacity = o * 0.9;
        meteor.tail.material.opacity = o * 0.4;

  // ㉖㉗㉘ 藪の道：垣・土の道・高木。土の道のときは側溝を隠す

  chikurin.moonGroup.visible = FX.chikurin && FX.tsukimore;
  if (chikurin.moonGroup.visible){

  if (FX.kawadoko){
    kawadoko.halos.forEach((h, k) => {

  }
  hokora.group.visible = FX.hokora;
  if (FX.hokora){
    hokora.candle.material.opacity = 0.20 + Math.sin(elapsed * 8.1) * 0.05

  }
  andon.group.visible = FX.andon;
  if (FX.andon){
    andon.halo.material.opacity = 0.30 + Math.sin(elapsed * 3.9) * 0.07;

  }
  // 塔の舞台：灯篭と初層の灯がまたたく
  butai.halos.forEach((h, k) => {
    h.material.opacity = 0.30 + Math.sin(elapsed * 3.5 + k * 2.6) * 0.07;
  });
  butai.glowSprites[1].material.opacity = 0.24 + Math.sin(elapsed * 2.9) * 0.05;
  // ⑳ 天龍寺：門提灯・障子・灯篭のまたたき／㉑ 曹源池の水鏡の呼吸
  tenryuji.group.visible = FX.tenryuji;
  if (FX.tenryuji){
    tenryuji.monHalo.material.opacity = 0.34 + Math.sin(elapsed * 3.3 + 0.7) * 0.07;

    tenryuji.halos.forEach((h, k) => {
      h.material.opacity = 0.30 + Math.sin(elapsed * 3.6 + k * 2.3) * 0.07;

    tenryuji.moonStreak.scale.x = 1 + Math.sin(elapsed * 0.8 + 1.2) * 0.08;
    tenryuji.warmStreak.material.opacity = 0.10 + Math.sin(elapsed * 2.4) * 0.03;
    tenryuji.shimmer.material.opacity = 0.30 + Math.max(0, Math.sin(elapsed * 1.7)) * 0.25;
  }
  // ㉒ 境の景：柳が梢ごとそよぐ・木戸の提灯／㉓ 茶店の行灯
  sakai.group.visible = FX.sakai;
  if (FX.sakai){
    sakai.yanagi.forEach((y, k) => {
      y.rotation.z = Math.sin(elapsed * 0.5 + k * 1.7) * 0.045;
      y.rotation.x = Math.sin(elapsed * 0.37 + k * 2.4) * 0.025;
    });
    sakai.kidoHalo.material.opacity = 0.28 + Math.sin(elapsed * 3.8 + 1.1) * 0.06;
  }
  chamise.group.visible = FX.chamise;
  if (FX.chamise){
    chamise.halo.material.opacity = 0.30 + Math.sin(elapsed * 4.2 + 2.2) * 0.07;
    chamise.pool.material.opacity = 0.10 + Math.sin(elapsed * 4.2 + 2.9) * 0.03;
  }
  // ㉔ 屋形舟：舫っているあいだ桟橋でゆれる／桟橋の行灯のまたたき
  funaasobi.group.visible = FX.fune;
  funaasobi.boat.visible = FX.fune;
  if (FX.fune){
    funaasobi.anHalo.material.opacity = 0.30 + Math.sin(elapsed * 4.4 + 1.4) * 0.07;
    if (!rideActive()){
      funaasobi.boat.position.y = -0.07 + Math.sin(elapsed * 0.8 + 1.1) * 0.03;
      funaasobi.boat.rotation.z = Math.sin(elapsed * 0.66 + 1.1) * 0.02;
    }
  }
  // ㉕ 雲龍図：蝋燭のまたたきと、立ち位置を追う瞳（八方睨み）
  unryu.group.visible = FX.unryu;
  if (FX.unryu){
    unryu.candles.forEach((s, k) => {
      s.material.opacity = 0.20 + Math.sin(elapsed * 7.3 + k * 2.4) * 0.05;
    });
    unryu.pupils.forEach(p => {
      const dx = camera.position.x - p.cx, dz = camera.position.z - p.cz;
      const d = Math.hypot(dx, dz) || 1;
      const s = Math.min(0.052, d * 0.02) / d;
      p.mesh.position.x = p.cx + dx * s;
      p.mesh.position.z = p.cz + dz * s;
    });
  }
  // 四季：舞うもの（花びら・落ち葉・雪）だけ毎フレーム漂わせる
  [SHIKI.petals, SHIKI.leaves, SHIKI.snow].forEach(pt => {
    if (!pt.visible) return;
    const pp = pt.geometry.attributes.position;
    const ud = pt.userData;
    for (let i = 0; i < ud.ph.length; i++){
      let y = pp.array[i*3+1] - ud.vy[i] * dt;
      if (y < 0) y += ud.ytop;
      pp.array[i*3+1] = y;
      pp.array[i*3] += Math.sin(elapsed * 0.8 + ud.ph[i]) * dt * 0.5;
    }
    pp.needsUpdate = true;
  });
  // ⑲ 送り火：葉月十六日の宵にだけ「大」が燃える（試灯は __machiya.FX.okuribi）
  okuribi.group.visible = FX.okuribi;
  if (FX.okuribi){
    okuribi.matA.opacity = 0.72 + Math.sin(elapsed * 6.7) * 0.18 + Math.sin(elapsed * 13.1) * 0.06;
    okuribi.matB.opacity = 0.72 + Math.sin(elapsed * 7.9 + 2.1) * 0.18 + Math.sin(elapsed * 11.3 + 1) * 0.06;
    okuribi.glow.material.opacity = 0.07 + Math.sin(elapsed * 1.7) * 0.02;
  }

  // 宵の音：場所に合わせて聞こえ方を寄せていく
  updateSoundMix();

  // 短冊：掛けている間、場所が移れば詠み替える
  updateTanzaku(dt);

  // 猫のしっぽ
  cat.userData.tail.rotation.z = 0.6 + Math.sin(elapsed * 1.6) * 0.34;
  cat.rotation.y = ((HOUSES[2] || HOUSES[0]).side < 0 ? Math.PI / 2 : -Math.PI / 2)
                 + Math.sin(elapsed * 0.31) * 0.22;
}

/* ============================================================
   11. 目視できない環境向けの検証口
   ============================================================ */
window.__machiya = {
  /* pane 非表示で viewport が 0x0 の環境向け：描画寸法を手で決めて一枚描く */
  size: function(w, h){
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
    renderer.render(scene, camera);
    return { w: w, h: h };
  },
  /* 画面の一部だけ読む（水面の細い光など、全画面平均に埋もれるものの実証用） */
  rect: function(px, py, w, h){
    renderer.render(scene, camera);
    const gl = renderer.getContext();
    const buf = new Uint8Array(w * h * 4);
    gl.readPixels(px, gl.drawingBufferHeight - py - h, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    let sum = 0, mx = 0;
    for (let i = 0; i < w * h; i++){
      const l = (buf[i*4] + buf[i*4+1] + buf[i*4+2]) / 3;
      sum += l; if (l > mx) mx = l;
    }
    return { mean: +(sum / (w * h)).toFixed(2), max: Math.round(mx) };
  },
  /* 世界座標 → 画面ピクセル（rect の狙いを付ける用） */
  proj: function(x, y, z){
    const v = new THREE.Vector3(x, y, z).project(camera);
    const gl = renderer.getContext();
    return { ndc: [+v.x.toFixed(3), +v.y.toFixed(3)],
             px: [Math.round((v.x + 1) / 2 * gl.drawingBufferWidth),
                  Math.round((1 - (v.y + 1) / 2) * gl.drawingBufferHeight)],
             inFront: v.z < 1 };
  },
  /* 手送りで時間を進める（preview では rAF が止まることがあるため） */
  step: function(frames, dt){
    frames = frames || 1; dt = dt || 1/60;
    for (let i = 0; i < frames; i++) update(dt);
    renderer.render(scene, camera);
    return { elapsed: +elapsed.toFixed(2), idx: idx, phase: phase };
  },
  /* 実際に描かれた画素を読む（スクリーンショットが撮れない環境の代替） */
  pixels: function(){
    renderer.render(scene, camera);
    const gl = renderer.getContext();
    const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
    const buf = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    let sum = 0, nonBlack = 0, warm = 0, maxL = 0;
    const n = w * h;
    for (let i = 0; i < n; i++){
      const r = buf[i*4], g2 = buf[i*4+1], b = buf[i*4+2];
      const l = (r + g2 + b) / 3;
      sum += l;
      if (l > 12) nonBlack++;
      if (r > 90 && r > b + 26) warm++;
      if (l > maxL) maxL = l;
    }
    return {
      size: w + 'x' + h,
      meanLuma: +(sum / n).toFixed(2),
      maxLuma: maxL,
      nonBlackPct: +(nonBlack / n * 100).toFixed(1),
      warmPct: +(warm / n * 100).toFixed(1)
    };
  },
  info: function(){
    let meshes = 0;
    scene.traverse(o => { if (o.isMesh || o.isPoints) meshes++; });
    return {
      houses: houseGroups.length,
      tour: TOUR.length,
      spot: TOUR[idx].name,
      meshes: meshes,
      drawCalls: renderer.info.render.calls,
      triangles: renderer.info.render.triangles,
      camera: camera.position.toArray().map(v => +v.toFixed(2)),
      target: curTgt.toArray().map(v => +v.toFixed(2)),
      idx: idx, phase: phase, auto: auto,
      season: SHIKI.current, riding: RIDE.on,
      lights: roamLights.map(l => +l.intensity.toFixed(2)),
      fxOn: Object.keys(FX).filter(k => FX[k]).join(','),
      fxCounts: { glints: glintClouds.length, touro: nagashiTouro.length,
                  kawagiri: kawagiris.length, streaks: mirrorStreaks.length,
                  walkers: walkers.length, kodachi: kodachiPlanes.length,
                  take: chikurin.N, sasa: chikurin.canopy.length,
                  shafts: chikurin.shafts.length,
                  okuribiHi: okuribi.count,
                  teraIshi: tenryuji.stoneCount, yanagi: sakai.yanagi.length,
                  meteorOn: meteor ? meteor.life >= 0 : false },
      fudaOn: fuda.classList.contains('on'),
      fudaView: fuda.classList.contains('view'),
      enterShown: elEnt.style.display !== 'none',
      enterHref: elEnt.getAttribute('href')
    };
  },
  /* 停留中の対象が本当に画面の中に写っているか（町屋は看板・暖簾・提灯、名所は橋・峰・舟を投影） */
  aim: function(){
    const v = new THREE.Vector3();
    const proj = o => {
      if (o.isVector3) v.copy(o); else o.getWorldPosition(v);
      const dist = v.distanceTo(camera.position);
      v.project(camera);
      return {
        ndc: [+v.x.toFixed(3), +v.y.toFixed(3)],
        inFront: v.z < 1,
        onScreen: Math.abs(v.x) <= 1 && Math.abs(v.y) <= 1 && v.z < 1,
        dist: +dist.toFixed(2)
      };
    };
    if (idx >= NH){
      return {
        idx: idx, name: TOUR[idx].name,
        bridge : proj(new THREE.Vector3(0, deckY(0.5), (BRIDGE_Z0 + BRIDGE_Z1) / 2)),
        peak   : proj(new THREE.Vector3(MTS[0].cx, MTS[0].r * MTS[0].sy, MTS[0].cz + MTS[0].r * MTS[0].sz * 0.5)),
        kagari : proj(boats[0].position),
        touro  : proj(touros[2].g.position),
        pond   : proj(new THREE.Vector3(tenryuji.pond.x, 0.05, tenryuji.pond.z)),
        hojo   : proj(new THREE.Vector3(-13.4, 2.0, -61.5)),
        nagashi: nagashiTouro.length ? proj(nagashiTouro[0].position) : null,
        walker : walkers.length ? proj(walkers[0].position) : null
      };
    }
    const g = houseGroups[idx];
    g.updateMatrixWorld(true);
    const parts = {
      sign   : g.userData.sign,
      noren  : g.userData.norenRoot,
      lantern: g.userData.lantern
    };
    const out = { idx: idx, name: HOUSES[idx].name };
    Object.keys(parts).forEach(k => {
      out[k] = parts[k] ? proj(parts[k]) : null;
    });
    return out;
  },
  /* 画面中央から光線を飛ばし、狙った町屋に当たるか */
  centerHit: function(){
    const r = new THREE.Raycaster();
    r.setFromCamera(new THREE.Vector2(0, 0), camera);
    const hits = r.intersectObjects(houseGroups, true);
    if (!hits.length) return { hit:null };
    let o = hits[0].object;
    while (o && houseGroups.indexOf(o) === -1) o = o.parent;
    const i = houseGroups.indexOf(o);
    return { hit: i, isCurrent: i === idx, dist: +hits[0].distance.toFixed(2) };
  },
  goTo: function(i){ goTo(i, true); return idx; },
  setAuto: function(v){ auto = !!v; syncAutoBtn(); return auto; },
  /* そぞろ歩きの検証口：set で入切、to で歩き先、state で現況 */
  walk: {
    set: function(v){ setWalk(!!v); return walkMode; },
    to: function(x, z){ WALK.target = clampToWalkable(x, z); return WALK.target; },
    look: function(yaw, pitch){
      if (yaw !== undefined) WALK.yaw = yaw;
      if (pitch !== undefined) WALK.pitch = pitch;
    },
    state: function(){
      return {
        on: walkMode,
        pos: camera.position.toArray().map(v => +v.toFixed(2)),
        target: WALK.target,
        yaw: +WALK.yaw.toFixed(3), pitch: +WALK.pitch.toFixed(3),
        poi: walkShownPoi, moving: WALK.moving,
        btn: document.getElementById('btn-walk').textContent
      };
    },
    zones: WALK_ZONES
  },
  /* 屋形舟の検証口：set で乗り降り、state で現況 */
  ride: {
    set: function(v){ if (v) enterRide(); else setRideOff('walk'); return rideActive(); },
    state: function(){
      return {
        on: RIDE.on, entering: +RIDE.entering.toFixed(2), u: +RIDE.u.toFixed(3),
        pos: camera.position.toArray().map(v => +v.toFixed(2)),
        boat: funaasobi.boat.position.toArray().map(v => +v.toFixed(2)),
        btn: document.getElementById('btn-fune').textContent
      };
    },
    curveAt: function(u){
      const p = funaasobi.curve.getPointAt(u);
      return [+p.x.toFixed(2), +p.z.toFixed(2)];
    }
  },
  /* 四季の試着：'haru'|'natsu'|'aki'|'fuyu' */
  season: function(s){ return s ? SHIKI.set(s) : SHIKI.current; },
  /* 短冊の検証口：set で掛け外し、state で掛かっている句 */
  ku: {
    set: function(v){ setKu(!!v); return kuOpen; },
    state: function(){
      return {
        open: kuOpen, key: kuKey,
        ku: [].map.call(tzKu.children, e => e.textContent),
        kigo: tzKigo.textContent, ba: tzBa.textContent,
        btn: kuBtn.textContent, cls: tzEl.className,
        loaded: !!(HAIKU && HAIKU.ku)
      };
    }
  },
  /* 雲龍図の瞳の現在位置（八方睨みの検証用） */
  unryuPupils: function(){
    return unryu.pupils.map(p => [+p.mesh.position.x.toFixed(3), +p.mesh.position.z.toFixed(3)]);
  },
  FX: FX,
  okuribi: okuribi,   // 試灯と赤入れ用（FX.okuribi=true と合わせて使う）
  /* 藪の道の赤入れ口：yabu.height(0.75) で垣の丈を試着、state で現況 */
  yabu: {
    height: yabu.height,
    state: function(){
      return { segs: yabu.segs, kakiH: +(0.62 * yabu.kaki.scale.y).toFixed(2),
               kaki: yabu.kaki.visible, michi: yabu.michi.visible, ko: yabu.ko.visible,
               dobu: waterStripsYabu.map(m => m.visible), take: chikurin.N };
    }
  },
  /* 宵の音の計測口：state で混合値、level で出力RMS、kane で鐘を即打ち */
  snd: {
    SND: SND,
    state: function(){
      return {
        created: !!AC,
        ctx: AC ? AC.state : null,
        on: SND.on,
        mix: AC ? {
          kawa : +sndNodes.kawaBus.gain.value.toFixed(4),
          mushi: +sndNodes.mushiBus.gain.value.toFixed(4),
          sasa : +sndNodes.sasaG.gain.value.toFixed(4),
          higu : +sndNodes.higuBus.gain.value.toFixed(4),
          furin: +sndNodes.furinBus.gain.value.toFixed(4),
          kane : +sndNodes.kaneBus.gain.value.toFixed(4),
          kaneLp: Math.round(sndNodes.kaneLp.frequency.value)
        } : null
      };
    },
    level: sndLevel,
    kane: function(){ return strikeKane(); },
    furin: function(){ return sndNodes.strikeFurin ? sndNodes.strikeFurin() : false; }
  }
};

})();
</script>
</body>
</html>
