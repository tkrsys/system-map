/* 月の都の行き来 ― 月白の幕で転換し、帰りは元の場所・元のモードへ */
const TSUKI = {
  on: false, phase: 'idle',      // idle / in1 / in2 / stay / out1 / out2
  t: 0, u: 0,                    // t=幕の時計・u=餅つきの拍
  yaw: 0, pitch: 0,              // なぞって見回すぶん
  squash: 0, lastBeat: -1,
  saved: null
};
const tsukifadeEl = document.getElementById('tsukifade');
const chiBtn = document.getElementById('btn-chi');

function enterTsuki(){
  if (!FX.tsukiusagi || TSUKI.phase !== 'idle') return false;
  if (TOKI.phase !== 'idle') return false;   // 明けている・暮れている最中は行かない（㊿）
  if (rideActive()) setRideOff('walk');
  if (!walkMode && phase !== 'dwell') return false;   // 飛行の途中からは行かない
  TSUKI.saved = {
    walk: walkMode, auto: auto,
    pos: camera.position.clone(), tgt: curTgt.clone(),
    fogD: scene.fog.density, bg: scene.background,
    hint: hintEl.textContent
  };
  auto = false; syncAutoBtn();
  if (walkMode) setWalk(false);
  TSUKI.phase = 'in1'; TSUKI.t = 0; TSUKI.yaw = 0; TSUKI.pitch = 0;
  return true;
}
function tsukiArrive(){
  TSUKI.on = true;
  tsukimen.group.visible = true;
  tsukimen.earthHit.visible = true;
  scene.fog.density = 0;                       // 幾何で隠す設計＝霧は月では休ませる
  scene.background = new THREE.Color(0x030509);
  camera.position.copy(tsukimen.cam.pos);
  curTgt.copy(tsukimen.cam.tgt);
  camera.lookAt(curTgt);
  hideFuda();
  document.body.classList.add('tsuki-on');
  chiBtn.style.display = '';
  hintEl.textContent = '月の都　―　なぞって見回す／地球を二度たたく・「地へ帰る」で地上へ';
  layoutBottom();
}
function tsukiLeaveRestore(){
  if (!TSUKI.saved) return;                       // 二度は戻さない（割り込みとの重なり保険）
  const sv = TSUKI.saved;
  TSUKI.saved = null;
  TSUKI.on = false;
  tsukimen.group.visible = false;
  tsukimen.earthHit.visible = false;
  scene.fog.density = sv.fogD;
  scene.background = sv.bg;
  camera.position.copy(sv.pos);
  curTgt.copy(sv.tgt);
  camera.lookAt(curTgt);
  document.body.classList.remove('tsuki-on');
  chiBtn.style.display = 'none';
  hintEl.textContent = sv.hint;
  if (sv.walk){ setWalk(true); }
  else { phase = 'dwell'; dwellT = 0; auto = sv.auto; syncAutoBtn(); showFuda(); }
  layoutBottom();
}
function exitTsuki(){
  if (!TSUKI.on || TSUKI.phase !== 'stay') return false;
  TSUKI.phase = 'out1'; TSUKI.t = 0;
  return true;
}
/* 巡りへ割り込まれたとき（goTo 等）は幕を待たずに即帰る */
function exitTsukiInstant(){
  if (TSUKI.phase === 'idle') return;
  const mid = (TSUKI.phase === 'in1');           // まだ月に着いていない
  TSUKI.phase = 'idle';
  tsukifadeEl.style.opacity = 0;
  if (!mid) tsukiLeaveRestore();
  else if (TSUKI.saved){                          // 行きかけ＝保存だけ戻す
    auto = TSUKI.saved.auto; syncAutoBtn();
    if (TSUKI.saved.walk) setWalk(true);
    hintEl.textContent = TSUKI.saved.hint;
    TSUKI.saved = null;
  }
}

/* 塔の二度たたき（下の ㊾ の節）― 月の都と同じ月白の幕で、旅路を経ずに渡る。
   幕が閉じ切ったところで fn（着地）を呼び、そのまま幕を引く */
const WARP = { phase: 'idle', t: 0, F: 0.85, fn: null };   // idle / in / out
function warpTo(fn){
  if (WARP.phase !== 'idle' || TSUKI.phase !== 'idle') return false;
  WARP.phase = 'in'; WARP.t = 0; WARP.fn = fn;
  return true;
}
function cancelWarp(){          // 幕の途中で別の移動が入ったら行き先を取り下げ、幕だけ引く
  if (WARP.phase !== 'in') return;
  WARP.fn = null;
  WARP.t = Math.max(0, WARP.F - WARP.t);   // いまの白さのまま、引きの続きから
  WARP.phase = 'out';
}
function updateWarp(dt){
  if (WARP.phase === 'in'){
    WARP.t += dt;
    tsukifadeEl.style.opacity = Math.min(1, WARP.t / WARP.F);
    if (WARP.t >= WARP.F){
      const fn = WARP.fn;
      WARP.fn = null; WARP.phase = 'out'; WARP.t = 0;
      if (fn) fn();
    }
  } else if (WARP.phase === 'out'){
    WARP.t += dt;
    tsukifadeEl.style.opacity = Math.max(0, 1 - WARP.t / WARP.F);
    if (WARP.t >= WARP.F){ WARP.phase = 'idle'; WARP.t = 0; }
  }
}

/* ㊾' 五重塔のもと ― 書き割りの五重塔の中へ渡る隠しの間（造作は上の goju）。
   月の都と同じ作法：月白の幕で渡り、なぞって見回し、帰りは元の場所・元のモードへ。
   世界はそのまま（同じ夜空の下）なので、保存するのは居場所と歩き/巡りの別だけ。
   峰の高みは霧の上＝滞在中だけ霧をうすめ、帰りに戻す */
const GOJU = {
  on: false, yaw: 0, pitch: 0,
  saved: null, fog0: -1,
  cam: { pos: new THREE.Vector3(-58.5, 19.1, -160.5),
         tgt: new THREE.Vector3(0.0, 3.0, -102.0) }
};
function enterGoju(){
  if (GOJU.on || TSUKI.phase !== 'idle' || WARP.phase !== 'idle') return false;
  if (TOKI.phase !== 'idle') return false;            // 明けている・暮れている最中は渡らない（㊿）
  if (!walkMode && !rideActive() && phase !== 'dwell') return false;   // 飛行の途中からは行かない
  return warpTo(gojuArrive);
}
function gojuArrive(){
  if (rideActive()) setRideOff('walk');               // 舟からは下りて渡る（月と同じ）
  if (!walkMode && phase !== 'dwell') return;         // 幕の間に旅路へ入っていたら見送る
  GOJU.saved = {
    walk: walkMode, auto: auto,
    pos: camera.position.clone(), tgt: curTgt.clone(),
    hint: hintEl.textContent
  };
  auto = false; syncAutoBtn();
  if (walkMode) setWalk(false);
  GOJU.on = true; GOJU.yaw = 0; GOJU.pitch = 0;
  GOJU.fog0 = scene.fog.density;
  scene.fog.density = GOJU.fog0 * 0.30;               // 峰の空気は澄んでいる＝対岸の町まで見通す
  goju.group.visible = true;
  camera.position.copy(GOJU.cam.pos);
  curTgt.copy(GOJU.cam.tgt);
  camera.lookAt(curTgt);
  hideFuda();
  document.body.classList.add('tsuki-on');            // 操舵バーの畳み方は月と同じ
  chiBtn.style.display = ''; chiBtn.textContent = '町へ帰る';
  hintEl.textContent = '五重塔のもと　―　なぞって見回す（振り返れば塔）／塔を二度たたく・「町へ帰る」で元の場所へ';
  layoutBottom();
}
function gojuWorldBack(){                             // 世界側の後片付け（帰り道の共通部）
  GOJU.on = false;
  goju.group.visible = false;
  if (GOJU.fog0 >= 0){ scene.fog.density = GOJU.fog0; GOJU.fog0 = -1; }
  document.body.classList.remove('tsuki-on');
  chiBtn.style.display = 'none'; chiBtn.textContent = '地へ帰る';
  layoutBottom();
}
function gojuLeaveRestore(){
  if (!GOJU.saved) return;
  const sv = GOJU.saved;
  GOJU.saved = null;
  gojuWorldBack();
  camera.position.copy(sv.pos);
  curTgt.copy(sv.tgt);
  camera.lookAt(curTgt);
  hintEl.textContent = sv.hint;
  if (sv.walk){ setWalk(true); }
  else { phase = 'dwell'; dwellT = 0; auto = sv.auto; syncAutoBtn(); showFuda(); }
}
function exitGoju(){
  if (!GOJU.on || WARP.phase !== 'idle' || TSUKI.phase !== 'idle') return false;
  return warpTo(gojuLeaveRestore);
}
/* 点列・←→などから割り込まれたら、幕を待たずその高みから旅路に出る */
function exitGojuInstant(){
  if (!GOJU.on) return;
  GOJU.saved = null;
  gojuWorldBack();
}
function updateGoju(dt){
  const cp = GOJU.cam.pos, ct = GOJU.cam.tgt;
  camera.position.set(cp.x, cp.y + Math.sin(elapsed * 0.7) * 0.035, cp.z);
  const bx = ct.x - cp.x, by = ct.y - cp.y, bz = ct.z - cp.z;
  const yaw0 = Math.atan2(bx, bz), pit0 = Math.atan2(by, Math.hypot(bx, bz));
  const yw = yaw0 + GOJU.yaw, pt = pit0 + GOJU.pitch;
  curTgt.set(
    camera.position.x + Math.sin(yw) * Math.cos(pt) * 10,
    camera.position.y + Math.sin(pt) * 10,
    camera.position.z + Math.cos(yw) * Math.cos(pt) * 10
  );
  camera.lookAt(curTgt);
}
function updateTsuki(dt){
  const F = 0.85;                                 // 幕のひと呼吸
  if (TSUKI.phase === 'in1'){
    TSUKI.t += dt;
    tsukifadeEl.style.opacity = Math.min(1, TSUKI.t / F);
    if (TSUKI.t >= F){ tsukiArrive(); TSUKI.phase = 'in2'; TSUKI.t = 0; }
  } else if (TSUKI.phase === 'in2'){
    TSUKI.t += dt;
    tsukifadeEl.style.opacity = Math.max(0, 1 - TSUKI.t / F);
    if (TSUKI.t >= F){ TSUKI.phase = 'stay'; TSUKI.t = 0; }
  } else if (TSUKI.phase === 'out1'){
    TSUKI.t += dt;
    tsukifadeEl.style.opacity = Math.min(1, TSUKI.t / F);
    if (TSUKI.t >= F){ tsukiLeaveRestore(); TSUKI.phase = 'out2'; TSUKI.t = 0; }
  } else if (TSUKI.phase === 'out2'){
    TSUKI.t += dt;
    tsukifadeEl.style.opacity = Math.max(0, 1 - TSUKI.t / F);
    if (TSUKI.t >= F){ TSUKI.phase = 'idle'; TSUKI.t = 0; }
  }
  if (!TSUKI.on) return;

  /* 立ち姿：息づかいと、なぞりの見回し */
  const cp = tsukimen.cam.pos, ct = tsukimen.cam.tgt;
  camera.position.set(cp.x, cp.y + Math.sin(elapsed * 0.7) * 0.035, cp.z);
  const bx = ct.x - cp.x, by = ct.y - cp.y, bz = ct.z - cp.z;
  const yaw0 = Math.atan2(bx, bz), pit0 = Math.atan2(by, Math.hypot(bx, bz));
  const yw = yaw0 + TSUKI.yaw, pt = pit0 + TSUKI.pitch;
  curTgt.set(
    camera.position.x + Math.sin(yw) * Math.cos(pt) * 10,
    camera.position.y + Math.sin(pt) * 10,
    camera.position.z + Math.cos(yw) * Math.cos(pt) * 10
  );
  camera.lookAt(curTgt);

  /* 餅つき：置き、もちあげ、構え、ふりおろし、ぺったん。上げているあいだに手返し */
  const T = 1.7;
  TSUKI.u = (TSUKI.u + dt / T) % 1;
  const u = TSUKI.u;
  let th;
  if (u < 0.10)      th = -1.42;                                          // 置き
  else if (u < 0.52) th = -1.42 + (0.5 + 1.42) * smooth((u - 0.10) / 0.42);// もちあげ
  else if (u < 0.82) th = 0.5;                                            // 構え（手返しの間）
  else if (u < 0.92) th = 0.5 - (0.5 + 1.42) * smooth((u - 0.82) / 0.10); // ふりおろし
  else               th = -1.42;
  tsukimen.kine.rotation.x = th;
  if (TSUKI.lastBeat < 0.92 && u >= 0.92){
    TSUKI.squash = 1;
    strikeMochi();
  }
  TSUKI.lastBeat = u;
  TSUKI.squash = Math.max(0, TSUKI.squash - dt * 4.5);
  const sq = TSUKI.squash;
  tsukimen.mochi.scale.set(1 + sq * 0.33, 0.62 * (1 - sq * 0.38), 1 + sq * 0.33);
  // 手返し（杵が上がっているあいだに、身を乗り出して餅をかえす）
  const lean = (u > 0.54 && u < 0.80) ? Math.sin((u - 0.54) / 0.26 * Math.PI) : 0;
  tsukimen.usagiB.rotation.x = lean * 0.30;
  // 耳としっぽの気配・地球の大気の呼吸
  tsukimen.usagiA.rotation.z = Math.sin(elapsed * 1.1) * 0.02;
  tsukimen.taiki.material.opacity = 0.27 + Math.sin(elapsed * 0.9) * 0.05;
}

/* 月の道を「立った場所と月を結ぶ線」に乗せ直す（池ごとに呼ぶ）。
   水鏡は見る人ごとに位置が変わる ―― 置きっぱなしの一本だと、
   汀を歩いたときに月と別のところで光ってしまう。
   線が池からはみ出す立ち位置では、池のなかへ引き戻す */
function aimTsukiMichi(tm, PD, tmin, tmax){
  const mdx = 42 - camera.position.x, mdz = -152 - camera.position.z;
  const ml = Math.hypot(mdx, mdz) || 1;
  const ux = mdx / ml, uz = mdz / ml;
  let tt = (PD.x - camera.position.x) * ux + (PD.z - camera.position.z) * uz;
  tt = Math.max(tmin, Math.min(tt, tmax));
  let px = camera.position.x + ux * tt, pz = camera.position.z + uz * tt;
  const pe = Math.hypot((px - PD.x) / PD.rx, (pz - PD.z) / PD.rz);
  if (pe > 0.6){ px = PD.x + (px - PD.x) * 0.6 / pe; pz = PD.z + (pz - PD.z) * 0.6 / pe; }
  tm.position.x = px; tm.position.z = pz;
  tm.rotation.z = Math.atan2(-ux, -uz);
}

   6. 屋根の猫（参の町屋に一匹）

const cat = (function(){
  const g = new THREE.Group();

  g.add(body, head, earL, earR, eyeL, eyeR, tail);
  g.userData.tail = tail;
  // 参の町屋（index 2・左側）の棟の上へ（軒数が減っても先頭に退避）
  const h = HOUSES[2] || HOUSES[0];
  g.position.set(h.side * STREET_X + 0.5, 2.40 + 1.50 + 0.95, h.z + 0.7);
  g.rotation.y = h.side < 0 ? Math.PI / 2 : -Math.PI / 2;
  scene.add(g);

})();

/* ============================================================
   7. 蛍（火の粉）― 通りと川辺に二群
   ============================================================ */
function makeFireflies(N, xSpread, zNear, zFar, seed){
  const pos = new Float32Array(N * 3);
  const phase = new Float32Array(N);
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < N; i++){
    pos[i*3]   = (rnd() - 0.5) * xSpread;
    pos[i*3+1] = rnd() * 3.4 + 0.25;
    pos[i*3+2] = zNear + rnd() * (zFar - zNear);
    phase[i]   = rnd() * Math.PI * 2;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    map:TEX.glow, color:0xffd591, size:0.3, sizeAttenuation:true,
    transparent:true, opacity:0.85, depthWrite:false, blending:THREE.AdditiveBlending
  });
  const p = new THREE.Points(geo, mat);
  p.userData = { phase: phase, base: pos.slice() };
  scene.add(p);
  return p;
}
const fireflies = makeFireflies(130, 5.2,   4,  -74, 4242);   // 通り

/* ============================================================
   8. カメラの流れ（自動＋停留）
   ============================================================ */
const TRAVEL_S = 2.9;
const DWELL_S  = 6.2;

const stops = TOUR.map(h => h.view
  ? { pos: new THREE.Vector3(h.pos[0], h.pos[1], h.pos[2]),
      tgt: new THREE.Vector3(h.tgt[0], h.tgt[1], h.tgt[2]) }
  : { pos: new THREE.Vector3(-h.side * 1.35, 1.62, h.z + 3.2),
      tgt: new THREE.Vector3(h.side * FACADE_X * 0.82, 1.88, h.z - 0.15) });

let idx     = 0;
let phase   = 'travel';
let t       = 0;
let dwellT  = 0;
let auto    = true;
let fromPos = camera.position.clone();
let fromTgt = new THREE.Vector3(stops[0].tgt.x, stops[0].tgt.y, stops[0].tgt.z + 6);
const curTgt = fromTgt.clone();
const ctrl   = new THREE.Vector3();
const dollyDir = new THREE.Vector3();

const smooth = x => x * x * (3 - 2 * x);

function goTo(i, byUser){
  if (TSUKI.phase !== 'idle') exitTsukiInstant();   // 月の都からは幕を待たずに帰って合流
  exitGojuInstant();             // 五重塔のもとからは、その高みから旅路に出る
  cancelWarp();                  // 幕のワープ待ちがあれば行き先を取り下げる
  if (rideActive()){             // 点列などから呼ばれたら舟を下りてレールへ
    setRideOff('rail');
    hintEl.textContent = HINT_RAIL;
  }
  if (walkMode){                 // 点列などから直接呼ばれたら散歩を畳んでレールへ
    walkMode = false; syncWalkBtn();
    hintEl.textContent = HINT_RAIL;
  }
  const n = TOUR.length;
  idx = ((i % n) + n) % n;
  fromPos.copy(camera.position);
  fromTgt.copy(curTgt);
  t = 0; dwellT = 0; phase = 'travel';
  hideFuda();
  paintDots();
  if (byUser) auto = false, syncAutoBtn();
}

function updateCamera(dt){
  const s = stops[idx];
  if (phase === 'travel'){
    t = Math.min(1, t + dt / TRAVEL_S);
    const e = smooth(t);
    // 通りの真ん中をふくらんで進む（ベジェ）。長い戻りは屋根の上、
    // 塔の舞台（高所）への出入りは石段の上を高めに飛んで、丘に潜らない。
    // 塀と竹に囲われた一角（天龍寺・野宮・化野・大覚寺）への出入りは梢を越えて飛ぶ
    const span = Math.abs(fromPos.z - s.pos.z);
    const hi = Math.max(fromPos.y, s.pos.y) > 5;
    const kakoi = p =>
      (p.x >  7.3 && p.z > -77 && p.z < -58) ||   // 天龍寺の境内
      (p.x >  7.3 && p.z > -48 && p.z < -33) ||   // 野宮の社叢
      (p.x < -8.0 && p.z > -77 && p.z < -57) ||   // 化野の囲いの内
      (p.z > 17.5);                                // 大覚寺と大沢池
    const arcY = span > 60 ? 12 : (hi ? 11 : ((kakoi(fromPos) || kakoi(s.pos)) ? 13.5 : 1.6));
    ctrl.set(0, arcY, (fromPos.z + s.pos.z) / 2);
    const u = 1 - e;
    camera.position.set(
      u*u*fromPos.x + 2*u*e*ctrl.x + e*e*s.pos.x,
      u*u*fromPos.y + 2*u*e*ctrl.y + e*e*s.pos.y,
      u*u*fromPos.z + 2*u*e*ctrl.z + e*e*s.pos.z
    );
    curTgt.lerpVectors(fromTgt, s.tgt, e);
    if (t >= 1){ phase = 'dwell'; dwellT = 0; showFuda(); }
  } else {
    dwellT += dt;
    camera.position.x = s.pos.x + Math.sin(dwellT * 0.62) * 0.07;
    camera.position.y = s.pos.y + Math.sin(dwellT * 0.85) * 0.035;
    camera.position.z = s.pos.z;
    if (FX.dolly && TOUR[idx].view){
      // ⑬ 名所では息を合わせるようにゆっくり前へ寄る
      const d = smooth(Math.min(1, dwellT / DWELL_S)) * 0.6;
      dollyDir.subVectors(s.tgt, s.pos).normalize();
      camera.position.x += dollyDir.x * d;
      camera.position.y += dollyDir.y * d;
      camera.position.z += dollyDir.z * d;
    }
    curTgt.copy(s.tgt);
    if (auto && dwellT > DWELL_S) goTo(idx + 1, false);
  }
  camera.lookAt(curTgt);
}

/* 参道の勾配 SANDO と sandoFloor は 5b（橋の定数群）で定義済み */
function inWalkable(x, z){
  return WALK_ZONES.some(r => x >= r.x0 && x <= r.x1 && z <= r.z0 && z >= r.z1);
}
function clampToWalkable(x, z){
  let best = null, bd = Infinity;
  WALK_ZONES.forEach(r => {
    const cx = Math.min(r.x1, Math.max(r.x0, x));
    const cz = Math.min(r.z0, Math.max(r.z1, z));
    const d = (cx - x) * (cx - x) + (cz - z) * (cz - z);
    if (d < bd){ bd = d; best = { x: cx, z: cz }; }
  });
  return best;
}
/* 立ち位置の目の高さ（橋の上はむくり、参道は石段の勾配、舞台は高所に沿う） */
function walkEyeY(x, z){
  if (z <= BRIDGE_Z0 - 0.4 && z >= BRIDGE_Z1 + 0.4 && Math.abs(x) < 2.2){
    const t = Math.min(1, Math.max(0, (BRIDGE_Z0 - z) / BRIDGE_L));
    return deckY(t) + 1.5;
  }
  if (z <= SANDO.z0 && z >= SANDO.z1 && x >= -11.8 && x <= -8.8){
    return 1.62 + sandoFloor(z);                    // 参道の石段
  }
  if (z < SANDO.z1 && z >= -137.5 && x >= -21 && x <= -9){
    return 1.62 + SANDO.rise;                       // 塔の舞台
  }
  if (z <= -88.4 && z >= -92.6 && x >= 4.95 && x <= 6.25){
    return 1.62 + 0.22;                             // 桟橋の板の上
  }
  if (z <= 29.2 && z >= 26.9 && x >= -4.6 && x <= -1.2){
    return 1.62 + 0.45;                             // 五大堂の観月台（㊶）
  }
  return 1.62;
}
/* 画面の一点から地面（or 橋板）を求める。メッシュを持ち回らずレイを刻んで解く */
function groundPointFromRay(){
  const o = ray.ray.origin, d = ray.ray.direction;
  if (d.y > -0.02) return null;                  // ほぼ空を向いている
  let s = 0.6;
  for (let i = 0; i < 240 && s < 90; i++){
    const px = o.x + d.x * s, py = o.y + d.y * s, pz = o.z + d.z * s;
    let gy = 0;
    if (pz <= BRIDGE_Z0 && pz >= BRIDGE_Z1 && Math.abs(px) < 2.2){
      gy = deckY(Math.min(1, Math.max(0, (BRIDGE_Z0 - pz) / BRIDGE_L)));
    } else if (pz <= SANDO.z0 && pz >= SANDO.z1 && px >= -11.8 && px <= -8.8){
      gy = sandoFloor(pz);                          // 石段の面
    } else if (pz < SANDO.z1 && pz >= -137.5 && px >= -21 && px <= -9){
      gy = SANDO.rise;                              // 舞台の床
    } else if (pz <= -88.4 && pz >= -92.6 && px >= 4.95 && px <= 6.25){
      gy = 0.22;                                    // 桟橋の板
    } else if (pz <= 29.2 && pz >= 26.9 && px >= -4.6 && px <= -1.2){
      gy = 0.45;                                    // 観月台の床（㊶）
    }
    if (py <= gy + 0.03) return { x: px, z: pz };
    s += 0.4;
  }
  return null;
}
function nearestStopIdx(){
  let best = 0, bd = Infinity;
  stops.forEach((s, i) => {
    const d = s.pos.distanceTo(camera.position);
    if (d < bd){ bd = d; best = i; }
  });
  return best;
}
function syncWalkBtn(){
  const b = document.getElementById('btn-walk');
  b.textContent = walkMode ? '巡りに戻る' : 'そぞろ歩き';
  b.setAttribute('aria-pressed', String(walkMode));
}
function setWalk(on){
  if (on === walkMode) return;
  if (on){
    walkMode = true;
    auto = false; syncAutoBtn();
    phase = 'dwell';                             // 近くの提灯が明るくなる判定を生かす
    // いまの視線から歩き出す
    const v = new THREE.Vector3().subVectors(curTgt, camera.position);
    WALK.yaw = Math.atan2(v.x, -v.z);
    WALK.pitch = Math.asin(Math.max(-1, Math.min(1, v.y / (v.length() || 1))));
    const p = clampToWalkable(camera.position.x, camera.position.z);
    camera.position.x = p.x; camera.position.z = p.z;
    WALK.eyeY = walkEyeY(p.x, p.z);
    WALK.target = null; WALK.bob = 0;
    hideFuda(); walkShownPoi = -2;
    hintEl.textContent = HINT_WALK;
  } else {
    walkMode = false;
    hintEl.textContent = HINT_RAIL;
    goTo(nearestStopIdx(), false);               // いちばん近い停留へ戻る
  }
  syncWalkBtn();
}
/* ============================================================
   鐘を撞く ― 鐘楼の下に立つと操舵バーにボタンが出る。
   撞木を引いて放つと 0.45 秒で鐘に当たり、そこで音が鳴る。
   除夜の鐘は「百八まで数える」モード。大晦日の宵は自動で入る
   ============================================================ */
const KANE = {
  t: -1,          // 撞いてからの秒。-1 は静止
  hit: false,     // この一打の当たりを鳴らしたか
  cool: 0,        // 次に撞けるまで
  count: 0,       // 撞いた数（除夜モードの数え）
  joya: false,
  near: false
};
const KANJI_NUM = ['〇','一','二','三','四','五','六','七','八','九'];
function kanjiNum(n){                       // 1〜108 を漢数字に
  if (n <= 0) return '〇';
  if (n < 10) return KANJI_NUM[n];
  if (n < 20) return '十' + (n % 10 ? KANJI_NUM[n % 10] : '');
  if (n < 100){
    const t = Math.floor(n / 10);
    return KANJI_NUM[t] + '十' + (n % 10 ? KANJI_NUM[n % 10] : '');
  }
  const r = n % 100;
  return '百' + (r ? (r < 10 ? KANJI_NUM[r] : kanjiNum(r)) : '');
}
const kaneBtn = document.getElementById('btn-kane');
const joyaBtn = document.getElementById('btn-joya');
function nearShoro(){
  return Math.hypot(camera.position.x - shoro.x, camera.position.z - shoro.z) < 6.4;
}
function strikeBell(){
  if (!FX.shoro || KANE.cool > 0 || KANE.t >= 0) return false;
  KANE.t = 0; KANE.hit = false; KANE.cool = 2.4;
  return true;
}
function syncKaneBtn(){
  const show = FX.shoro && walkMode && KANE.near;
  kaneBtn.style.display = show ? '' : 'none';
  joyaBtn.style.display = show ? '' : 'none';
  kaneBtn.textContent = KANE.cool > 0 ? '鐘のひびき…' : '鐘を撞く';
  kaneBtn.disabled = KANE.cool > 0;
  joyaBtn.textContent = KANE.joya ? '除夜をやめる' : '除夜の鐘';
  joyaBtn.setAttribute('aria-pressed', String(KANE.joya));
}
function setJoya(v){
  KANE.joya = !!v;
  if (KANE.joya) KANE.count = 0;
  syncKaneBtn();
  if (KANE.near) showKaneHint();
  return KANE.joya;
}
function showKaneHint(){
  if (!KANE.near){ hintEl.textContent = walkMode ? HINT_WALK : HINT_RAIL; return; }
  if (KANE.joya){
    hintEl.textContent = KANE.count >= 108
      ? '除夜の鐘　百八　―　ゆく年くる年'
      : '除夜の鐘　' + kanjiNum(KANE.count) + '　／　あと ' + kanjiNum(108 - KANE.count);
  } else {
    hintEl.textContent = '鐘楼の下　／　「鐘を撞く」でひとつ撞けます'
      + (KANE.count ? '　（撞いた数 ' + kanjiNum(KANE.count) + '）' : '');
  }
}
/* 撞木の振りと鐘の震え。当たりの瞬間（0.45秒）に音を鳴らす */
function updateKane(dt){
  if (KANE.cool > 0){
    KANE.cool = Math.max(0, KANE.cool - dt);
    if (KANE.cool === 0) syncKaneBtn();
  }
  const nowNear = FX.shoro && walkMode && nearShoro();
  if (nowNear !== KANE.near){
    KANE.near = nowNear;
    syncKaneBtn();
    showKaneHint();
  }
  if (KANE.t < 0){
    shoro.shumoku.rotation.x += (0 - shoro.shumoku.rotation.x) * 0.1;
    shoro.kaneHi.material.opacity += (0.10 - shoro.kaneHi.material.opacity) * 0.05;
    return;
  }
  KANE.t += dt;
  const t = KANE.t;
  if (t < 0.45){
    shoro.shumoku.rotation.x = 0.30 * (t / 0.45);           // 南（手前）へ引く
  } else {
    const u = t - 0.45;
    shoro.shumoku.rotation.x = -0.34 * Math.exp(-1.15 * u) * Math.cos(4.3 * u);
    if (!KANE.hit){
      KANE.hit = true;
      strikeShoro();                                        // 当たりで鳴らす
      KANE.count++;
      if (KANE.joya && KANE.count >= 108) KANE.count = 108;
      showKaneHint();
      shoro.kaneHi.material.opacity = 0.42;
      shoro.kane.position.y = shoro.kaneY - 0.012;
    }
    // 鐘の震えと光の余韻
    shoro.kane.position.y = shoro.kaneY + Math.sin(u * 46) * 0.008 * Math.exp(-2.2 * u);
    shoro.kaneHi.material.opacity = 0.10 + 0.32 * Math.exp(-1.1 * u);
  }
  if (t > 6){ KANE.t = -1; KANE.hit = false; shoro.kane.position.y = shoro.kaneY; }
}
// 大晦日の宵はひとりでに除夜の鐘（送り火と同じ日付の作法）
if (new Date().getMonth() === 11 && new Date().getDate() === 31) KANE.joya = true;

/* 歩いて近づいた名所を控える（点列が歩きに追随する）。
   札は出さない ―― 散歩中は景色が主役、画面の真ん中を塞がない */
let walkShownPoi = -2;
function updateWalkPoi(){
  let poi = -1;
  let bs = -1, bsd = Infinity;
  for (let i = 0; i < TOUR.length; i++){
    const p = stops[i].pos;
    const d = Math.hypot(camera.position.x - p.x, camera.position.z - p.z);
    if (d < bsd){ bsd = d; bs = i; }
  }
  const margin = (walkShownPoi === bs) ? 0.9 : 0;
  if (bsd < 6.0 + margin) poi = bs;
  if (poi === walkShownPoi) return;
  walkShownPoi = poi;
  if (poi >= 0){ idx = poi; paintDots(); }
}
function updateWalk(dt){
  const K = WALK.keys;
  let vx = 0, vz = 0;
  const SPEED = 2.6;
  if (K.l) WALK.yaw += 1.9 * dt;
  if (K.r) WALK.yaw -= 1.9 * dt;
  if (K.f || K.b){
    const s = (K.f ? 1 : -0.62) * SPEED * dt;
    vx = Math.sin(WALK.yaw) * s;
    vz = -Math.cos(WALK.yaw) * s;
    WALK.target = null;                          // 手動歩行はタップ先を打ち消す
  } else if (WALK.target){
    const dx = WALK.target.x - camera.position.x;
    const dz = WALK.target.z - camera.position.z;
    const d = Math.hypot(dx, dz);
    if (d < 0.15){ WALK.target = null; }
    else {
      const s = Math.min(d, SPEED * dt);
      vx = dx / d * s; vz = dz / d * s;
      // なぞっていない間は、進む向きへゆっくり向き直す
      if (elapsed > WALK.manualUntil){
        const want = Math.atan2(dx, -dz);
        let diff = want - WALK.yaw;
        while (diff >  Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        WALK.yaw += diff * Math.min(1, dt * 3.2);
      }
    }
  }
  // 壁ぎわは滑らせる（軸を分けて当てる）。両軸とも塞がれたときだけ足を止める
  WALK.moving = (vx !== 0 || vz !== 0);
  if (WALK.moving){
    let moved = false;
    const nx = camera.position.x + vx;
    if (vx !== 0 && inWalkable(nx, camera.position.z)){ camera.position.x = nx; moved = true; }
    const nz = camera.position.z + vz;
    if (vz !== 0 && inWalkable(camera.position.x, nz)){ camera.position.z = nz; moved = true; }
    if (!moved) WALK.target = null;
  }
  // 高さと歩の上下
  const ty = walkEyeY(camera.position.x, camera.position.z);
  WALK.eyeY += (ty - WALK.eyeY) * Math.min(1, dt * 6);
  if (WALK.moving){
    WALK.bobPh += dt * 7.4;
    WALK.bob += (Math.sin(WALK.bobPh) * 0.032 - WALK.bob) * Math.min(1, dt * 12);
  } else {
    WALK.bob += (0 - WALK.bob) * Math.min(1, dt * 6);
  }
  camera.position.y = WALK.eyeY + WALK.bob;
  // 視線
  const cp = Math.cos(WALK.pitch);
  curTgt.set(
    camera.position.x + Math.sin(WALK.yaw) * cp,
    camera.position.y + Math.sin(WALK.pitch),
    camera.position.z - Math.cos(WALK.yaw) * cp
  );
  camera.lookAt(curTgt);
  updateWalkPoi();
}

/* ============================================================
   8c. 屋形舟遊びの実体 ― 乗り込み・航行・下船
   航路は 5i の閉曲線。乗るとレール・散歩から切り替わり、
   一巡（68秒）で桟橋へ戻って散歩に降りる。なぞって見回し可
   ============================================================ */
function rideActive(){ return RIDE.on || RIDE.entering >= 0; }
function placeBoatAt(u){
  funaasobi.curve.getPointAt(u, RIDE.pos);
  funaasobi.curve.getTangentAt(u, RIDE.tan);
  const b = funaasobi.boat;
  b.position.set(RIDE.pos.x, -0.07 + Math.sin(elapsed * 0.9) * 0.03, RIDE.pos.z);
  b.rotation.set(0, Math.atan2(-RIDE.tan.z, RIDE.tan.x), Math.sin(elapsed * 0.7) * 0.022);
}
function rideSeat(out){
  // 艫寄りの座席。舳先の提灯が行く手を照らす
  const b = funaasobi.boat, ry = b.rotation.y;
  const lx = -0.45, lz = 0.12;
  out.pos.set(
    b.position.x + lx * Math.cos(ry) + lz * Math.sin(ry),
    b.position.y + 0.93,
    b.position.z - lx * Math.sin(ry) + lz * Math.cos(ry)
  );
  const yawL = Math.atan2(RIDE.tan.x, -RIDE.tan.z) + RIDE.yaw;
  const cp = Math.cos(RIDE.pitch);
  out.tgt.set(
    out.pos.x + Math.sin(yawL) * cp,
    out.pos.y + Math.sin(RIDE.pitch),
    out.pos.z - Math.cos(yawL) * cp
  );
  return out;
}
const rideTmp = { pos: new THREE.Vector3(), tgt: new THREE.Vector3() };
function enterRide(){
  if (rideActive()) return;
  RIDE.entering = 0; RIDE.u = 0; RIDE.yaw = 0; RIDE.pitch = 0;
  RIDE.fromPos.copy(camera.position);
  RIDE.fromTgt.copy(curTgt);
  walkMode = false; syncWalkBtn();
  auto = false; syncAutoBtn();
  phase = 'dwell';
  hideFuda();
  funaasobi.rope.visible = false;
  hintEl.textContent = '舟にゆられて川をひとめぐり　／　なぞって見回せます';
  syncFuneBtn();
}
function setRideOff(dest){
  if (!rideActive()) return;
  RIDE.on = false; RIDE.entering = -1;
  const b = funaasobi.boat, m = funaasobi.moor;
  b.position.set(m.x, -0.07, m.z);
  b.rotation.set(0, m.rotY, 0);
  funaasobi.rope.visible = true;
  syncFuneBtn();
  if (dest === 'rail') return;               // 続きは呼び出し側の goTo に任せる
  // 桟橋に降りて、そのまま散歩へ
  camera.position.set(funaasobi.pier.x, 1.84, funaasobi.pier.z);
  curTgt.set(funaasobi.pier.x - 0.6, 1.4, funaasobi.pier.z - 7);
  setWalk(true);
}
function updateRide(dt){
  if (RIDE.entering >= 0){
    RIDE.entering += dt / 1.4;
    placeBoatAt(0);
    rideSeat(rideTmp);
    const e = smooth(Math.min(1, RIDE.entering));
    camera.position.lerpVectors(RIDE.fromPos, rideTmp.pos, e);
    curTgt.lerpVectors(RIDE.fromTgt, rideTmp.tgt, e);
    camera.lookAt(curTgt);
    if (RIDE.entering >= 1){ RIDE.entering = -1; RIDE.on = true; RIDE.u = 0; }
    return;
  }
  RIDE.u += dt / RIDE.dur;
  if (RIDE.u >= 1){ setRideOff('pier'); return; }
  placeBoatAt(RIDE.u);
  rideSeat(rideTmp);
  camera.position.copy(rideTmp.pos);
  curTgt.copy(rideTmp.tgt);
  camera.lookAt(curTgt);
}
function syncFuneBtn(){
  const b = document.getElementById('btn-fune');
  b.textContent = rideActive() ? '舟を下りる' : '屋形舟';
  b.setAttribute('aria-pressed', String(rideActive()));
}

/* ============================================================
   9. 札と操作
   ============================================================ */

/* ============================================================
   8c. 短冊 ― その場の一句（歳時記 haiku.json より）
   いまいる停留と、きょうの季節で選ぶ。舟の上と送り火の宵は特別の句。
   歩いて停留が変われば、掛けたままでも静かに詠み替える
   ============================================================ */
const tzEl   = document.getElementById('tanzaku');
const tzIn   = document.getElementById('tz-in');
const tzKu   = document.getElementById('tz-ku');
const tzKigo = document.getElementById('tz-kigo');
const tzBa   = document.getElementById('tz-ba');
const kuBtn  = document.getElementById('btn-ku');
let kuOpen = false;
let kuKey  = '';                 // いま掛かっている句の出どころ。変わったら詠み替える
let kuT    = 0;

if (!HAIKU || !HAIKU.ku) kuBtn.style.display = 'none';
tzEl.setAttribute('aria-hidden', 'true');

/* 詠み場 ― 巡りの停留からは消えた七軒も、歳時記の上では詠み場として残す。
   そぞろ歩きで町屋の前を通れば、従来どおりその家の句が掛かる。
   ku は haiku.json の番号（十二停留のころのまま＝ファイルは編集しない） */
const KU_BA = HOUSES.map((h, i) => ({
  ku: KANJI7[i], ba: h.name,
  pos: new THREE.Vector3(-h.side * 1.35, 1.62, h.z + 3.2)
})).concat(SPOTS.map(s => ({
  ku: s.ku, ba: s.kanji + '　' + s.name,
  pos: new THREE.Vector3(s.pos[0], s.pos[1], s.pos[2])
})));
/* 居どころ＝散歩と舟の最中はいちばん近い詠み場、巡りの最中はいまの停留 */
function kuBaIdx(){
  if (!walkMode && !rideActive()) return HOUSES.length + idx;
  let best = 0, bd = Infinity;
  KU_BA.forEach((k, i) => {
    const d = k.pos.distanceTo(camera.position);
    if (d < bd){ bd = d; best = i; }
  });
  return best;
}

function kuPick(){
  if (!HAIKU || !HAIKU.ku) return null;
  const toki = HAIKU.toki || {};
  if (TSUKI.on && toki.tsuki)      return { key:'tsuki',   ku:toki.tsuki,   ba:toki.tsuki.ba };
  if (GOJU.on && toki.goju)        return { key:'goju',    ku:toki.goju,    ba:toki.goju.ba };
  if (rideActive() && toki.fune)   return { key:'fune',    ku:toki.fune,    ba:toki.fune.ba };
  if (FX.okuribi && toki.okuribi)  return { key:'okuribi', ku:toki.okuribi, ba:toki.okuribi.ba };
  // 落柿舎のそば＝去来の一句（歩いて庵を訪ねた人だけに掛かる）
  if (walkMode && FX.rakushisha && toki.rakushisha &&
      Math.hypot(camera.position.x - 16.2, camera.position.z - 11.2) < 8)
    return { key:'rakushisha', ku:toki.rakushisha, ba:toki.rakushisha.ba };
  const st  = KU_BA[kuBaIdx()];
  // at を持つ特別の一首は、その詠み場では四季の句より先に掛かる。
  // 場の名はいまの停留表記で（json 側の旧番号には引きずられない）
  const at = Object.keys(toki).find(k => toki[k].at === st.ku);
  if (at) return { key: at, ku: toki[at], ba: st.ba };
  const set = HAIKU.ku[st.ku];
  const one = set && set[SHIKI.current];
  if (!one || !one.ku) return null;
  return { key: st.ku + '/' + SHIKI.current, ku: one, ba: st.ba };
}

function kuPaint(force){
  const p = kuPick();
  if (!p){ if (kuOpen) setKu(false); return; }
  if (!force && p.key === kuKey) return;
  const draw = () => {
    tzKu.innerHTML = '';
    p.ku.ku.forEach(line => {
      const d = document.createElement('div');
      d.className = 'tz-l';
      d.textContent = line;
      tzKu.appendChild(d);
    });
    tzKigo.textContent = p.ku.kigo ? '季語　' + p.ku.kigo : (p.ku.kata || '');
    tzBa.textContent   = p.ba || '';
    kuKey = p.key;
  };
  if (kuOpen && kuKey){          // 掛けたままの詠み替えは、ひと呼吸おいて
    tzIn.classList.add('kae');
    setTimeout(() => { draw(); tzIn.classList.remove('kae'); }, 300);
  } else {
    draw();
  }
}

function setKu(on){
  kuOpen = !!on;
  if (kuOpen) kuPaint(true);
  tzEl.classList.toggle('on', kuOpen);
  tzEl.setAttribute('aria-hidden', String(!kuOpen));
  kuBtn.textContent = kuOpen ? '短冊を畳む' : '一句詠む';
  kuBtn.setAttribute('aria-pressed', String(kuOpen));
}

/* 掛けている間だけ、場所の移りを見張る（毎フレームは要らない） */
function updateTanzaku(dt){
  if (!kuOpen) return;
  kuT += dt;
  if (kuT < 0.35) return;
  kuT = 0;
  kuPaint(false);
}

kuBtn.addEventListener('click', () => setKu(!kuOpen));

/* 町屋・川・橋・山をクリックして選ぶ（レール時）／タップで歩き・なぞって見回す（散歩時） */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const clickRoots = [daikakuji.group, nonomiya.group, nonomiya.hyouG, adashino.group,
                    tenryuji.group, unryu.group, river, bridgeGroup, mtGroup];
function setNdc(cx, cy){
  const r = renderer.domElement.getBoundingClientRect();
  ndc.x =  ((cx - r.left) / r.width)  * 2 - 1;
  ndc.y = -((cy - r.top)  / r.height) * 2 + 1;
}
function railPick(){
  const hit = ray.intersectObjects(clickRoots, true)[0];
  if (!hit) return -1;
  let o = hit.object, target = -1;
  while (o){
    // 距離ゲートで隠れている群れは、当たっても選ばれない（見えない寺には飛ばない）
    if (o === daikakuji.group){ target = daikakuji.group.visible ? 0 : -1; break; }
    if (o === nonomiya.group) { target = nonomiya.group.visible  ? 1 : -1; break; }
    if (o === nonomiya.hyouG) { target = 1; break; }
    if (o === adashino.group) { target = adashino.group.visible  ? 2 : -1; break; }
    if (o === tenryuji.group) { target = 3; break; }
    if (o === unryu.group)    { target = 3; break; }
    if (o === river)          { target = 4; break; }
    if (o === bridgeGroup)    { target = 5; break; }
    if (o === mtGroup)        { target = 6; break; }
    o = o.parent;
  }
  return target;
}
let pDown = null, pDrag = false;
renderer.domElement.addEventListener('pointerdown', ev => {
  if (RIDE.entering >= 0) return;                  // 乗り込みの間だけ手を離す
  if (TSUKI.phase !== 'idle' && !TSUKI.on) return; // 月白の幕の間も手を離す
  if (WARP.phase !== 'idle' && !GOJU.on) return;   // 五重塔ゆきの幕の間も手を離す
  if (RIDE.on || TSUKI.on || GOJU.on){             // 舟上・月面・塔のもと＝なぞって見回すだけ
    pDown = { x: ev.clientX, y: ev.clientY };
    pDrag = false;
    return;
  }
  if (!walkMode){
    setNdc(ev.clientX, ev.clientY);
    ray.setFromCamera(ndc, camera);
    // 舫った舟はどこからでも乗り込める
    if (FX.fune && ray.intersectObject(funaasobi.boat, true)[0]){ enterRide(); return; }
    // 町屋は停留ではなくなった ―― 巡りから触れたら、そぞろ歩きに入って店先へ寄る。
    // 名所の当たりと遠近を比べ、手前にあるほうを採る（橋ごしの町屋に横取りさせない）
    const hh = ray.intersectObjects(houseGroups, true)[0];
    const sh = ray.intersectObjects(clickRoots, true)[0];
    if (hh && (!sh || hh.distance <= sh.distance)){
      let o = hh.object;
      while (o && houseGroups.indexOf(o) === -1) o = o.parent;
      const hi = houseGroups.indexOf(o);
      if (hi >= 0){
        const h = HOUSES[hi];
        setWalk(true);
        WALK.target = { x: h.side * 1.55, z: h.z };
        return;
      }
    }
    const t = railPick();
    if (t >= 0 && t !== idx) goTo(t, true);
    return;
  }
  pDown = { x: ev.clientX, y: ev.clientY };
  pDrag = false;
});
window.addEventListener('pointermove', ev => {
  if (!pDown || (!walkMode && !RIDE.on && !TSUKI.on && !GOJU.on)) return;
  const dx = ev.clientX - pDown.x, dy = ev.clientY - pDown.y;
  if (!pDrag && Math.hypot(dx, dy) > 7) pDrag = true;
  if (pDrag){
    if (TSUKI.on){
      TSUKI.yaw   = Math.max(-1.9, Math.min(1.9, TSUKI.yaw - dx * 0.0042));
      TSUKI.pitch = Math.max(-0.45, Math.min(0.62, TSUKI.pitch - dy * 0.0032));
    } else if (GOJU.on){
      // 塔のもと＝真後ろの塔（Δyaw約±3.1）まで振り返れ、宝珠まで見上げられる上限
      GOJU.yaw   = Math.max(-3.4, Math.min(3.4, GOJU.yaw - dx * 0.0042));
      GOJU.pitch = Math.max(-0.5, Math.min(1.45, GOJU.pitch - dy * 0.0032));
    } else if (RIDE.on){
      RIDE.yaw   = Math.max(-2.4, Math.min(2.4, RIDE.yaw - dx * 0.0042));
      RIDE.pitch = Math.max(-0.5, Math.min(0.5, RIDE.pitch - dy * 0.0032));
    } else {
      WALK.yaw  -= dx * 0.0042;
      // 法堂の中では天井の龍まで見上げられるよう、上向きの上限をゆるめる
      const pUp = (camera.position.x >= 4.1 && camera.position.x <= 6.3 &&
                   camera.position.z <= -68.05 && camera.position.z >= -71.2) ? 1.25 : 0.5;
      WALK.pitch = Math.max(-0.55, Math.min(pUp, WALK.pitch - dy * 0.0032));
      WALK.manualUntil = elapsed + 2.0;
    }
    pDown = { x: ev.clientX, y: ev.clientY };
  }
});
window.addEventListener('pointerup', ev => {
  if (RIDE.on || TSUKI.on || GOJU.on){ pDown = null; pDrag = false; return; }
  if (WARP.phase !== 'idle'){ pDown = null; pDrag = false; return; }   // 幕の間は歩かせない
  if (!walkMode || !pDown) return;
  const wasDrag = pDrag;
  pDown = null; pDrag = false;
  if (wasDrag) return;
  // タップ＝歩く。舫った舟なら乗り込み、町屋なら店先へ、それ以外は地面（or 橋板）の一点へ
  setNdc(ev.clientX, ev.clientY);
  ray.setFromCamera(ndc, camera);
  if (FX.fune && ray.intersectObject(funaasobi.boat, true)[0]){ enterRide(); return; }
  // 塔は二度たたきの的（下の ㊾ の節）＝一度きりの押しでは歩き出さない
  if (ray.intersectObject(butai.touHit, false)[0]) return;
  if (FX.gojunoto && ray.intersectObject(goju.gojuHit, false)[0]) return;   // 書き割りの五重塔も同じ
  const hit = ray.intersectObjects(houseGroups, true)[0];
  if (hit){
    let o = hit.object;
    while (o && houseGroups.indexOf(o) === -1) o = o.parent;
    const hi = houseGroups.indexOf(o);
    if (hi >= 0){
      const h = HOUSES[hi];
      WALK.target = { x: h.side * 1.55, z: h.z };
      return;
    }
  }
  const g = groundPointFromRay();
  if (g) WALK.target = clampToWalkable(g.x, g.z);
});

/* ㊾ 月の都への口 ― 空の三日月をすばやく二度たたくと月面へ、
   月面では地球を二度たたくと地上へ。なぞり（見回し）は数に入れない。
   おなじ作法で、丘の上の三重塔を二度たたくと捌「塔の舞台」へ渡り、
   東山の書き割りに描かれた五重塔を二度たたくと月白の幕でそのもとへ渡る（隠しの口） */
const DBL = { t: -1, x: 0, y: 0, dx: 0, dy: 0 };
renderer.domElement.addEventListener('pointerdown', ev => {
  DBL.dx = ev.clientX; DBL.dy = ev.clientY;
});
renderer.domElement.addEventListener('pointerup', ev => {
  if (Math.hypot(ev.clientX - DBL.dx, ev.clientY - DBL.dy) > 26){ DBL.t = -1; return; }
  const now = performance.now();
  if (DBL.t > 0 && now - DBL.t < 380 &&
      Math.hypot(ev.clientX - DBL.x, ev.clientY - DBL.y) < 34){
    DBL.t = -1;
    setNdc(ev.clientX, ev.clientY);
    ray.setFromCamera(ndc, camera);
    if (TSUKI.on){
      if (ray.intersectObject(tsukimen.earthHit, false)[0]) exitTsuki();
      return;
    }
    if (GOJU.on){
      // 塔のもとでは、実物の塔をもう一度たたくと帰る（「町へ帰る」と同じ）
      if (ray.intersectObject(goju.kaeriHit, false)[0]) exitGoju();
      return;
    }
    if (TSUKI.phase !== 'idle' || WARP.phase !== 'idle') return; // 月白の幕の間は取り合わない
    if (FX.tsukiusagi && ray.intersectObject(tsukimen.moonHit, false)[0]){ enterTsuki(); return; }
    // 捌 塔の舞台 ― 塔を二度たたくと石段の上へ渡る（もう立っているなら動かさない）
    if (ray.intersectObject(butai.touHit, false)[0] && (walkMode || idx !== 7)){ goTo(7, true); return; }
    // ㊾' 書き割りの五重塔 ― 遠くの絵の塔を二度たたくと、月白の幕でそのもとへ渡る（隠しの口）
    if (FX.gojunoto && ray.intersectObject(goju.gojuHit, false)[0]) enterGoju();
    return;
  }
  DBL.t = now; DBL.x = ev.clientX; DBL.y = ev.clientY;
});
chiBtn.addEventListener('click', () => { if (GOJU.on) exitGoju(); else exitTsuki(); });

/* ============================================================
   9b. 宵の音 ― Web Audio 合成（音源ファイル無し）
   川のせせらぎ・鈴虫とこおろぎ・笹の葉ずれ・遠くの鐘。
   ブラウザの自動再生制限があるため、初回は必ず「♪ 音を灯す」から。
   ============================================================ */
const SND = {
  on   : false,   // 全体（ボタンで灯す・消す）
  kawa : true,    // 川のせせらぎ（側溝の水音が基調。川端に近づくほど満ちる）
  mushi: true,    // 鈴虫・こおろぎ（通り側）
  sasa : true,    // 笹の葉ずれ（竹林の小径だけ）
  kane : true,    // 遠くの鐘（50〜110秒にひとつ。天龍寺の境内では近く響く）
  higu : true,    // 蜩（ひぐらし）。川に近づくほど山の声が届く
  furin: true,    // 風鈴（茶店の軒。近くにいるときだけ）
  kawazu: true,   // 田の蛙（木戸の先の夏の夜。北の田でだけ満ちる）
  shishi: true,   // 鹿威し（鐘楼の庭。近くにいるとき、こおんとひとつ）
  mochi : true    // 餅つき（月の都。杵が落ちるたび、ぺったん）
};
let AC = null;                // AudioContext。初回の操作で作る
const sndNodes = {};
const sndBtn = document.getElementById('btn-snd');

/* 梵鐘：不整数倍音の重ね合わせ。低い唸りが長く残ると「遠くの鐘」になる */
function strikeKane(){
  if (!AC || !SND.on || !SND.kane || AC.state !== 'running') return false;
  const t = AC.currentTime;
  const f0 = 106 + Math.random() * 8;
  // [倍率, 強さ, 減衰秒]
  [[1, 1, 10], [2.0, 0.5, 7], [2.67, 0.3, 5], [3.01, 0.2, 4], [4.07, 0.12, 2.6], [5.43, 0.06, 1.8]]
  .forEach(p => {
    const o = AC.createOscillator();
    o.frequency.value = f0 * p[0] * (1 + (Math.random() - 0.5) * 0.004);
    const g = AC.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.16 * p[1], t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0004, t + p[2]);
    o.connect(g); g.connect(sndNodes.kaneBus);
    o.start(t); o.stop(t + p[2] + 0.1);
  });
  return true;
}

/* 撞いた鐘：撞木の当たり（短い当たり音）＋不整数倍音八本＋わずかな唸り。
   遠鐘より倍音を増やし、余韻を長く取る（鐘楼の下で聴く一打） */
function strikeShoro(){
  if (!AC || !SND.on || AC.state !== 'running' || !sndNodes.shoroBus) return false;
  const t = AC.currentTime;
  const f0 = 88 + Math.random() * 5;
  // [倍率, 強さ, 減衰秒]
  [[1, 1, 14], [1.5, 0.34, 9], [2.0, 0.55, 10], [2.67, 0.32, 7],
   [3.01, 0.22, 5.5], [4.07, 0.14, 3.6], [5.43, 0.08, 2.4], [6.79, 0.05, 1.6]]
  .forEach(p => {
    // 二本をわずかに離調して重ねる＝ゆっくりした唸り（本物の梵鐘の気配）
    [-1, 1].forEach(sgn => {
      const o = AC.createOscillator();
      o.frequency.value = f0 * p[0] * (1 + sgn * 0.0016 + (Math.random() - 0.5) * 0.003);
      const g = AC.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.11 * p[1], t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0004, t + p[2]);
      o.connect(g); g.connect(sndNodes.shoroBus);
      o.start(t); o.stop(t + p[2] + 0.1);
    });
  });
  // 撞木の当たり（木と青銅のこすれ。ごく短いノイズ）
  const src = AC.createBufferSource(); src.buffer = sndNodes.noise;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1750; bp.Q.value = 0.9;
  const ng = AC.createGain();
  ng.gain.setValueAtTime(0.14, t);
  ng.gain.exponentialRampToValueAtTime(0.0004, t + 0.22);
  src.connect(bp); bp.connect(ng); ng.connect(sndNodes.shoroBus);
  src.start(t); src.stop(t + 0.3);
  return true;
}

/* 鹿威し：乾いた竹の一打。鐘楼の庭（17.9,-50.9）の近くでだけ聞こえる。
   振りの当たりに合わせて毎フレーム側（㊽）から呼ばれる */
function strikeShishi(){
  if (!AC || !SND.on || !SND.shishi || AC.state !== 'running') return false;
  const d = Math.hypot(camera.position.x - 17.9, camera.position.z + 50.9);
  const amp = Math.max(0, 1 - d / 24);
  if (amp <= 0.02) return false;
  const t = AC.currentTime, a = amp * amp;
  // 竹の乾いた当たり（ごく短いノイズ）
  const src = AC.createBufferSource(); src.buffer = sndNodes.noise;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 2.4;
  const ng = AC.createGain();
  ng.gain.setValueAtTime(0.5 * a, t);
  ng.gain.exponentialRampToValueAtTime(0.0004, t + 0.09);
  src.connect(bp); bp.connect(ng); ng.connect(sndNodes.master);
  src.start(t); src.stop(t + 0.12);
  // 筒の低い響き（こおん、の余韻）
  [[640, 0.16, 0.34], [1280, 0.05, 0.2]].forEach(p => {
    const o = AC.createOscillator();
    o.frequency.value = p[0] * (1 + (Math.random() - 0.5) * 0.01);
    const g = AC.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(p[1] * a, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0004, t + p[2]);
    o.connect(g); g.connect(sndNodes.master);
    o.start(t); o.stop(t + p[2] + 0.1);
  });
  return true;
}

/* 餅つき：ぺったん。低いつきの身と、餅のねばりの短いノイズ（月の都で杵が落ちるたび） */
function strikeMochi(){
  if (!AC || !SND.on || !SND.mochi || AC.state !== 'running') return false;
  const t = AC.currentTime;
  // 杵の身（低い二音。すこし間を持たせた太鼓の胴のような鳴り）
  [[165, 0.26, 0.22], [318, 0.09, 0.12]].forEach(p => {
    const o = AC.createOscillator();
    o.frequency.setValueAtTime(p[0] * 1.06, t);
    o.frequency.exponentialRampToValueAtTime(p[0], t + 0.05);
    const g = AC.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(p[1], t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0004, t + p[2]);
    o.connect(g); g.connect(sndNodes.master);
    o.start(t); o.stop(t + p[2] + 0.1);
  });
  // 餅のねばり（やわらかいノイズをひと呼吸）
  const src = AC.createBufferSource(); src.buffer = sndNodes.noise;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 620; bp.Q.value = 1.1;
  const ng = AC.createGain();
  ng.gain.setValueAtTime(0.12, t);
  ng.gain.exponentialRampToValueAtTime(0.0004, t + 0.13);
  src.connect(bp); bp.connect(ng); ng.connect(sndNodes.master);
  src.start(t); src.stop(t + 0.16);
  return true;
}

/* 出力の実効値（RMS）。耳で確かめられない環境向けの計測口 */
function sndLevel(){
  if (!AC) return null;
  const a = sndNodes.analyser;
  const buf = new Float32Array(a.fftSize);
  if (a.getFloatTimeDomainData){
    a.getFloatTimeDomainData(buf);
  } else {
    const b8 = new Uint8Array(a.fftSize);
    a.getByteTimeDomainData(b8);
    for (let i = 0; i < b8.length; i++) buf[i] = (b8[i] - 128) / 128;
  }
  let s = 0;
  for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
  return Math.sqrt(s / buf.length);
}

function buildSound(){
  AC = new (window.AudioContext || window.webkitAudioContext)();
  const master = AC.createGain(); master.gain.value = 0.55;
  const analyser = AC.createAnalyser(); analyser.fftSize = 2048;
  master.connect(analyser); analyser.connect(AC.destination);
  sndNodes.master = master; sndNodes.analyser = analyser;

  // ノイズの種（2秒ループ）。川・笹はここから濾して作る
  const nbuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const nd = nbuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  sndNodes.noise = nbuf;                 // 撞木の当たり音もここから濾して作る
  const noiseSrc = () => {
    const s = AC.createBufferSource();
    s.buffer = nbuf; s.loop = true;
    return s;
  };

  // ── 川のせせらぎ：低いゴウ＋高めのサラサラを LFO でゆらす ──
  const kawaBus = AC.createGain(); kawaBus.gain.value = 0; kawaBus.connect(master);
  sndNodes.kawaBus = kawaBus;
  const low = AC.createBiquadFilter(); low.type = 'lowpass'; low.frequency.value = 620; low.Q.value = 0.7;
  const lowG = AC.createGain(); lowG.gain.value = 0.5;
  const n1 = noiseSrc(); n1.connect(low); low.connect(lowG); lowG.connect(kawaBus); n1.start();
  const band = AC.createBiquadFilter(); band.type = 'bandpass'; band.frequency.value = 1900; band.Q.value = 0.9;
  const burG = AC.createGain(); burG.gain.value = 0.28;
  const n2 = noiseSrc(); n2.connect(band); band.connect(burG); burG.connect(kawaBus); n2.start(0, 0.7);
  const lfo1 = AC.createOscillator(); lfo1.frequency.value = 0.22;
  const lfo1G = AC.createGain(); lfo1G.gain.value = 0.16;
  lfo1.connect(lfo1G); lfo1G.connect(burG.gain); lfo1.start();

  // ── 笹の葉ずれ：竹林の小径でだけ、風がまとまって通る ──
  const sasaG = AC.createGain(); sasaG.gain.value = 0; sasaG.connect(master);
  sndNodes.sasaG = sasaG;
  const sasaF = AC.createBiquadFilter(); sasaF.type = 'bandpass'; sasaF.frequency.value = 2700; sasaF.Q.value = 0.5;
  const windG = AC.createGain(); windG.gain.value = 0.6;
  const n3 = noiseSrc(); n3.connect(sasaF); sasaF.connect(windG); windG.connect(sasaG); n3.start(0, 1.3);
  const lfo2 = AC.createOscillator(); lfo2.frequency.value = 0.13;
  const lfo2G = AC.createGain(); lfo2G.gain.value = 0.4;
  lfo2.connect(lfo2G); lfo2G.connect(windG.gain); lfo2.start();

  // ── 鈴虫二匹とこおろぎ一匹 ──
  const mushiBus = AC.createGain(); mushiBus.gain.value = 0; mushiBus.connect(master);
  sndNodes.mushiBus = mushiBus;
  const voices = [
    { f: 4300, trem: 32, pan: -0.4, amp: 0.05, kind: 'suzu' },
    { f: 4800, trem: 27, pan:  0.5, amp: 0.04, kind: 'suzu' },
    { f: 2150, trem:  0, pan:  0.15, amp: 0.06, kind: 'koro' }
  ];
  voices.forEach(v => {
    const o = AC.createOscillator(); o.frequency.value = v.f;
    const trm = AC.createGain(); trm.gain.value = v.trem ? 0.55 : 1.0;
    if (v.trem){
      const to = AC.createOscillator(); to.frequency.value = v.trem;
      const tg = AC.createGain(); tg.gain.value = 0.45;
      to.connect(tg); tg.connect(trm.gain); to.start();
    }
    const env = AC.createGain(); env.gain.value = 0;
    o.connect(trm); trm.connect(env); o.start();
    let tail = env;
    if (AC.createStereoPanner){
      const pan = AC.createStereoPanner(); pan.pan.value = v.pan;
      env.connect(pan); tail = pan;
    }
    tail.connect(mushiBus);
    v.env = env;
    // 鳴いて、休んで、また鳴く（フラグが消えている間は待つだけ）
    const chirp = () => {
      let next;
      if (SND.on && SND.mushi && AC.state === 'running'){
        const t = AC.currentTime, e = v.env.gain;
        e.cancelScheduledValues(t);
        e.setValueAtTime(0, t);
        if (v.kind === 'suzu'){
          const dur = 0.6 + Math.random() * 0.7;
          e.linearRampToValueAtTime(v.amp, t + 0.06);
          e.setValueAtTime(v.amp, t + dur - 0.12);
          e.linearRampToValueAtTime(0, t + dur);
          next = dur + 0.4 + Math.random() * 1.6;
        } else {
          const n = 3 + Math.floor(Math.random() * 3);   // コロコロ…と三〜五連
          for (let k = 0; k < n; k++){
            const s = t + k * 0.14;
            e.linearRampToValueAtTime(v.amp, s + 0.02);
            e.linearRampToValueAtTime(0, s + 0.10);
          }
          next = n * 0.14 + 0.8 + Math.random() * 1.8;
        }
      } else next = 0.8;
      setTimeout(chirp, next * 1000);
    };
    chirp();
  });

  // ── 蜩（ひぐらし）：カナカナ…と連なって、すこし下がりながら遠ざかる ──
  const higuBus = AC.createGain(); higuBus.gain.value = 0; higuBus.connect(master);
  sndNodes.higuBus = higuBus;
  [{ f: 3950, pan: -0.75 }, { f: 3600, pan: 0.7 }].forEach((v, vi) => {
    const o = AC.createOscillator(); o.frequency.value = v.f;
    const env = AC.createGain(); env.gain.value = 0;
    o.connect(env); o.start();
    let tail = env;
    if (AC.createStereoPanner){
      const pan = AC.createStereoPanner(); pan.pan.value = v.pan;
      env.connect(pan); tail = pan;
    }
    tail.connect(higuBus);
    const series = () => {
      let next;
      if (SND.on && SND.higu && AC.state === 'running'){
        const t = AC.currentTime;
        const n = 12 + Math.floor(Math.random() * 8);
        for (let k = 0; k < n; k++){
          const s = t + k * 0.115;
          const a = 0.05 * (k < 3 ? (k + 1) / 3 : (k > n - 5 ? (n - k) / 5 : 1));
          env.gain.setValueAtTime(0, s);
          env.gain.linearRampToValueAtTime(a, s + 0.025);
          env.gain.linearRampToValueAtTime(0, s + 0.095);
          o.frequency.setValueAtTime(v.f * (1 - k * 0.004), s);
        }
        next = n * 0.115 + 14 + Math.random() * 22;
      } else next = 1.2;
      setTimeout(series, next * 1000);
    };
    setTimeout(series, (3 + vi * 9 + Math.random() * 6) * 1000);
  });

  // ── 田の蛙：木戸の先でだけ満ちる夏の夜の合唱（ゲッゲッ…と間遠に掛け合う） ──
  const kawazuBus = AC.createGain(); kawazuBus.gain.value = 0; kawazuBus.connect(master);
  sndNodes.kawazuBus = kawazuBus;
  [{ f: 840, trem: 23, pan: -0.6, amp: 0.055 },
   { f: 1010, trem: 27, pan: 0.55, amp: 0.045 },
   { f: 700, trem: 19, pan: 0.1, amp: 0.05 }].forEach((v, vi) => {
    const o = AC.createOscillator(); o.frequency.value = v.f;
    const o2 = AC.createOscillator(); o2.frequency.value = v.f * 2.02;   // 鼻にかかる上音
    const o2g = AC.createGain(); o2g.gain.value = 0.35;
    const trm = AC.createGain(); trm.gain.value = 0.5;
    const to = AC.createOscillator(); to.frequency.value = v.trem;
    const tg = AC.createGain(); tg.gain.value = 0.5;
    to.connect(tg); tg.connect(trm.gain); to.start();
    const env = AC.createGain(); env.gain.value = 0;
    o.connect(trm); o2.connect(o2g); o2g.connect(trm); trm.connect(env);
    o.start(); o2.start();
    let tail = env;
    if (AC.createStereoPanner){
      const pan = AC.createStereoPanner(); pan.pan.value = v.pan;
      env.connect(pan); tail = pan;
    }
    tail.connect(kawazuBus);
    const gero = () => {
      let next;
      if (SND.on && SND.kawazu && AC.state === 'running'){
        const t = AC.currentTime;
        const n = 2 + Math.floor(Math.random() * 4);     // ゲッゲッ…と二〜五声
        for (let k = 0; k < n; k++){
          const s = t + k * (0.42 + Math.random() * 0.1);
          env.gain.setValueAtTime(0, s);
          env.gain.linearRampToValueAtTime(v.amp, s + 0.03);
          env.gain.setValueAtTime(v.amp, s + 0.24);
          env.gain.linearRampToValueAtTime(0, s + 0.34);
        }
        next = n * 0.52 + 1.6 + Math.random() * 4.5;
      } else next = 1.0;
      setTimeout(gero, next * 1000);
    };
    setTimeout(gero, (1.5 + vi * 2.7 + Math.random() * 3) * 1000);
  });

  // ── 風鈴：茶店の軒で、風の気まぐれにちりん。ときどき二度鳴り ──
  const furinBus = AC.createGain(); furinBus.gain.value = 0; furinBus.connect(master);
  sndNodes.furinBus = furinBus;
  const strikeFurin = () => {
    if (!AC || !SND.on || !SND.furin || AC.state !== 'running') return false;
    const t = AC.currentTime;
    [[2950, 0.11, 1.5], [4400, 0.065, 1.2], [5900, 0.04, 0.9], [7300, 0.024, 0.7]]
    .forEach(p => {
      const o = AC.createOscillator();
      o.frequency.value = p[0] * (1 + (Math.random() - 0.5) * 0.01);
      const g = AC.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(p[1], t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0004, t + p[2]);
      o.connect(g); g.connect(furinBus);
      o.start(t); o.stop(t + p[2] + 0.1);
    });
    return true;
  };
  sndNodes.strikeFurin = strikeFurin;
  const furinLoop = () => {
    strikeFurin();
    if (Math.random() < 0.35) setTimeout(strikeFurin, 160 + Math.random() * 120);
    setTimeout(furinLoop, (5 + Math.random() * 9) * 1000);
  };
  setTimeout(furinLoop, (4 + Math.random() * 5) * 1000);

  // ── 遠くの鐘：低域を残して、短い残響をひとさじ ──
  const kaneBus = AC.createGain(); kaneBus.gain.value = 1;
  sndNodes.kaneBus = kaneBus;
  const kaneLp = AC.createBiquadFilter(); kaneLp.type = 'lowpass'; kaneLp.frequency.value = 950;
  sndNodes.kaneLp = kaneLp;
  kaneBus.connect(kaneLp); kaneLp.connect(master);
  const dly = AC.createDelay(1.0); dly.delayTime.value = 0.23;
  const fb = AC.createGain(); fb.gain.value = 0.32;
  const wet = AC.createGain(); wet.gain.value = 0.22;
  kaneLp.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(master);
  const kaneLoop = () => {
    strikeKane();
    setTimeout(kaneLoop, (50 + Math.random() * 60) * 1000);
  };
  setTimeout(kaneLoop, (12 + Math.random() * 8) * 1000);   // 最初のひとつは灯して十数秒後

  // ── 撞いた鐘（鐘楼の下でじぶんが撞く一打）：遠鐘とは別系統。
  //     高域を開けて撞木の当たりを聴かせ、余韻は長く残す ──
  const shoroBus = AC.createGain(); shoroBus.gain.value = 1;
  sndNodes.shoroBus = shoroBus;
  const shoroLp = AC.createBiquadFilter(); shoroLp.type = 'lowpass'; shoroLp.frequency.value = 2600;
  shoroBus.connect(shoroLp); shoroLp.connect(master);
  const sdly = AC.createDelay(1.5); sdly.delayTime.value = 0.41;
  const sfb = AC.createGain(); sfb.gain.value = 0.42;
  const swet = AC.createGain(); swet.gain.value = 0.3;
  shoroLp.connect(sdly); sdly.connect(sfb); sfb.connect(sdly); sdly.connect(swet); swet.connect(master);
}

/* 場所で聞こえ方が変わる（毎フレーム。灯していない間は何もしない） */
function updateSoundMix(){
  if (!AC || !SND.on) return;
  if (TSUKI.on){
    // 月は音のない世界。地上の虫も川も置いてきて、遠い鐘だけかすかに届く
    const k2 = 0.06;
    ['kawaBus','mushiBus','sasaG','higuBus','furinBus','kawazuBus'].forEach(n => {
      sndNodes[n].gain.value += (0 - sndNodes[n].gain.value) * k2;
    });
    sndNodes.kaneBus.gain.value += (0.12 - sndNodes.kaneBus.gain.value) * k2;
    sndNodes.kaneLp.frequency.value += (600 - sndNodes.kaneLp.frequency.value) * k2;
    return;
  }
  const z = camera.position.z, x = camera.position.x;
  // 川：通りでは側溝の水音がかすかに、z-30 から川の気配、川端 z-78 で満ちる
  const rv = Math.min(1, Math.max(0, (-z - 30) / 48));
  const kawaT = SND.kawa ? 0.05 + 0.20 * rv * rv : 0;
  // 夜の声（虫と蜩）は明けるにつれて遠のく。川と鐘は朝も変わらず（㊿）
  const yoru = 1 - TOKI.k;
  // 虫：通りで満ち、川端では控えめに
  const mushiT = SND.mushi ? (1 - 0.75 * Math.min(1, Math.max(0, (-z - 48) / 32))) * yoru : 0;
  // 笹：竹林（z-56〜-78）でだけ山なりに
  const sasaT = SND.sasa ? 0.14 * Math.max(0, 1 - Math.abs(-z - 67) / 13) : 0;
  // 蜩：山と川が近づくほど、対岸の声が届く
  const hf = Math.min(1, Math.max(0, (-z - 44) / 36));
  const higuT = SND.higu ? 0.30 * hf * yoru : 0;
  // 風鈴：茶店の軒（10.8, -82.4）の近くにいるときだけ
  const fd = Math.hypot(x - 10.8, z + 82.4);
  const fg = Math.max(0, 1 - fd / 26);
  const furinT = SND.furin ? 0.6 * fg * fg : 0;
  // 蛙：木戸の先の田でだけ。木戸ごしにもかすかに届く
  const kz = Math.min(1, Math.max(0, (z + 2) / 9));
  const kawazuT = SND.kawazu ? 0.85 * kz * kz : 0;
  // 鐘：天龍寺の境内と念仏寺の野にいるあいだは近く、すこし明るく響く
  //（念仏寺の鐘は本堂の北脇の三宝の鐘）
  //（鐘楼の庭 z-49〜-58.4 も境内のうち。撞く鐘の足もとなので近く響く）
  const inTera = (x > 7.3 && z > -77 && z < -48) || (x < -8.6 && z > -77 && z < -57);
  const kaneG = inTera ? 1.75 : 1.0;
  const kaneF = inTera ? 1350 : 950;
  const k = 0.06;
  sndNodes.kawaBus.gain.value  += (kawaT  - sndNodes.kawaBus.gain.value)  * k;
  sndNodes.mushiBus.gain.value += (mushiT - sndNodes.mushiBus.gain.value) * k;
  sndNodes.sasaG.gain.value    += (sasaT  - sndNodes.sasaG.gain.value)    * k;
  sndNodes.higuBus.gain.value  += (higuT  - sndNodes.higuBus.gain.value)  * k;
  sndNodes.furinBus.gain.value += (furinT - sndNodes.furinBus.gain.value) * k;
  sndNodes.kawazuBus.gain.value += (kawazuT - sndNodes.kawazuBus.gain.value) * k;
  sndNodes.kaneBus.gain.value  += (kaneG  - sndNodes.kaneBus.gain.value)  * k;
  sndNodes.kaneLp.frequency.value += (kaneF - sndNodes.kaneLp.frequency.value) * k;
}

/* ============================================================
   ㊿ 祈りと参り ― 時（とき）を動かす
   愛宕念仏寺出張所の本堂の前で「祈る」と、送り終えた夜が明けていく。
   野宮神社の本殿の前で「参る」と、日が落ちて宵に還る。
   化野は千灯供養の野＝死者を送る場所なので、祈りの帰結は夜明け。
   野宮は斎宮が伊勢へ下る前に潔斎した宮で、源氏の「賢木」も宵の場面。

   明るさは真昼まで行かず「暁（夜明け）」で止める ―― この町は月あかりの
   世界として組んであるので、竹の月漏れも水鏡も鬼火も、薄明かりのなかで
   なら生きたまま残る。有明の月も薄く残すので、月の都（㊾）への口も塞がない。

   仕掛けはひとつの数 TOKI.k（0=宵 / 1=暁）だけ。空・霧・明かり・月・東の空は
   これを読み、灯りと地物は毎フレームの最後に一括で塗り替える。あとから景を
   足しても、この一箇所を通るので自動で朝夜に乗る。
   ============================================================ */
const TOKI = {
  // 入口は暁で開ける（下の tokiSky() が起動時に一度塗る）。宵へは野宮に参れば還る。
  // ここを 0 に戻せば、もとの「宵から始まる町」に戻せる
  k: 1,                 // 0=宵 / 1=暁。転換のあいだは途中の値
  to: 1,                // めざす値
  phase: 'idle',        // idle ／ gassho（手を合わせている間）／ utsuri（移ろい）
  t: 0,
  at: null,             // いま祈っている場所
  near: null,           // 立っている祈り場（ボタンの出入りに使う）
  dip: 0,               // 合掌のあいだ、ひと呼吸ぶん明かりが沈む
  GASSHO: 1.5,          // 手を合わせている間（秒）
  UTSURI: 8.0,          // 空が変わりきるまで（秒）
  /* 赤入れ用の目盛り。__machiya.toki.tune を書き替えて set() で試着できる。
     霧の色を明るくしすぎると嵐山が白い壁になって形を失う（見比べて決めた値） */
  tune: { amb: 0.84, ambCol: 0x77809a, sun: 0.46, sunCol: 0xffb98c,
          fog: 0.0208, fogCol: 0x4d5b74, clear: 0x4c5972, tint: 0.42,
          akane: 0.52, shiro: 0.34 }
};

/* 祈り場。半径は「本堂・本殿の前に立った人だけ」に届く狭さで取る
   （鐘楼の庭は 6.4m 圏なので、野宮の 5.2m 圏とは重ならない） */
const INORI = [
  { key:'ake', x:-25.0, z:-67.0, r:5.2, to:1, btn:'祈る', spot:'本堂の前',
    hint:'本堂の前　／　「祈る」でひとつ手を合わせます',
    utsuri:'東の空が白んでいきます　―　愛宕念仏寺出張所',
    done:'夜が明けました　―　有明の月がまだ残っています',
    already:'もう夜は明けております' },
  { key:'kure', x:17.6, z:-42.0, r:5.2, to:0, btn:'参る', spot:'本殿の前',
    hint:'本殿の前　／　「参る」でひとつ手を合わせます',
    utsuri:'日が落ちて、宵が満ちてきます　―　野宮神社',
    done:'宵に還りました　―　灯がひとつずつ点ります',
    already:'まだ宵のうちです' }
];

const inoriBtn = document.getElementById('btn-inori');

/* いま立っている祈り場（転換の最中かどうかは見ない） */
function inoriSpot(){
  if (!FX.inori || TSUKI.on || TSUKI.phase !== 'idle' || rideActive()) return null;
  for (let i = 0; i < INORI.length; i++){
    const p = INORI[i];
    if (!(p.key === 'ake' ? FX.adashino : FX.nonomiya)) continue;
    if (Math.hypot(camera.position.x - p.x, camera.position.z - p.z) < p.r) return p;
  }
  return null;
}
function syncInoriBtn(){
  const show = !!TOKI.near && TOKI.phase === 'idle';
  const was = inoriBtn.style.display !== 'none';
  inoriBtn.style.display = show ? '' : 'none';
  if (show) inoriBtn.textContent = TOKI.near.btn;
  if (show !== was) layoutBottom();      // 段組みが変わるので札と手引きを置き直す
}
function showInoriHint(){
  if (TOKI.phase !== 'idle') return;     // 転換のあいだの言葉は消さない
  if (KANE.near) return;                 // 鐘楼の手引きとは取り合わない
  if (TOKI.near) hintEl.textContent = TOKI.near.hint;
  else hintEl.textContent = walkMode ? HINT_WALK : HINT_RAIL;
}
/* 手を合わせる。すでにその時分なら、鐘だけ鳴って景色は動かない */
function inoru(){
  if (TOKI.phase !== 'idle') return false;
  const p = TOKI.near || inoriSpot();
  if (!p) return false;
  TOKI.at = p; TOKI.phase = 'gassho'; TOKI.t = 0;
  strikeKane();                          // 合わせた手に、遠くの鐘がひとつ
  hintEl.textContent = (Math.abs(TOKI.k - p.to) < 0.001) ? p.already : p.utsuri;
  syncInoriBtn();
  return true;
}
inoriBtn.addEventListener('click', () => inoru());

/* 灯が消えた紙・炭の色（彩度を落として、すこし沈める） */
function keshiIro(hex){
  const r = (hex >> 16) & 255, g = (hex >> 8) & 255, b = hex & 255;
  const l = r * 0.30 + g * 0.59 + b * 0.11;
  const m = v => Math.round((v * 0.28 + l * 0.72) * 0.80);
  return (m(r) << 16) | (m(g) << 8) | m(b);
}
/* 夜の色に朝の光が差す＝もとの色を明るく、わずかに暖かく。
   四季の衣替え（SHIKI）が塗り替えた色にも、そのまま上乗せできる */
function akeIro(hex, k){
  const r = (hex >> 16) & 255, g = (hex >> 8) & 255, b = hex & 255;
  const gain = 1 + TOKI.tune.tint * k;
  return (Math.min(255, Math.round(r * gain * (1 + 0.06 * k))) << 16)
       | (Math.min(255, Math.round(g * gain * (1 + 0.01 * k))) << 8)
       |  Math.min(255, Math.round(b * gain * (1 - 0.06 * k)));
}

/* 灯りと地物を一度だけ集める。
   ・灯り＝加算合成の光とスプライト（提灯の照り返し・篝火・鬼火・蛍・星…）
   ・紙の灯＝加算ではない暖色の板（提灯の身・障子・戸の灯）
   ・地物＝Lambert の面（屋根・壁・山・苔・土…）
   月の都（㊾）の中身は地上の朝夜に乗せない＝先に印を付けて外す */
const tokiMats = (function(){
  tsukimen.group.traverse(o => {
    const ms = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : null;
    if (ms) ms.forEach(m => { if (m) m.userData.tokiSkip = true; });
  });
  const lamps = [], kami = [], lands = [], seen = new Set();
  scene.traverse(o => {
    const ms = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : null;
    if (!ms) return;
    ms.forEach(m => {
      if (!m || m.userData.tokiSkip || seen.has(m)) return;
      seen.add(m);
      if (m.blending === THREE.AdditiveBlending || o.isSprite){
        lamps.push({ m: m, base: m.opacity, wrote: NaN });
        return;
      }
      if (m.isMeshLambertMaterial){
        lands.push({ m: m, base: m.color.getHex(), wrote: -1,
                     baseE: m.emissive ? m.emissive.getHex() : 0, wroteE: -1 });
        return;
      }
      // 加算ではない暖色の板＝紙ごしの灯り（提灯の身・障子・虫籠窓・火袋・炎の身）。
      // 敷居は 0xD0 まで下げる ―― 虫籠窓の灯 0xd89a4e が 0xE0 では漏れた
      if (m.isMeshBasicMaterial && m.color){
        const h = m.color.getHex(), r = (h >> 16) & 255, b = h & 255;
        if (r >= 0xD0 && b <= r * 0.88 || o.geometry === GEO.lantern){
          kami.push({ m: m, base: h, wrote: -1 });
        }
      }
    });
  });
  lamps.push({ m: starsMat, base: starsMat.opacity, wrote: NaN });   // 星は加算ではないので手で
  return { lamps: lamps, kami: kami, lands: lands };
})();

/* 毎フレームの最後に一度だけ塗り替える。
   演出の側が毎フレーム opacity や色を書き直すので、「前に自分が書いた値と
   違っていたら、それが素の値」という見分け方で、素と塗りを取り違えない */
function tokiPaint(){
  const k = TOKI.k, f = 1 - k;
  const L = tokiMats.lamps;
  for (let i = 0; i < L.length; i++){
    const r = L[i];
    if (r.m.opacity !== r.wrote) r.base = r.m.opacity;
    r.m.opacity = r.base * f;
    r.wrote = r.m.opacity;
  }
  const K = tokiMats.kami;
  for (let i = 0; i < K.length; i++){
    const r = K[i], cur = r.m.color.getHex();
    if (cur !== r.wrote) r.base = cur;
    const nx = mixHex(r.base, keshiIro(r.base), k);
    r.m.color.setHex(nx); r.wrote = nx;
  }
  const D = tokiMats.lands;
  for (let i = 0; i < D.length; i++){
    const r = D[i], cur = r.m.color.getHex();
    if (cur !== r.wrote) r.base = cur;
    const nx = akeIro(r.base, k);
    r.m.color.setHex(nx); r.wrote = nx;
    if (r.m.emissive){
      const ce = r.m.emissive.getHex();
      if (ce !== r.wroteE) r.baseE = ce;
      const ne = mixHex(r.baseE, 0x000000, k);
      r.m.emissive.setHex(ne); r.wroteE = ne;
    }
  }
  // 提灯の点光源は素の強さを持たない（毎フレーム決め直される）ので、その場で掛ける
  for (let i = 0; i < roamLights.length; i++) roamLights[i].intensity *= f;
}

/* 空・霧・明かり・月・東の空。k が動いた時と、合掌のひと呼吸の間だけ呼ぶ */
function tokiSky(){
  const k = TOKI.k, T = TOKI.tune, Y = AKARI_YORU;
  const d = 1 - TOKI.dip * 0.14;                  // 合掌のあいだ、明かりがすこし沈む
  SKY.paint(k);
  if (!TSUKI.on){                                  // 月の都では霧を休ませている＝触らない
    scene.fog.color.setHex(mixHex(Y.fog, T.fogCol, k));
    scene.fog.density = Y.fogD + (T.fog - Y.fogD) * k;
  }
  renderer.setClearColor(mixHex(Y.clear, T.clear, k), 1);
  ambLight.color.setHex(mixHex(Y.amb, T.ambCol, k));
  ambLight.intensity = (Y.ambI + (T.amb - Y.ambI) * k) * d;
  moonLight.color.setHex(mixHex(Y.tsuki, T.sunCol, k));
  moonLight.intensity = (Y.tsukiI + (T.sun - Y.tsukiI) * k) * d;
  moonLight.position.set(-8 - 22 * k, 16 - 10 * k, 6 - 12 * k);   // 東の低みへ降りる
  // 有明の月：色を褪せさせるだけで消さない。欠けぎわは明けていく空の色に寄せる
  moonFx.disc.material.color.setHex(mixHex(0xFFE9BE, 0xE7ECF4, k));
  moonFx.bite.material.color.setHex(mixHex(0x0a1226, SKY.AKE[1], k));
  // 東の空（板は k が立ってから灯す＝宵のあいだは描かない）
  akatsukiFx.akane.visible = akatsukiFx.shiro.visible = k > 0.004;
  akatsukiFx.akane.material.opacity = T.akane * k;
  akatsukiFx.shiro.material.opacity = T.shiro * k;
}

function updateToki(dt){
  const here = inoriSpot();
  if (here !== TOKI.near){ TOKI.near = here; syncInoriBtn(); showInoriHint(); }

  if (TOKI.phase === 'gassho'){
    TOKI.t += dt;
    TOKI.dip = Math.sin(Math.min(1, TOKI.t / TOKI.GASSHO) * Math.PI);
    if (TOKI.t >= TOKI.GASSHO){
      TOKI.dip = 0;
      TOKI.t = 0;
      if (Math.abs(TOKI.k - TOKI.at.to) < 0.001){    // すでにその時分＝景色は動かない
        TOKI.phase = 'idle';
        syncInoriBtn(); showInoriHint();
      } else {
        TOKI.to = TOKI.at.to;
        TOKI.phase = 'utsuri';
      }
    }
    tokiSky();
  } else if (TOKI.phase === 'utsuri'){
    const step = dt / TOKI.UTSURI;
    TOKI.k = TOKI.to > TOKI.k ? Math.min(TOKI.to, TOKI.k + step)
                              : Math.max(TOKI.to, TOKI.k - step);
    tokiSky();
    if (TOKI.k === TOKI.to){
      TOKI.phase = 'idle';
      hintEl.textContent = TOKI.at.done;
      syncInoriBtn();
    }
  }
}
tokiSky();

/* ============================================================
   10. 毎フレーム
   ============================================================ */
const clock = new THREE.Clock();
let elapsed = 0;

function update(dt){
  elapsed += dt;
  if (TSUKI.phase !== 'idle') updateTsuki(dt);            // ㊾ 月の都（幕の間もここが手綱）
  else if (GOJU.on) updateGoju(dt);                       // ㊾' 五重塔のもと（立ち姿と見回し）
  else if (RIDE.on || RIDE.entering >= 0) updateRide(dt);
  else if (walkMode) updateWalk(dt);
  else updateCamera(dt);
  if (WARP.phase !== 'idle') updateWarp(dt);              // 五重塔ゆきの幕（景色は下で生きたまま）

  // 提灯：ゆらぐ灯り（町屋は停留ではなくなったので、一軒だけ明るくする気配りは畳んだ）
  houseGroups.forEach((g, i) => {
    const u = g.userData;

    hirosawa.funeHi.material.opacity = 0.28 + Math.sin(elapsed * 3.6 + 0.9) * 0.06;
    hirosawa.fune.position.y = Math.sin(elapsed * 0.7) * 0.025;
    hirosawa.fune.rotation.z = Math.sin(elapsed * 0.58 + 0.6) * 0.018;
  }

  // ㊶ 大沢池：観月台に立つと水面の光がこちらへ伸びる／舟と常夜灯のまたたき
  osawa.group.visible = FX.osawa && kitaNear;
  if (osawa.group.visible){
    const om = osawa.tsukiMichi;
    om.material.opacity = 0.24 + Math.sin(elapsed * 0.62 + 0.9) * 0.05;

    osawa.shimmer.material.opacity = 0.26 + Math.max(0, Math.sin(elapsed * 1.9 + 0.6)) * 0.22;
    osawa.funeHi.opacity = 0.54 + Math.sin(elapsed * 3.3 + 2.4) * 0.09;
    osawa.daiHalo.material.opacity = 0.26 + Math.sin(elapsed * 2.7 + 1.5) * 0.05;
  }

  // ㊷ 落柿舎：障子のほの灯（北の群れと同じく、近づいたときだけ描く）
  rakushisha.group.visible = FX.rakushisha && kitaNear;
  if (rakushisha.group.visible){
    rakushisha.shoji.material.opacity = 0.38 + Math.sin(elapsed * 1.9 + 0.4) * 0.05;
    rakushisha.halo.material.opacity = 0.18 + Math.sin(elapsed * 2.6 + 1.1) * 0.04;

  // ㊸ 小倉山の多宝塔：灯のまたたき
  tahoto.group.visible = FX.tahoto && kitaNear;
  if (tahoto.group.visible){
    tahoto.hi.material.opacity = 0.26 + Math.sin(elapsed * 2.8 + 2.2) * 0.06;

  }
  // ㊹ 千日詣り：提灯の列がつづら折りを登り続ける（文月晦日の宵だけ）
  sennichi.group.visible = FX.sennichi;
  if (FX.sennichi) sennichi.step(dt, elapsed);
  // ㊺ 鳥居形と灯篭流し（葉月十六日の宵だけ。試灯は __machiya.FX.toriigata）
  toriigata.group.visible = FX.toriigata;
  if (FX.toriigata) toriigata.step(dt, elapsed);
  // ㊻ 人力車：提灯がゆらゆら
  jinrikisha.group.visible = FX.jinrikisha;
  if (FX.jinrikisha){
    jinrikisha.choG.rotation.z = Math.sin(elapsed * 1.15) * 0.09;
    jinrikisha.halo.material.opacity = 0.22 + Math.sin(elapsed * 3.3 + 0.7) * 0.05;
  }
  // ㊼ 保津川下りの舟（運行の合間は上流で舟を休める）
  kudari.group.visible = FX.kudari;
  if (FX.kudari) kudari.step(dt, elapsed);
  // ㊽ 鹿威し：たまって、こぼれて、こおん
  shishiodoshi.group.visible = FX.shishi;
  if (FX.shishi) shishiodoshi.step(dt, elapsed, strikeShishi);

  // ㊳ 鐘楼の庭：常夜灯のまたたきと、撞木の振り・鐘の震え・除夜の数え
  shoro.group.visible = FX.shoro;
  if (FX.shoro){
    shoro.halos.forEach((h, k) => {
      h.material.opacity = 0.24 + Math.sin(elapsed * 2.4 + k * 2.1) * 0.05;
    });
  }
  updateKane(dt);

  // 宵の音：場所に合わせて聞こえ方を寄せていく
  updateSoundMix();

  // 短冊：掛けている間、場所が移れば詠み替える
  updateTanzaku(dt);

  // 猫のしっぽ
  cat.userData.tail.rotation.z = 0.6 + Math.sin(elapsed * 1.6) * 0.34;
  cat.rotation.y = ((HOUSES[2] || HOUSES[0]).side < 0 ? Math.PI / 2 : -Math.PI / 2)
                 + Math.sin(elapsed * 0.31) * 0.22;

  // ㊿ 祈りと参り：時を進めてから、灯りと地物をまとめて塗り替える。
  //    ここが毎フレームの最後の書き手＝上の演出が書いた素の値の上に朝夜が乗る
  updateToki(dt);
  tokiPaint();
}

/* ============================================================
   11. 目視できない環境向けの検証口
   ============================================================ */
window.__machiya = {
  /* pane 非表示で viewport が 0x0 の環境向け：描画寸法を手で決めて一枚描く */
  size: function(w, h){
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
    renderer.render(scene, camera);
    return { w: w, h: h };
  },
  /* 画面の一部だけ読む（水面の細い光など、全画面平均に埋もれるものの実証用） */
  rect: function(px, py, w, h){
    renderer.render(scene, camera);
    const gl = renderer.getContext();
    const buf = new Uint8Array(w * h * 4);
    gl.readPixels(px, gl.drawingBufferHeight - py - h, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    let sum = 0, mx = 0;
    for (let i = 0; i < w * h; i++){
      const l = (buf[i*4] + buf[i*4+1] + buf[i*4+2]) / 3;
      sum += l; if (l > mx) mx = l;
    }
    return { mean: +(sum / (w * h)).toFixed(2), max: Math.round(mx) };
  },
  /* 世界座標 → 画面ピクセル（rect の狙いを付ける用） */
  proj: function(x, y, z){
    const v = new THREE.Vector3(x, y, z).project(camera);
    const gl = renderer.getContext();
    return { ndc: [+v.x.toFixed(3), +v.y.toFixed(3)],
             px: [Math.round((v.x + 1) / 2 * gl.drawingBufferWidth),
                  Math.round((1 - (v.y + 1) / 2) * gl.drawingBufferHeight)],
             inFront: v.z < 1 };
  },
  /* 手送りで時間を進める（preview では rAF が止まることがあるため） */
  step: function(frames, dt){
    frames = frames || 1; dt = dt || 1/60;
    for (let i = 0; i < frames; i++) update(dt);
    renderer.render(scene, camera);
    return { elapsed: +elapsed.toFixed(2), idx: idx, phase: phase };
  },
  /* 実際に描かれた画素を読む（スクリーンショットが撮れない環境の代替） */
  pixels: function(){
    renderer.render(scene, camera);
    const gl = renderer.getContext();
    const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
    const buf = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    let sum = 0, nonBlack = 0, warm = 0, maxL = 0;
    const n = w * h;
    for (let i = 0; i < n; i++){
      const r = buf[i*4], g2 = buf[i*4+1], b = buf[i*4+2];
      const l = (r + g2 + b) / 3;
      sum += l;
      if (l > 12) nonBlack++;
      if (r > 90 && r > b + 26) warm++;
      if (l > maxL) maxL = l;
    }
    return {
      size: w + 'x' + h,
      meanLuma: +(sum / n).toFixed(2),
      maxLuma: maxL,
      nonBlackPct: +(nonBlack / n * 100).toFixed(1),
      warmPct: +(warm / n * 100).toFixed(1)
    };
  },
  info: function(){
    let meshes = 0;
    scene.traverse(o => { if (o.isMesh || o.isPoints) meshes++; });
    return {
      houses: houseGroups.length,

      spot: TOUR[idx].name,
      meshes: meshes,
      drawCalls: renderer.info.render.calls,
      triangles: renderer.info.render.triangles,
      camera: camera.position.toArray().map(v => +v.toFixed(2)),
      target: curTgt.toArray().map(v => +v.toFixed(2)),
      idx: idx, phase: phase, auto: auto,

    };

  /* 停留中の対象が本当に画面の中に写っているか（名所の橋・峰・舟・池を投影） */
  aim: function(){
    const v = new THREE.Vector3();
    const proj = o => {
      if (o.isVector3) v.copy(o); else o.getWorldPosition(v);

      v.project(camera);
      return {
        ndc: [+v.x.toFixed(3), +v.y.toFixed(3)],

        onScreen: Math.abs(v.x) <= 1 && Math.abs(v.y) <= 1 && v.z < 1,

    return {
      idx: idx, name: TOUR[idx].name,
      bridge : proj(new THREE.Vector3(0, deckY(0.5), (BRIDGE_Z0 + BRIDGE_Z1) / 2)),
      peak   : proj(new THREE.Vector3(MTS[0].cx, MTS[0].r * MTS[0].sy, MTS[0].cz + MTS[0].r * MTS[0].sz * 0.5)),
      kagari : proj(boats[0].position),

    };

  centerHit: function(){
    const r = new THREE.Raycaster();

      osawa: osawa.group.visible,
      // 観月台に立っているか（床は地面より 0.45m 高い）
      onKangetsudai: camera.position.z <= 29.2 && camera.position.z >= 26.9 &&
                     camera.position.x >= -4.6 && camera.position.x <= -1.2,
      osawaZure: (function(){
        const t2 = osawa.tsukiMichi;
        const dx2 = -Math.sin(t2.rotation.z), dz2 = -Math.cos(t2.rotation.z);
        const ax = 42 - t2.position.x, az = -152 - t2.position.z;
        const al = Math.hypot(ax, az);
        const d2 = Math.max(-1, Math.min(1, dx2 * (ax / al) + dz2 * (az / al)));
        return +(Math.acos(d2) * 180 / Math.PI).toFixed(2);
      })(),
      zure: +(Math.acos(dot) * 180 / Math.PI).toFixed(2),
      // いまの視界に月が入っているか（汀に立って南を向いたときの確かめ）
      moonNdc: [+eye.x.toFixed(3), +eye.y.toFixed(3)],
      moonOnScreen: Math.abs(eye.x) <= 1 && Math.abs(eye.y) <= 1 && eye.z < 1,
      pond: { x: -15, z: 16, rx: 8, rz: 7 }
    };
  },
  /* 藪の道の赤入れ口：yabu.height(0.75) で垣の丈を試着、state で現況 */
  yabu: {
    height: yabu.height,
    state: function(){
      return { segs: yabu.segs, kakiH: +(0.62 * yabu.kaki.scale.y).toFixed(2),
               kaki: yabu.kaki.visible, michi: yabu.michi.visible, ko: yabu.ko.visible,
               dobu: waterStripsYabu.map(m => m.visible), take: chikurin.N };
    }
  },
  /* ㊿ 祈りと参りの検証口。
     set(0)=宵／set(1)=暁／set(0.5)=途中 ―― 転換をとばして即その景色に。
     inoru() はいまの場所で手を合わせる（ボタンを押すのと同じ）。
     移ろいは実時間 8 秒なので、rAF が止まる環境では step(480) で手送りする */
  toki: {
    set: function(v){
      TOKI.k = Math.max(0, Math.min(1, +v || 0));
      TOKI.to = TOKI.k; TOKI.phase = 'idle'; TOKI.t = 0; TOKI.dip = 0;
      tokiSky();
      // 提灯の点光源は毎フレーム決め直される値なので、更新を一周（dt=0）回してから塗る。
      // tokiPaint だけ呼ぶと灯りが消えたまま戻らず、測った絵が本番とずれる
      update(0);
      syncInoriBtn();
      renderer.render(scene, camera);
      return TOKI.k;
    },
    inoru: function(){ return inoru(); },
    tune: TOKI.tune,
    /* 暁の空の階調（上から下へ四段）。書き替えて set() で塗り直せる */
    sora: SKY.AKE,
    where: INORI.map(p => ({ key: p.key, x: p.x, z: p.z, r: p.r, to: p.to })),
    state: function(){
      return {
        k: +TOKI.k.toFixed(3), phase: TOKI.phase,
        near: TOKI.near ? TOKI.near.key : null,
        btn: inoriBtn.style.display !== 'none' ? inoriBtn.textContent : null,
        mats: { lamps: tokiMats.lamps.length, kami: tokiMats.kami.length,
                lands: tokiMats.lands.length },
        fog: +scene.fog.density.toFixed(4),
        amb: +ambLight.intensity.toFixed(3),
        sun: +moonLight.intensity.toFixed(3),
        higashi: +akatsukiFx.akane.material.opacity.toFixed(3)
      };
    }
  },
  /* 宵の音の計測口：state で混合値、level で出力RMS、kane で鐘を即打ち */
  snd: {
    SND: SND,
    state: function(){
      return {
        created: !!AC,
        ctx: AC ? AC.state : null,
        on: SND.on,
        mix: AC ? {
          kawa : +sndNodes.kawaBus.gain.value.toFixed(4),
          mushi: +sndNodes.mushiBus.gain.value.toFixed(4),
          sasa : +sndNodes.sasaG.gain.value.toFixed(4),
          higu : +sndNodes.higuBus.gain.value.toFixed(4),
          furin: +sndNodes.furinBus.gain.value.toFixed(4),
          kawazu: +sndNodes.kawazuBus.gain.value.toFixed(4),
          kane : +sndNodes.kaneBus.gain.value.toFixed(4),
          kaneLp: Math.round(sndNodes.kaneLp.frequency.value)
        } : null
      };
    },
    level: sndLevel,
    kane: function(){ return strikeKane(); },
    furin: function(){ return sndNodes.strikeFurin ? sndNodes.strikeFurin() : false; },
    shishi: function(){ return strikeShishi(); }
  }
};

})();
</script>
