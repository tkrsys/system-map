<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>京 町 屋 を 歩 く ― とくり堂 御絵図</title>
<style>
  :root{
    --akari:#FFD78A; --akari-strong:#FFE5A8; --kogane:#E8B95B;
    --shu:#E04A47; --ai-light:#6BA0CC; --moegi:#A8C078;
    --kinari:#E8DFC8; --sumi:#08080F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--sumi);
    color:var(--kinari);
    font-family:"Yu Mincho","游明朝","Hiragino Mincho ProN",serif;
    overflow:hidden;
  }
  #stage{position:fixed; inset:0}
  #stage canvas{display:block; width:100%; height:100%}

  /* ===== 上：御絵図への渡し ===== */
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:10;
    display:flex; justify-content:flex-end;
    padding:18px 22px;
    background:linear-gradient(180deg, rgba(4,8,18,0.82) 0%, rgba(4,8,18,0) 100%);
    pointer-events:none;
  }
  .topbar a{
    pointer-events:auto;
    color:var(--kinari); text-decoration:none;
    font-size:12px; letter-spacing:2px;
    border:1px solid rgba(232,185,91,0.45);
    background:rgba(6,10,22,0.6);
    padding:9px 13px; border-radius:2px;
    white-space:nowrap;
  }
  .topbar a:hover{ color:var(--akari-strong); border-color:var(--akari-strong) }

  /* ===== 題字（縦書きの掛け軸＋落款） ===== */
  .tate{
    position:fixed; top:16px; left:18px; z-index:10;
    display:flex; flex-direction:row-reverse; align-items:flex-start; gap:10px;
    pointer-events:none;
  }
  .tate .t-main, .tate .t-sub, .tate .t-toki{ writing-mode:vertical-rl }
  .tate .t-main{
    font-size:21px; font-weight:600; letter-spacing:10px;
    color:var(--akari-strong);
    text-shadow:0 0 16px rgba(255,215,138,0.5), 0 1px 3px rgba(0,0,0,0.9);
  }
  .tate .t-sub{
    padding-top:30px;
    font-size:12px; letter-spacing:5px;
    color:var(--kogane); opacity:0.9;
    text-shadow:0 1px 3px rgba(0,0,0,0.9);
  }
  .tate .t-toki{
    padding-top:58px;
    font-size:10.5px; letter-spacing:4px;
    color:#9FB8D8; opacity:0.85;
    text-shadow:0 1px 3px rgba(0,0,0,0.9);
  }
  .tate .t-brand{
    align-self:flex-end;
    display:flex; flex-direction:column; align-items:center; gap:5px;
  }
  .tate .stamp{
    width:34px; height:34px;
    display:grid; grid-template-columns:1fr 1fr; place-items:center;
    background:linear-gradient(135deg, #C2402F, #A32E22);
    color:#F7ECD9; font-size:12.5px; font-weight:700; line-height:1;
    border-radius:4px 6px 3px 7px;
    transform:rotate(-2.5deg);
    box-shadow:inset 0 0 0 1.5px rgba(58,12,8,0.35), 0 2px 8px rgba(0,0,0,0.5);
  }
  .tate .stamp i{ font-style:normal }
  .tate .t-en{ font-size:8.5px; letter-spacing:2px; color:var(--kogane); opacity:0.55 }

  /* ===== 迎え言葉（開幕にふわりと出て消える） ===== */
  .okoshi{
    position:fixed; left:50%; top:36%; z-index:12;
    transform:translate(-50%,-50%);
    font-size:26px; letter-spacing:14px; text-indent:14px;
    color:var(--akari-strong);
    text-shadow:0 0 22px rgba(255,215,138,0.65), 0 0 4px rgba(0,0,0,0.8);
    opacity:0; pointer-events:none; white-space:nowrap;
    animation:okoshi 4.6s ease 0.5s forwards;
  }
  @keyframes okoshi{
    0%  { opacity:0; letter-spacing:8px;  text-indent:8px }
    22% { opacity:0.96 }
    64% { opacity:0.9 }
    100%{ opacity:0; letter-spacing:15px; text-indent:15px }
  }

  /* ===== 町屋の札（下・木札仕立て） ===== */
  .fuda{
    position:fixed; left:50%; bottom:92px; z-index:10;
    transform:translateX(-50%) translateY(14px);
    width:min(520px, calc(100vw - 32px));
    padding:18px 22px 20px;
    background:
      repeating-linear-gradient(92deg, rgba(255,214,150,0.03) 0 2px, rgba(0,0,0,0) 2px 7px),
      repeating-linear-gradient(88deg, rgba(0,0,0,0.14) 0 1px, rgba(0,0,0,0) 1px 11px),
      linear-gradient(180deg, rgba(44,32,18,0.94), rgba(24,16,9,0.96));
    border:1px solid rgba(176,136,78,0.5);
    border-top:3px solid var(--kogane);
    border-radius:3px;
    box-shadow:0 0 44px rgba(0,0,0,0.75), 0 0 22px rgba(232,185,91,0.12), inset 0 0 36px rgba(0,0,0,0.45);
    opacity:0; transition:opacity .5s ease, transform .5s ease;
    pointer-events:none;
  }
  /* 木札の鋲（かざり釘） */
  .fuda::before, .fuda::after{
    content:""; position:absolute; top:10px; width:7px; height:7px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #F2DCA2, #7d5d28 72%);
    box-shadow:0 1px 2px rgba(0,0,0,0.7);
  }
  .fuda::before{ left:10px }
  .fuda::after{ right:10px }
  .fuda.on{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto }
  .fuda.kaigo { border-top-color:var(--shu) }
  .fuda.hou   { border-top-color:var(--ai-light) }
  .fuda.kouken{ border-top-color:var(--moegi) }
  .fuda.view  { border-top-color:#9FB8D8 }

  .fuda .no{
    display:inline-block; width:24px; height:24px; line-height:24px;
    text-align:center; border-radius:50%;
    background:radial-gradient(circle at 30% 30%, var(--akari-strong), var(--kogane) 70%);
    color:#3a2810; font-size:12.5px; font-weight:700;
    margin-right:9px; vertical-align:2px;
  }
  .fuda h2{
    display:inline; font-size:19px; letter-spacing:1px;
    color:var(--akari-strong); font-weight:700;
  }
  .fuda .kind{ margin-top:9px; font-size:11.5px; letter-spacing:2.5px }
  .fuda.kaigo  .kind{ color:#FF9D7A }
  .fuda.hou    .kind{ color:var(--ai-light) }
  .fuda.kouken .kind{ color:var(--moegi) }
  .fuda.view   .kind{ color:#9FB8D8 }
  .fuda .desc{
    margin-top:9px; font-size:13.5px; line-height:1.7;
    color:var(--kinari); opacity:0.9;
  }
  .fuda .tags{ margin-top:10px }
  .fuda .tag{
    display:inline-block; font-size:11px; padding:2px 8px;
    border:1px solid rgba(232,185,91,0.4); color:var(--kogane);
    background:rgba(0,0,0,0.4); margin-right:5px; letter-spacing:1px;
  }
  .fuda .enter{
    display:block; margin-top:15px; text-align:center;
    padding:12px 0; min-height:44px;
    font-size:14.5px; letter-spacing:4px;
    color:#2a1a08; text-decoration:none; font-weight:700;
    background:linear-gradient(180deg, var(--akari-strong), var(--kogane));
    border-radius:2px;
    box-shadow:0 0 22px rgba(255,215,138,0.35);
  }
  .fuda .enter:hover{ filter:brightness(1.1) }
  .fuda .enter:focus-visible{ outline:2px solid #fff; outline-offset:2px }

  /* ===== 操作（最下部） ===== */
  .kaji{
    position:fixed; left:50%; bottom:18px; z-index:11;
    transform:translateX(-50%);
    display:flex; align-items:center; justify-content:center;
    flex-wrap:wrap; row-gap:5px; gap:10px;
    max-width:calc(100vw - 20px);
    padding:8px 12px;
    background:rgba(6,10,22,0.72);
    border:1px solid rgba(232,185,91,0.35);
    border-radius:26px;
  }
  .kaji button{
    font-family:inherit; cursor:pointer;
    background:rgba(20,32,55,0.8);
    border:1px solid rgba(232,185,91,0.4);
    color:var(--kinari);
    min-width:44px; min-height:38px;
    padding:0 14px; border-radius:19px;
    font-size:13px; letter-spacing:1.5px;
    white-space:nowrap;
  }
  .kaji button:hover{ border-color:var(--akari-strong); color:var(--akari-strong) }
  .kaji button:focus-visible{ outline:2px solid var(--akari-strong); outline-offset:2px }
  .kaji .dots{ display:flex; gap:2px; padding:0 4px }
  /* 点は小さく見せるが、押せる面は 28px 確保する */
  .kaji .dot{
    min-width:0; min-height:0;
    width:28px; height:28px; padding:0;
    background:none; border:none; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .kaji .dot::before{
    content:""; display:block;
    width:11px; height:11px; border-radius:50%;
    background:rgba(232,185,91,0.22);
    border:1px solid rgba(232,185,91,0.45);
    transition:transform .2s ease;
  }
  .kaji .dot:hover::before{ border-color:var(--akari-strong); transform:scale(1.25) }
  .kaji .dot.on::before{ transform:scale(1.3) }
  .kaji .dot.kaigo.on::before { background:var(--shu);      box-shadow:0 0 10px var(--shu) }
  .kaji .dot.hou.on::before   { background:var(--ai-light); box-shadow:0 0 10px var(--ai-light) }
  .kaji .dot.kouken.on::before{ background:var(--moegi);    box-shadow:0 0 10px var(--moegi) }
  .kaji .dot.view.on::before  { background:#9FB8D8;         box-shadow:0 0 10px #9FB8D8 }

  .hint{
    position:fixed; left:50%; bottom:66px; z-index:10;
    transform:translateX(-50%);
    font-size:11px; letter-spacing:2px; color:var(--kogane);
    opacity:0.55; white-space:nowrap; pointer-events:none;
  }

  #fallback{
    position:fixed; inset:0; display:none;
    align-items:center; justify-content:center; text-align:center;
    padding:32px; font-size:14px; line-height:2; z-index:20;
  }

  @media (max-width:560px){
    .topbar{ padding:12px 14px }
    .tate{ top:12px; left:12px; gap:7px }
    .tate .t-main{ font-size:15px; letter-spacing:6px }
    .tate .t-sub{ font-size:10.5px; letter-spacing:3px; padding-top:22px }
    .tate .t-toki{ font-size:9.5px; letter-spacing:3px; padding-top:40px }
    .tate .stamp{ width:28px; height:28px; font-size:10.5px }
    .okoshi{ font-size:19px; letter-spacing:9px; text-indent:9px }
    .fuda{ bottom:84px; padding:15px 16px 17px }
    .fuda h2{ font-size:16.5px }
    .fuda .desc{ font-size:13px }
    .kaji{ gap:6px; padding:7px 9px }
    .kaji button{ padding:0 10px; font-size:12px }
    /* 狭い画面では点列を二段目へ回す */
    .kaji .dots{ order:9; width:100%; justify-content:center }
    .hint{ display:none }
  }
  /* 背の低い画面（横持ちの電話など）では題字の列を畳む */
  @media (max-height:480px){
    .tate .t-sub, .tate .t-toki, .tate .t-brand{ display:none }
  }
</style>
</head>
<body>

<div id="stage"></div>

<div class="topbar">
  <a href="./ezu.html">一覧（御絵図）へ</a>
</div>

<!-- 題字は掛け軸ふうの縦書きに。落款（朱印）が屋号を担う -->
<div class="tate">
  <h1 class="t-main">京町屋を歩く</h1>
  <div class="t-sub">七軒の灯をたずねて、渡月橋まで</div>
  <div class="t-toki" id="t-toki"></div>
  <div class="t-brand" aria-hidden="true">
    <span class="stamp"><i>り</i><i>と</i><i>堂</i><i>く</i></span>
    <span class="t-en">tkrsys</span>
  </div>
</div>

<div class="okoshi" id="okoshi" aria-hidden="true">おこしやす</div>

<div class="fuda" id="fuda" aria-live="polite">
  <div><span class="no" id="f-no">壱</span><h2 id="f-name">―</h2></div>
  <div class="kind" id="f-kind">―</div>
  <div class="desc" id="f-desc">―</div>
  <div class="tags" id="f-tags"></div>
  <a class="enter" id="f-enter" href="#" target="_blank" rel="noopener">暖 簾 を く ぐ る</a>
</div>

<div class="hint">← → で通りから渡月橋までめぐる　／　町屋や橋をクリックでも選べます</div>

<div class="kaji">
  <button id="btn-prev" aria-label="前の町屋へ">◀</button>
  <div class="dots" id="dots"></div>
  <button id="btn-next" aria-label="次の町屋へ">▶</button>
  <button id="btn-auto" aria-pressed="true">自動で流す</button>
</div>

<div id="fallback">
  この端末では 3D 表示ができないようです。<br>
  <a href="./ezu.html" style="color:#FFE5A8">御絵図（一覧）へ</a>
</div>

<script>
/* 額縁の小物（3D の可否によらず動かす）：二十四節気の表示と迎え言葉の後片付け */
(function(){
  // 節入りの日は年により1日前後するが、「のころ」表記なので固定日で足りる
  var SEKKI = [
    [1,5,'小寒'],[1,20,'大寒'],[2,4,'立春'],[2,19,'雨水'],[3,5,'啓蟄'],[3,20,'春分'],
    [4,4,'清明'],[4,20,'穀雨'],[5,5,'立夏'],[5,21,'小満'],[6,5,'芒種'],[6,21,'夏至'],
    [7,7,'小暑'],[7,22,'大暑'],[8,7,'立秋'],[8,23,'処暑'],[9,7,'白露'],[9,23,'秋分'],
    [10,8,'寒露'],[10,23,'霜降'],[11,7,'立冬'],[11,22,'小雪'],[12,7,'大雪'],[12,21,'冬至']
  ];
  var TSUKI = ['睦月','如月','弥生','卯月','皐月','水無月','文月','葉月','長月','神無月','霜月','師走'];
  var d = new Date(), m = d.getMonth() + 1, day = d.getDate();
  var name = '冬至';   // 一月上旬はまだ冬至のうち
  for (var i = 0; i < SEKKI.length; i++){
    var s = SEKKI[i];
    if (m > s[0] || (m === s[0] && day >= s[1])) name = s[2];
  }
  document.getElementById('t-toki').textContent = TSUKI[d.getMonth()] + '・' + name + 'のころ';

  var ok = document.getElementById('okoshi');
  ok.addEventListener('animationend', function(){ ok.remove(); });
  // 描画が止まる環境では animationend が飛ばないことがあるので時限でも畳む
  setTimeout(function(){ if (ok.parentNode) ok.remove(); }, 6500);
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

if (typeof THREE === 'undefined') {
  document.getElementById('fallback').style.display = 'flex';
  return;
}

/* ============================================================
   1. 七軒の町屋（通りに並ぶ順＝朱三軒 → 藍三軒 → 萌黄一軒）
   ============================================================ */
const KIND = {
  kaigo : { hex:0xE04A47, soft:0xFF9D7A, label:'介 護 実 務' },
  hou   : { hex:0x6BA0CC, soft:0x8FBEE0, label:'法 律 学 習' },
  kouken: { hex:0xA8C078, soft:0xC2D89A, label:'後 見 制 度' }
};

const HOUSES = [
  { kanji:'壱', name:'居宅サービス計画書システム', kind:'kaigo',
    url:'https://tkrsys-careplan.vercel.app',
    desc:'居宅サービス計画書（第1〜3表）の作成・管理。ケアマネジャー業務の中核',
    tags:['主軸','PIN','Neon'], side:-1, z:-6 },
  { kanji:'弐', name:'ももケアプラン', kind:'kaigo',
    url:'https://tkrsys-momocare.vercel.app',
    desc:'ケアプラン関連の派生システム',
    tags:['派生'], side:1, z:-14 },
  { kanji:'参', name:'ヘルパー活動報告書', kind:'kaigo',
    url:'https://helper-report.vercel.app',
    desc:'訪問支援の記録・PDF出力。福祉事業所向け',
    tags:['PDF'], side:-1, z:-22 },
  { kanji:'肆', name:'行政法 統合ポータル', kind:'hou',
    url:'https://gyoseiho-guide.vercel.app',
    desc:'行政手続法・行政不服審査法・行政事件訴訟法・国家賠償／損失補償 の四法統合',
    tags:['四法統合','e-Gov'], side:1, z:-30 },
  { kanji:'伍', name:'民法ガイド', kind:'hou',
    url:'https://minpo-guide.vercel.app',
    desc:'民法6分野・約200条を三段階解説。行政書士試験対策',
    tags:['200条','三段解説'], side:-1, z:-38 },
  { kanji:'陸', name:'健康保険法ガイド', kind:'hou',
    url:'https://kenkou-hoken-guide.vercel.app',
    desc:'健康保険法 全125条 完全解説。社労士試験対策・実務参照',
    tags:['全125条','e-Gov'], side:1, z:-46 },
  { kanji:'漆', name:'後見月次報告', kind:'kouken',
    url:'https://kouken-monthly-report.vercel.app',
    desc:'月次報告書の作成・管理。家庭裁判所への提出支援',
    tags:['家裁提出','認証要'], side:-1, z:-54 }
];

/* 通りを抜けた先の名所（散策の停留所）。view:true は町屋ではなく景色 */
const SPOTS = [
  { kanji:'捌', view:true, name:'桂川のほとり',
    desc:'町並みが尽き、竹の小径を抜けると、ふいに川端へ出る。月あかりが水面にゆれ、夏の宵は鵜飼の篝火が川面をわたる',
    tags:['竹林の小径','桂川','鵜飼の篝火'],
    pos:[1.7, 1.62, -80.5], tgt:[-3, 1.3, -103] },
  { kanji:'玖', view:true, name:'渡月橋',
    desc:'桂川にかかる木の欄干の橋。「くまなき月の渡るに似る」――月が橋を渡るようだと詠まれて、この名が付いたと伝わる',
    tags:['渡月橋','月の名の橋'],
    pos:[0, 2.88, -105], tgt:[-26, 6, -140] },
  { kanji:'拾', view:true, name:'嵐山',
    desc:'橋を渡りきって山を仰ぐ。中腹に宿の灯がぽつり、ぽつり。山影と川音のなか、来た道の提灯を振り返る',
    tags:['嵐山','宿の灯'],
    pos:[-2.2, 1.62, -124.8], tgt:[-38, 20, -157] }
];
const NH = HOUSES.length;
const TOUR = HOUSES.concat(SPOTS);

/* 川辺の演出の個別開閉（赤入れで気に入らないものだけ false に。__machiya.FX からも切替可） */
const FX = {
  kirameki    : true,   // ① 川面のきらめき（月の道の光点）
  nagare2     : true,   // ② 二層の水流
  kawagiri    : true,   // ③ 川霧
  touronagashi: true,   // ④ 灯篭流し
  mizukagami  : true,   // ⑤ 光の水鏡（篝火・提灯の光が水面に伸びる）
  hinoko      : true,   // ⑥ 篝火の火の粉
  hitokage    : true,   // ⑦ 渡月橋を渡る宵の人影
  kodachi     : true,   // ⑧ 嵐山の稜線の木立
  yadonoto    : true,   // ⑨ 宿の灯のまたたき
  kasumi      : true,   // ⑩ 山霞の流れ
  tsukigasa   : true,   // ⑪ 月暈の呼吸
  nagareboshi : true,   // ⑫ 流れ星
  dolly       : true,   // ⑬ 名所停留の微ドリー
  chikurin    : true,   // ⑭ 竹林の小径（町並みの先、川端まで）
  tsukimore   : true    // ⑮ 竹の間から漏れる月あかり
};

const STREET_X = 5.0;          // 町屋の中心
const HOUSE_W  = 3.6;          // 間口
const HOUSE_D  = 5.0;          // 奥行 → 正面は |x| = 2.5（通り幅 5m の路地）
const FACADE_X = STREET_X - HOUSE_D / 2;

/* ============================================================
   2. 下地（シーン・カメラ・描画器）
   ============================================================ */
const stage    = document.getElementById('stage');
const scene    = new THREE.Scene();
scene.fog      = new THREE.FogExp2(0x0a1424, 0.020);

const camera = new THREE.PerspectiveCamera(56, 1, 0.1, 400);
camera.position.set(1.3, 1.62, -2.5);

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
} catch (e) {
  document.getElementById('fallback').style.display = 'flex';
  return;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x05080f, 1);
stage.appendChild(renderer.domElement);

function resize(){
  const w = stage.clientWidth  || window.innerWidth;
  const h = stage.clientHeight || window.innerHeight;

/* ============================================================
   3. 絵の具（canvas テクスチャ）
   ============================================================ */
function cv(w, h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function tex(canvas, rx, ry){
  const t = new THREE.CanvasTexture(canvas);
  if (rx || ry){
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(rx || 1, ry || 1);
  }
  return t;
}
function hexStr(h){ return '#' + h.toString(16).padStart(6,'0'); }

/* 石畳 */
function stoneTexture(){
  const c = cv(256, 256), g = c.getContext('2d');
  g.fillStyle = '#1a1d26'; g.fillRect(0, 0, 256, 256);
  let seed = 1;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let row = 0; row < 8; row++){
    const off = (row % 2) * 16;
    for (let col = -1; col < 8; col++){
      const x = col * 32 + off + 2, y = row * 32 + 2;
      const v = 26 + Math.floor(rnd() * 22);
      g.fillStyle = 'rgb(' + v + ',' + (v + 3) + ',' + (v + 9) + ')';
      g.fillRect(x, y, 28, 28);
      g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = 1.5;
      g.strokeRect(x, y, 28, 28);
    }
  }
  return tex(c, 10, 34);
}
/* 木（縦目） */
function woodTexture(base){
  const c = cv(64, 256), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, 64, 256);
  for (let i = 0; i < 26; i++){
    g.strokeStyle = 'rgba(0,0,0,' + (0.05 + (i % 4) * 0.035) + ')';
    g.lineWidth = 1 + (i % 3);
    g.beginPath();
    g.moveTo((i * 7) % 64, 0);
    g.lineTo(((i * 7) % 64) + 5, 256);
    g.stroke();
  }
  return tex(c, 1, 1);
}
/* 漆喰 */
function plasterTexture(){
  const c = cv(128, 128), g = c.getContext('2d');
  g.fillStyle = '#4a4638'; g.fillRect(0, 0, 128, 128);
  let seed = 7;
  const rnd = () => (seed = (seed * 48271) % 2147483647) / 2147483647;
  for (let i = 0; i < 900; i++){
    const a = 0.03 + rnd() * 0.06;
    g.fillStyle = rnd() > 0.5 ? 'rgba(255,255,255,' + a + ')' : 'rgba(0,0,0,' + a + ')';
    g.fillRect(rnd() * 128, rnd() * 128, 2, 2);
  }
  return tex(c, 2, 1);
}
/* 屋号看板 */
function signTexture(name, hex){
  const c = cv(1024, 190), g = c.getContext('2d');
  g.fillStyle = '#100d09'; g.fillRect(0, 0, 1024, 190);
  g.strokeStyle = hexStr(hex); g.lineWidth = 7;
  g.strokeRect(11, 11, 1002, 168);
  g.fillStyle = '#F2E4C2';
  g.font = '600 74px "Yu Mincho","游明朝",serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  let size = 74;
  while (g.measureText(name).width > 930 && size > 30){
    size -= 3;
    g.font = '600 ' + size + 'px "Yu Mincho","游明朝",serif';
  }
  g.fillText(name, 512, 99);
  return tex(c);
}
/* 暖簾（三枚のうち中央に屋号印） */
function norenTexture(kanji, hex){
  const c = cv(256, 384), g = c.getContext('2d');
  g.fillStyle = hexStr(hex); g.fillRect(0, 0, 256, 384);
  const grd = g.createLinearGradient(0, 0, 0, 384);
  grd.addColorStop(0, 'rgba(0,0,0,0.45)');
  grd.addColorStop(0.35, 'rgba(0,0,0,0.05)');
  grd.addColorStop(1, 'rgba(0,0,0,0.30)');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 384);
  g.fillStyle = 'rgba(250,240,215,0.93)';
  g.beginPath(); g.arc(128, 150, 58, 0, Math.PI * 2); g.fill();
  g.fillStyle = hexStr(hex);
  g.font = '700 74px "Yu Mincho","游明朝",serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(kanji, 128, 154);
  return tex(c);
}
/* ぼんやり光る円（灯りの照り返し・蛍） */
function glowTexture(){
  const c = cv(128, 128), g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0,    'rgba(255,225,170,1)');
  grd.addColorStop(0.28, 'rgba(255,205,130,0.55)');
  grd.addColorStop(1,    'rgba(255,190,110,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  return tex(c);
}
/* 側溝の水面 */
function waterTexture(){
  const c = cv(64, 256), g = c.getContext('2d');
  g.fillStyle = '#0b1626'; g.fillRect(0, 0, 64, 256);
  for (let i = 0; i < 40; i++){
    g.strokeStyle = 'rgba(150,190,230,' + (0.05 + (i % 5) * 0.03) + ')';
    g.lineWidth = 1;
    const y = (i * 6.4) % 256;
    g.beginPath();
    g.moveTo(0, y);
    g.bezierCurveTo(20, y + 3, 44, y - 3, 64, y + 1);
    g.stroke();
  }
  return tex(c, 1, 12);
}
/* 竹の稈（月あかりの緑・節入り。縦 512 が一本ぶんに伸びる） */
function takeTexture(){
  const c = cv(64, 512), g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 64, 0);
  grd.addColorStop(0,    '#22342a');
  grd.addColorStop(0.35, '#4c7050');
  grd.addColorStop(0.55, '#6a9264');
  grd.addColorStop(0.8,  '#3a5640');
  grd.addColorStop(1,    '#1e2e26');
  g.fillStyle = grd; g.fillRect(0, 0, 64, 512);
  // 節（稈の高さ 7〜10m に対しおよそ 1m 間隔になる）
  for (let y = 26; y < 512; y += 62){
    g.fillStyle = 'rgba(16,26,20,0.85)';
    g.fillRect(0, y, 64, 3.5);
    g.fillStyle = 'rgba(205,228,196,0.30)';
    g.fillRect(0, y - 2, 64, 2);
  }
  // 縦の繊維
  for (let i = 0; i < 14; i++){
    g.strokeStyle = 'rgba(0,0,0,' + (0.05 + (i % 3) * 0.04) + ')';
    g.lineWidth = 1;
    g.beginPath(); g.moveTo((i * 9) % 64, 0); g.lineTo((i * 9) % 64, 512); g.stroke();
  }
  return tex(c);
}
/* 笹の葉むら（透過。中央に濃く、外縁は疎らに散らす） */
function sasaTexture(seed){
  const c = cv(256, 256), g = c.getContext('2d');
  g.clearRect(0, 0, 256, 256);
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 260; i++){
    const a = rnd() * Math.PI * 2, r = Math.pow(rnd(), 0.6) * 118;
    const x = 128 + Math.cos(a) * r, y = 128 + Math.sin(a) * r * 0.8;
    const len = 9 + rnd() * 15, wdt = 2 + rnd() * 2.6;
    const v = 28 + Math.floor(rnd() * 34);
    g.save();
    g.translate(x, y); g.rotate(rnd() * Math.PI);
    g.fillStyle = 'rgba(' + Math.floor(v * 0.72) + ',' + v + ',' + Math.floor(v * 0.8) + ',' + (0.55 + rnd() * 0.4) + ')';
    g.beginPath(); g.ellipse(0, 0, len, wdt, 0, 0, Math.PI * 2); g.fill();
    g.restore();
  }
  return tex(c);
}
/* 冷たい光の円（月漏れの光条と地面の斑用。glow の月光版） */
function glowCoolTexture(){
  const c = cv(128, 128), g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0,   'rgba(220,235,255,1)');
  grd.addColorStop(0.3, 'rgba(185,210,245,0.5)');
  grd.addColorStop(1,   'rgba(160,190,235,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  return tex(c);
}
/* 嵐山の木立（稜線をぎざぎざに縁取る。fill と seed を変えて二層つくる） */
function treelineTexture(fill, seed){
  const c = cv(1024, 256), g = c.getContext('2d');
  g.clearRect(0, 0, 1024, 256);
  g.fillStyle = fill;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  let base = 150;
  for (let x = 0; x <= 1024; x += 7){
    base += (rnd() - 0.5) * 26;
    base = Math.min(190, Math.max(84, base));
    const r = 10 + rnd() * 16;
    g.beginPath(); g.arc(x, base, r, 0, Math.PI * 2); g.fill();
    g.fillRect(x - 5, base, 10, 256 - base);
    if (rnd() > 0.72){
      g.beginPath(); g.arc(x + 2, base - r * 0.85, r * 0.5, 0, Math.PI * 2); g.fill();
    }
  }
  return tex(c);
}
/* 遠景：東山と五重塔のシルエット */
function ridgeTexture(){
  const c = cv(2048, 360), g = c.getContext('2d');
  g.clearRect(0, 0, 2048, 360);
  g.fillStyle = '#070a13';
  g.beginPath(); g.moveTo(0, 360);
  const pts = [[0,250],[150,190],[320,235],[520,150],[760,215],[980,130],[1200,205],[1420,160],[1650,225],[1860,175],[2048,230]];
  pts.forEach(p => g.lineTo(p[0], p[1]));
  g.lineTo(2048, 360); g.closePath(); g.fill();
  // 五重塔
  g.fillStyle = '#05070e';
  const bx = 1330, by = 205;
  for (let i = 0; i < 5; i++){
    const w = 96 - i * 13, h = 26, y = by - i * 30;
    g.beginPath();
    g.moveTo(bx - w / 2 - 12, y); g.lineTo(bx + w / 2 + 12, y);
    g.lineTo(bx + w / 2 - 6, y - 14); g.lineTo(bx - w / 2 + 6, y - 14);
    g.closePath(); g.fill();
    g.fillRect(bx - (w - 18) / 2, y - h - 4, w - 18, h);
  }
  g.fillRect(bx - 2.5, by - 200, 5, 52);
  return tex(c);
}
/* 空（上は墨、下は町明かりの残照） */
function skyTexture(){
  const c = cv(8, 512), g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 512);
  grd.addColorStop(0,    '#04060e');
  grd.addColorStop(0.42, '#0a1226');
  grd.addColorStop(0.76, '#132039');
  grd.addColorStop(1,    '#25324b');
  g.fillStyle = grd; g.fillRect(0, 0, 8, 512);
  return tex(c);
}

/**
 * 町屋一軒。正面は必ず +Z を向いて建て、最後に group ごと回して通りに向ける。
 * 京町屋の要素：起り屋根・一文字瓦・厨子二階・虫籠窓・出格子・格子戸・暖簾・犬矢来・提灯
 */
function buildMachiya(opt){
  const g = new THREE.Group();
  const W = opt.width || HOUSE_W;
  const D = HOUSE_D;
  const H1 = 2.40;                 // 一階
  const H2 = opt.simple ? 1.15 : 1.50;   // 厨子二階（低い）
  const HT = H1 + H2;
  const F  = D / 2;                // 正面の z
  const accent = opt.hex || 0x8a6a3a;

  // 躯体
  const body = new THREE.Mesh(new THREE.BoxGeometry(W, HT, D), MAT.wall);
  body.position.set(0, HT / 2, 0);
  g.add(body);

  // 二階は漆喰塗り込め
  const plast = new THREE.Mesh(new THREE.BoxGeometry(W + 0.04, H2, 0.09), MAT.plaster);
  plast.position.set(0, H1 + H2 / 2, F + 0.02);
  g.add(plast);

  // ── 屋根（平入・起り）──
  const eave = 0.55, rise = 0.85;
  const run  = F + eave;
  const slope = Math.sqrt(run * run + rise * rise);
  const ang  = Math.atan2(rise, run);
  [1, -1].forEach(dir => {
    const p = new THREE.Mesh(new THREE.BoxGeometry(W + 0.85, 0.13, slope), MAT.roof);
    p.rotation.x = dir * ang;
    p.position.set(0, HT + rise / 2, dir * run / 2);
    g.add(p);
  });
  // 棟
  const mune = new THREE.Mesh(new THREE.BoxGeometry(W + 0.95, 0.17, 0.34), MAT.roofEdge);
  mune.position.set(0, HT + rise + 0.04, 0);
  g.add(mune);
  // 一文字瓦（軒先）
  const nokishita = new THREE.Mesh(new THREE.BoxGeometry(W + 0.85, 0.11, 0.1), MAT.roofEdge);
  nokishita.position.set(0, HT + 0.02, run);
  g.add(nokishita);

  // ── 二階：虫籠窓 ──
  [-0.82, 0.82].forEach(mx => {
    const hole = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.5, 0.06), MAT.dark);
    hole.position.set(mx, H1 + 0.72, F + 0.07);
    g.add(hole);
    const lit = new THREE.Mesh(new THREE.PlaneGeometry(0.66, 0.44),
      new THREE.MeshBasicMaterial({ color:0xd89a4e, transparent:true, opacity:0.5 }));
    lit.position.set(mx, H1 + 0.72, F + 0.05);
    g.add(lit);
    for (let i = -1; i <= 1; i++){
      const b = new THREE.Mesh(GEO.mushiBar, MAT.plaster);
      b.position.set(mx + i * 0.22, H1 + 0.72, F + 0.10);
      g.add(b);
    }
  });

  // ── 一階の庇 ──
  const hisashi = new THREE.Mesh(new THREE.BoxGeometry(W + 0.3, 0.09, 0.62), MAT.roofEdge);
  hisashi.rotation.x = 0.13;
  hisashi.position.set(0, H1 - 0.06, F + 0.27);
  g.add(hisashi);

  // ── 屋号看板（庇と二階のあいだ）──
  let signMesh = null;
  if (!opt.simple){
    signMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(W - 0.7, 0.44),
      new THREE.MeshBasicMaterial({ map:signTexture(opt.name, accent), transparent:true })
    );
    signMesh.position.set(0, H1 + 0.19, F + 0.075);
    g.add(signMesh);
  }

  // ── 一階左：出格子 ──
  const bayW = W * 0.52, bayX = -W * 0.21;
  const bayBack = new THREE.Mesh(new THREE.BoxGeometry(bayW, 1.24, 0.05), MAT.inner);
  bayBack.position.set(bayX, 1.44, F + 0.06);
  g.add(bayBack);
  const bayFrame = new THREE.Mesh(new THREE.BoxGeometry(bayW + 0.14, 1.4, 0.3), MAT.wallDk);
  bayFrame.position.set(bayX, 1.44, F + 0.15);
  bayFrame.scale.set(1, 1, 1);
  g.add(bayFrame);
  const bayHole = new THREE.Mesh(new THREE.BoxGeometry(bayW, 1.2, 0.04), MAT.inner);
  bayHole.position.set(bayX, 1.44, F + 0.305);
  g.add(bayHole);
  const nBars = Math.max(8, Math.round(bayW / 0.15));
  for (let i = 0; i < nBars; i++){
    const b = new THREE.Mesh(GEO.bar, MAT.bar);
    b.scale.y = 1.2;
    b.position.set(bayX - bayW / 2 + (i + 0.5) * (bayW / nBars), 1.44, F + 0.325);
    g.add(b);
  }

  // ── 一階右：格子戸と暖簾 ──
  const doorW = W * 0.30, doorX = W * 0.29;
  const door = new THREE.Mesh(new THREE.BoxGeometry(doorW, 2.0, 0.05), MAT.inner);
  door.position.set(doorX, 1.0, F + 0.03);
  g.add(door);
  const dBars = Math.max(5, Math.round(doorW / 0.16));
  for (let i = 0; i < dBars; i++){
    const b = new THREE.Mesh(GEO.bar, MAT.bar);
    b.scale.y = 2.0;
    b.position.set(doorX - doorW / 2 + (i + 0.5) * (doorW / dBars), 1.0, F + 0.06);
    g.add(b);
  }

  const norenGroup = new THREE.Group();       // 上端で吊る
  norenGroup.position.set(doorX, 2.02, F + 0.13);

    new THREE.PlaneGeometry(3.4, 3.4),
    new THREE.MeshBasicMaterial({ map:TEX.glow, transparent:true, opacity:0.20,
                                  blending:THREE.AdditiveBlending, depthWrite:false })
  );
  pool.rotation.x = -Math.PI / 2;
  pool.position.set(0, 0.02, F + 1.0);
  g.add(pool);

  // 通りへ向ける（左側は +X、右側は -X を向く）
  g.position.set(opt.x, 0, opt.z);
  g.rotation.y = opt.side < 0 ? Math.PI / 2 : -Math.PI / 2;

/* 渡月橋（木の桁と欄干。中央がわずかに高い） */
const bridgeGroup = (function(){
  const g = new THREE.Group();
  const SEG = 7, segL = BRIDGE_L / SEG, W = 3.6;
  for (let i = 0; i < SEG; i++){
    const t0 = i / SEG, t1 = (i + 1) / SEG;
    const zc = BRIDGE_Z0 - (t0 + t1) / 2 * BRIDGE_L;
    const y0 = deckY(t0), y1 = deckY(t1);
    const ang = Math.atan2(y1 - y0, segL);
    // 桁（上面が路面）
    const deck = new THREE.Mesh(new THREE.BoxGeometry(W, 0.16, segL + 0.12), MAT.wall);
    deck.rotation.x = ang;
    deck.position.set(0, (y0 + y1) / 2, zc);
    g.add(deck);
    // 手すり（上段・中段）
    [[0.78, 0.09], [0.45, 0.06]].forEach(r => {
      [-1, 1].forEach(s => {
        const rail = new THREE.Mesh(new THREE.BoxGeometry(r[1], r[1], segL + 0.14), MAT.wallDk);
        rail.rotation.x = ang;
        rail.position.set(s * (W / 2 - 0.08), (y0 + y1) / 2 + 0.08 + r[0], zc);
        g.add(rail);
      });
    });
  }
  // 欄干の束柱
  const N_POST = 21;
  for (let i = 0; i <= N_POST; i++){
    const t = i / N_POST;
    const y = deckY(t) + 0.08;
    [-1, 1].forEach(s => {
      const p = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.78, 0.09), MAT.wallDk);
      p.position.set(s * (W / 2 - 0.08), y + 0.39, BRIDGE_Z0 - t * BRIDGE_L);
      g.add(p);
    });
  }
  // 親柱（四隅・宝珠付き）
  [[BRIDGE_Z0 - 0.1, 0], [BRIDGE_Z1 + 0.1, 1]].forEach(e => {
    [-1, 1].forEach(s => {
      const y = deckY(e[1]) + 0.08;
      const p = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.0, 0.2), MAT.wall);
      p.position.set(s * (W / 2 - 0.06), y + 0.5, e[0]);
      g.add(p);
      const orb = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 7), MAT.wallDk);
      orb.position.set(s * (W / 2 - 0.06), y + 1.06, e[0]);
      g.add(orb);
    });
  });
  // 橋脚（三組）
  [0.25, 0.5, 0.75].forEach(t => {
    const z = BRIDGE_Z0 - t * BRIDGE_L;
    const top = deckY(t) - 0.05;
    [-1, 1].forEach(s => {
      const h = top + 0.85;
      const p = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, h, 7), MAT.wallDk);
      p.position.set(s * 1.3, (top - 0.85) / 2, z);
      g.add(p);
    });
    const beam = new THREE.Mesh(new THREE.BoxGeometry(3.1, 0.09, 0.09), MAT.wallDk);
    beam.position.set(0, 0.12, z);
    g.add(beam);
  });
  scene.add(g);
  return g;
})();

const chikurin = (function(){
  const group     = new THREE.Group();   // 稈と葉むら
  const moonGroup = new THREE.Group();   // 月漏れ（光条と地面の斑）
  let seed = 20260727;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const Z0 = -56.5, Z1 = -77.5;

  // 稈は一描画にまとめる（インスタンス描画）。位置が散るので境界球カリングは切る
  const N = 128;
  const geo = new THREE.CylinderGeometry(0.055, 0.066, 1, 6);
  geo.translate(0, 0.5, 0);   // 根元を原点に置き、高さは行列の scale で決める
  const stalks = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ map: TEX.take }), N);
  stalks.frustumCulled = false;
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), eu = new THREE.Euler(),
        v3 = new THREE.Vector3(), sc = new THREE.Vector3(), col = new THREE.Color();
  for (let i = 0; i < N; i++){
    const side = i % 2 === 0 ? -1 : 1;
    const x = side * (2.7 + Math.pow(rnd(), 1.4) * 3.6);   // 小径の際に濃く、外へ疎らに
    const z = Z0 + rnd() * (Z1 - Z0);
    const h = 6.8 + rnd() * 3.0;
    const r = 0.8 + rnd() * 0.5;
    eu.set((rnd() - 0.5) * 0.06, rnd() * Math.PI, -side * (0.015 + rnd() * 0.045)); // 先端はやや小径の上へ
    q.setFromEuler(eu);
    m4.compose(v3.set(x, 0, z), q, sc.set(r, h, r));
    stalks.setMatrixAt(i, m4);
    if (stalks.setColorAt) stalks.setColorAt(i, col.setHSL(0.30 + rnd() * 0.05, 0.24, 0.42 + rnd() * 0.22));
  }
  stalks.instanceMatrix.needsUpdate = true;
  if (stalks.instanceColor) stalks.instanceColor.needsUpdate = true;
  group.add(stalks);

  // 葉むら：11枚は頭上の天井、5枚は脇の中段の茂み
  const sasaMat = new THREE.MeshBasicMaterial({
    map: TEX.sasa, transparent: true, opacity: 0.92,
    depthWrite: false, side: THREE.DoubleSide
  });
  const canopy = [];
  for (let i = 0; i < 16; i++){
    const p = new THREE.Mesh(new THREE.PlaneGeometry(8.5, 5.5), sasaMat);
    if (i < 11){
      p.position.set((rnd() - 0.5) * 6.5, 6.4 + rnd() * 2.2, Z0 + (i / 10) * (Z1 - Z0));
      p.rotation.set(-Math.PI / 2 + (rnd() - 0.5) * 0.5, 0, rnd() * Math.PI);
    } else {
      const side = i % 2 === 0 ? -1 : 1;
      p.position.set(side * (3.4 + rnd() * 1.6), 3.4 + rnd() * 2.2, Z0 + rnd() * (Z1 - Z0));
      p.rotation.set((rnd() - 0.5) * 0.4, rnd() * Math.PI, (rnd() - 0.5) * 0.4);
      p.scale.setScalar(0.62);
    }
    p.userData = { baseZ: p.rotation.z, baseX: p.position.x, ph: rnd() * Math.PI * 2 };
    canopy.push(p); group.add(p);
  }

  // 月漏れの光条：月光の向きに軸を合わせ、自身の軸まわりだけばらす
  const moonDir = new THREE.Vector3(-8, 16, 6).normalize();
  const shafts = [];
  for (let i = 0; i < 7; i++){
    const mat = new THREE.MeshBasicMaterial({
      map: TEX.glowCool, transparent: true, opacity: 0.06,
      blending: THREE.AdditiveBlending, depthWrite: false, fog: false, side: THREE.DoubleSide
    });
    const s = new THREE.Mesh(new THREE.PlaneGeometry(0.85, 7.6), mat);
    s.position.set((rnd() - 0.5) * 4.4, 3.6, Z0 + ((i + 0.5) / 7) * (Z1 - Z0) + (rnd() - 0.5) * 1.6);
    s.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), moonDir);
    s.rotateY(rnd() * Math.PI);
    s.userData = { baseO: 0.05 + rnd() * 0.05, ph: rnd() * Math.PI * 2 };
    shafts.push(s); moonGroup.add(s);
  }
  // 地面の木漏れ月の斑
  const dapples = [];
  for (let i = 0; i < 9; i++){
    const mat = new THREE.MeshBasicMaterial({
      map: TEX.glowCool, transparent: true, opacity: 0.07,
      blending: THREE.AdditiveBlending, depthWrite: false, fog: false
    });
    const d = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 1.1), mat);
    d.rotation.x = -Math.PI / 2;
    d.rotation.z = rnd() * Math.PI;
    d.position.set((rnd() - 0.5) * 3.6, 0.02, Z0 + rnd() * (Z1 - Z0));
    d.userData = { baseO: 0.05 + rnd() * 0.05, ph: rnd() * Math.PI * 2 };
    dapples.push(d); moonGroup.add(d);
  }

  scene.add(group, moonGroup);
  return { group: group, moonGroup: moonGroup, canopy: canopy, shafts: shafts, dapples: dapples, N: N };
})();

function makeFireflies(N, xSpread, zNear, zFar, seed){
  const pos = new Float32Array(N * 3);
  const phase = new Float32Array(N);
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < N; i++){
    pos[i*3]   = (rnd() - 0.5) * xSpread;
    pos[i*3+1] = rnd() * 3.4 + 0.25;
    pos[i*3+2] = zNear + rnd() * (zFar - zNear);
    phase[i]   = rnd() * Math.PI * 2;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    map:TEX.glow, color:0xffd591, size:0.3, sizeAttenuation:true,
    transparent:true, opacity:0.85, depthWrite:false, blending:THREE.AdditiveBlending
  });
  const p = new THREE.Points(geo, mat);
  p.userData = { phase: phase, base: pos.slice() };
  scene.add(p);
  return p;
}

/* ============================================================
   8. カメラの流れ（自動＋停留）
   ============================================================ */
const TRAVEL_S = 2.9;
const DWELL_S  = 6.2;

const stops = TOUR.map(h => h.view
  ? { pos: new THREE.Vector3(h.pos[0], h.pos[1], h.pos[2]),
      tgt: new THREE.Vector3(h.tgt[0], h.tgt[1], h.tgt[2]) }
  : { pos: new THREE.Vector3(-h.side * 1.35, 1.62, h.z + 3.2),
      tgt: new THREE.Vector3(h.side * FACADE_X * 0.82, 1.88, h.z - 0.15) });

let idx     = 0;
let phase   = 'travel';
let t       = 0;
let dwellT  = 0;
let auto    = true;
let fromPos = camera.position.clone();
let fromTgt = new THREE.Vector3(stops[0].tgt.x, stops[0].tgt.y, stops[0].tgt.z + 6);
const curTgt = fromTgt.clone();
const ctrl   = new THREE.Vector3();
const dollyDir = new THREE.Vector3();

const smooth = x => x * x * (3 - 2 * x);

function goTo(i, byUser){
  const n = TOUR.length;
  idx = ((i % n) + n) % n;
  fromPos.copy(camera.position);
  fromTgt.copy(curTgt);
  t = 0; dwellT = 0; phase = 'travel';
  hideFuda();
  paintDots();
  if (byUser) auto = false, syncAutoBtn();
}

function updateCamera(dt){
  const s = stops[idx];
  if (phase === 'travel'){
    t = Math.min(1, t + dt / TRAVEL_S);
    const e = smooth(t);
    // 通りの真ん中をふくらんで進む（ベジェ）。嵐山から通りへの長い戻りは屋根の上を飛んで帰る
    const span = Math.abs(fromPos.z - s.pos.z);
    ctrl.set(0, span > 60 ? 12 : 1.6, (fromPos.z + s.pos.z) / 2);
    const u = 1 - e;
    camera.position.set(
      u*u*fromPos.x + 2*u*e*ctrl.x + e*e*s.pos.x,
      u*u*fromPos.y + 2*u*e*ctrl.y + e*e*s.pos.y,
      u*u*fromPos.z + 2*u*e*ctrl.z + e*e*s.pos.z
    );
    curTgt.lerpVectors(fromTgt, s.tgt, e);
    if (t >= 1){ phase = 'dwell'; dwellT = 0; showFuda(); }
  } else {
    dwellT += dt;
    camera.position.x = s.pos.x + Math.sin(dwellT * 0.62) * 0.07;
    camera.position.y = s.pos.y + Math.sin(dwellT * 0.85) * 0.035;
    camera.position.z = s.pos.z;
    if (FX.dolly && TOUR[idx].view){
      // ⑬ 名所では息を合わせるようにゆっくり前へ寄る
      const d = smooth(Math.min(1, dwellT / DWELL_S)) * 0.6;
      dollyDir.subVectors(s.tgt, s.pos).normalize();
      camera.position.x += dollyDir.x * d;
      camera.position.y += dollyDir.y * d;
      camera.position.z += dollyDir.z * d;
    }
    curTgt.copy(s.tgt);
    if (auto && dwellT > DWELL_S) goTo(idx + 1, false);
  }
  camera.lookAt(curTgt);
}

const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const clickRoots = houseGroups.concat([river, bridgeGroup, mtGroup]);
renderer.domElement.addEventListener('pointerdown', ev => {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.x =  ((ev.clientX - r.left) / r.width)  * 2 - 1;
  ndc.y = -((ev.clientY - r.top)  / r.height) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(clickRoots, true)[0];
  if (!hit) return;
  let o = hit.object, target = -1;
  while (o){
    const hi = houseGroups.indexOf(o);
    if (hi >= 0)           { target = hi;     break; }
    if (o === river)       { target = NH;     break; }
    if (o === bridgeGroup) { target = NH + 1; break; }
    if (o === mtGroup)     { target = NH + 2; break; }
    o = o.parent;
  }
  if (target >= 0 && target !== idx) goTo(target, true);
});

/* ============================================================
   10. 毎フレーム
   ============================================================ */
const clock = new THREE.Clock();
let elapsed = 0;

function update(dt){
  elapsed += dt;
  updateCamera(dt);

  // 提灯：ゆらぐ灯り。停留中の一軒だけ明るく
  houseGroups.forEach((g, i) => {
    const u = g.userData;
    const flick = 0.82 + Math.sin(elapsed * 3.1 + i * 1.7) * 0.09
                       + Math.sin(elapsed * 7.9 + i * 3.3) * 0.05;
    const focus = (i === idx && phase === 'dwell') ? 1.45 : 1.0;
    u.halo.material.opacity = 0.5 * flick * focus;
    u.pool.material.opacity = 0.20 * flick * focus;
    u.lantern.scale.set(1, 1.28 + Math.sin(elapsed * 2.2 + i) * 0.015, 1);
    // 暖簾が風に揺れる
    u.noren.forEach((p, k) => {
      p.rotation.x = Math.sin(elapsed * 1.25 + k * 0.9 + i) * 0.11;
    });
  });

  // 灯りは近い三軒へ移す
  const order = houseGroups
    .map((g, i) => ({ i: i, d: g.userData.lanternWorld.distanceTo(camera.position) }))
    .sort((a, b) => a.d - b.d);
  roamLights.forEach((L, k) => {
    const o = order[k];
    if (!o){ L.intensity = 0; return; }
    const w = houseGroups[o.i].userData.lanternWorld;
    L.position.copy(w);
    const flick = 0.85 + Math.sin(elapsed * 3.4 + o.i * 2.1) * 0.12;
    L.intensity = (o.i === idx ? 1.55 : 1.05) * flick;
  });

  // 蛍がふわふわ漂う（通り・川辺の二群）
  [fireflies, kawaFlies].forEach(f => {
    const p = f.geometry.attributes.position;
    const ph = f.userData.phase, base = f.userData.base;
    for (let i = 0; i < ph.length; i++){
      p.array[i*3]   = base[i*3]   + Math.sin(elapsed * 0.55 + ph[i]) * 0.55;
      p.array[i*3+1] = base[i*3+1] + Math.sin(elapsed * 0.42 + ph[i] * 1.7) * 0.32;
      p.array[i*3+2] = base[i*3+2] + Math.cos(elapsed * 0.38 + ph[i]) * 0.5;
    }
    p.needsUpdate = true;
  });

  // 側溝の水が流れる
  waterStrips.forEach(m => { m.material.map.offset.y = (elapsed * 0.045) % 1; });

  // 桂川：水がゆっくり下流へ、月の道がゆらぐ
  river.material.map.offset.x = (elapsed * 0.006) % 1;
  moonPath.material.opacity = 0.14 + Math.sin(elapsed * 0.5) * 0.04;
  moonPath.scale.x = 1 + Math.sin(elapsed * 0.8) * 0.07;

  // 川舟：ゆったり上下、篝火と提灯のまたたき（またたき量は水鏡と共有）
  boats.forEach((b, k) => {
    b.position.y = -0.07 + Math.sin(elapsed * 0.8 + b.userData.phase) * 0.03;
    b.rotation.z = Math.sin(elapsed * 0.66 + b.userData.phase) * 0.022;
    b.position.x = b.userData.baseX + Math.sin(elapsed * 0.05 + k * 2) * 1.6;
    const flick = 0.8 + Math.sin(elapsed * 9 + k * 5) * 0.16 + Math.sin(elapsed * 23) * 0.06;
    b.userData.flick = flick;
    b.userData.flame.material.opacity = (k === 0 ? 0.62 : 0.4) * flick;
  });

  // 石灯篭のまたたき
  touros.forEach((t2, k) => {
    t2.halo.material.opacity = 0.30 + Math.sin(elapsed * 3.7 + k * 1.9) * 0.07;
  });

  /* ―― 川辺の演出十三点（生き死には毎フレーム FX を見る＝赤入れ中に切替できる） ―― */
  // ① 川面のきらめき：三群が位相をずらして明滅
  glintClouds.forEach(p => {
    p.visible = FX.kirameki;
    const tw = Math.sin(elapsed * 1.9 + p.userData.ph);
    p.material.opacity = Math.max(0, tw) * 0.55;
    p.material.size = 0.18 + Math.max(0, tw) * 0.10;
  });
  // ② 二層目の水流は少し速く、わずかに斜めへ
  if (river2){
    river2.visible = FX.nagare2;
    river2.material.map.offset.x = (elapsed * 0.013) % 1;
    river2.material.map.offset.y = (elapsed * 0.0022) % 1;
  }
  // ③ 川霧が水面を這って流れる
  kawagiris.forEach(s => {
    s.visible = FX.kawagiri;
    const u = s.userData;
    s.position.x = u.baseX + Math.sin(elapsed * 0.05 + u.ph) * 7;
    s.material.opacity = u.baseO * (0.75 + Math.sin(elapsed * 0.18 + u.ph * 2) * 0.25);
  });
  // ④ 灯篭流し：西から東へ川面をわたる。灯の照りは Points でまとめて一描画
  if (nagashiGlow){
    nagashiGlow.visible = FX.touronagashi;
    const gp = nagashiGlow.geometry.attributes.position;
    nagashiTouro.forEach((g, i) => {
      g.visible = FX.touronagashi;
      const u = g.userData;
      const x = -58 + ((u.off + elapsed * u.v) % 116);
      g.position.set(x, -0.16 + Math.sin(elapsed * 1.1 + u.ph) * 0.02, u.z);
      g.rotation.y = elapsed * 0.12 + u.ph;
      gp.array[i*3] = x; gp.array[i*3+1] = g.position.y + 0.12; gp.array[i*3+2] = u.z;
    });
    gp.needsUpdate = true;
    nagashiGlow.material.opacity = 0.42 + Math.sin(elapsed * 2.6) * 0.08;
  }
  // ⑤ 水鏡：舟は動くので光の帯を毎フレーム追わせる
  if (streakKagari){
    mirrorStreaks.forEach(m => { m.visible = FX.mizukagami; });
    streakKagari.position.set(boats[0].position.x - 2.29, -0.205, boats[0].position.z + 4.5);
    streakKagari.material.opacity = 0.16 * (boats[0].userData.flick || 1);
    streakYakata.position.set(boats[1].position.x + 1.04, -0.205, boats[1].position.z + 3.5);
    streakYakata.material.opacity = 0.10 * (boats[1].userData.flick || 1);
  }
  // ⑥ 篝火の火の粉が舞い上がる
  if (hinoko){
    hinoko.visible = FX.hinoko;
    const hp = hinoko.geometry.attributes.position;
    hinoko.userData.info.forEach((sp, i) => {
      const h = (sp.off + elapsed * sp.v) % 1.7;
      hp.array[i*3]   = -2.32 + Math.sin(elapsed * 1.8 + sp.sw) * 0.08 * h + h * 0.22;
      hp.array[i*3+1] = 0.80 + h;
      hp.array[i*3+2] = Math.sin(elapsed * 1.4 + sp.sw * 2) * 0.09 * h;
    });
    hp.needsUpdate = true;
    hinoko.material.opacity = 0.55 + Math.sin(elapsed * 11) * 0.2;
  }
  // ⑦ 宵の人影が橋を行き交う（端まで来たら向き直る）
  walkers.forEach((w, k) => {
    w.visible = FX.hitokage;
    if (!FX.hitokage) return;
    const u = w.userData;
    u.t += u.dir * u.v * dt;
    if (u.t >= u.t1){ u.t = u.t1; u.dir = -1; }
    else if (u.t <= u.t0){ u.t = u.t0; u.dir = 1; }
    const face = u.dir > 0 ? Math.PI : 0;
    u.face += (face - u.face) * Math.min(1, dt * 2.5);
    const step = Math.sin(elapsed * 3.1 + k * 2.4);
    w.position.set(u.lane, deckY(u.t) + 0.08 + Math.abs(step) * 0.02, BRIDGE_Z0 - u.t * BRIDGE_L);
    w.rotation.y = u.face;
    w.rotation.z = step * 0.018;
    if (u.cho){
      u.cho.position.z = 0.14 + Math.sin(elapsed * 2.2) * 0.06;
      u.choHalo.position.copy(u.cho.position);
      u.choHalo.material.opacity = 0.5 * (0.82 + Math.sin(elapsed * 8.7) * 0.18);
    }
  });
  // 提灯の灯は欄干を越えて東の水面にもこぼれる
  if (streakChochin && walkers.length > 1){
    streakChochin.visible = FX.mizukagami && FX.hitokage;
    streakChochin.position.set(2.4, -0.205, walkers[1].position.z + 2.6);
    streakChochin.material.opacity = 0.07 * (0.85 + Math.sin(elapsed * 8.7) * 0.15);
  }
  // ⑧ 木立は生き死にだけ
  kodachiPlanes.forEach(m => { m.visible = FX.kodachi; });
  // ⑨ 宿の灯が峰ごとに交互またたき
  yadoClouds.forEach(p => {
    p.material.opacity = FX.yadonoto
      ? 0.78 + Math.sin(elapsed * 1.15 + p.userData.ph) * 0.18 : 0.9;
  });
  // ⑩ 山霞がゆっくり流れて呼吸する
  kasumis.forEach(m => {
    if (!FX.kasumi) return;
    const u = m.userData;
    m.position.x = u.baseX + Math.sin(elapsed * 0.03 + u.ph) * 6;
    m.material.opacity = u.baseO * (0.8 + Math.sin(elapsed * 0.11 + u.ph) * 0.3);
  });
  // ⑪ 月暈の呼吸
  if (moonFx.ring){
    moonFx.ring.visible = FX.tsukigasa;
    if (FX.tsukigasa){
      moonFx.ring.material.opacity = 0.045 + Math.sin(elapsed * 0.21) * 0.025;
      moonFx.halo.material.opacity = 0.40 + Math.sin(elapsed * 0.17) * 0.06;
    }
  }
  // ⑫ 流れ星：待って、流れて、また待つ
  if (meteor){
    meteor.g.visible = FX.nagareboshi;
    if (FX.nagareboshi){
      if (meteor.life < 0){
        meteor.wait -= dt;
        if (meteor.wait <= 0){
          const r = meteor.rnd;
          meteor.g.position.set(-5 + r() * 85, 52 + r() * 22, -150 - r() * 25);
          const ang = 0.5 + r() * 0.5;
          const spd = 26 + r() * 14;
          meteor.vx = -Math.cos(ang) * spd;
          meteor.vy = -Math.sin(ang) * spd;
          meteor.g.rotation.z = Math.atan2(-meteor.vy, -meteor.vx);
          meteor.life = 0;
          meteor.dur = 0.8 + r() * 0.4;
        }
      } else {
        meteor.life += dt;
        const pr = meteor.life / meteor.dur;
        meteor.g.position.x += meteor.vx * dt;
        meteor.g.position.y += meteor.vy * dt;
        const o = Math.max(0, pr < 0.2 ? pr / 0.2 : (1 - pr) / 0.8);
        meteor.head.material.opacity = o * 0.9;
        meteor.tail.material.opacity = o * 0.4;
        if (pr >= 1){ meteor.life = -1; meteor.wait = 5 + meteor.rnd() * 9; }
      }
    }
  }

  // ⑭ 竹林の小径：葉むらがそよぐ／⑮ 月漏れがまたたく
  chikurin.group.visible = FX.chikurin;
  if (FX.chikurin){
    chikurin.canopy.forEach(p => {
      const u = p.userData;
      p.rotation.z = u.baseZ + Math.sin(elapsed * 0.5 + u.ph) * 0.03;
      p.position.x = u.baseX + Math.sin(elapsed * 0.33 + u.ph * 1.7) * 0.07;
    });
  }
  chikurin.moonGroup.visible = FX.chikurin && FX.tsukimore;
  if (chikurin.moonGroup.visible){
    chikurin.shafts.forEach(s => {
      s.material.opacity = s.userData.baseO * (0.62 + 0.38 * Math.sin(elapsed * 0.45 + s.userData.ph));
    });
    chikurin.dapples.forEach(d => {
      d.material.opacity = d.userData.baseO * (0.66 + 0.34 * Math.sin(elapsed * 0.45 + d.userData.ph + 1.3));
    });
  }

  // 猫のしっぽ
  cat.userData.tail.rotation.z = 0.6 + Math.sin(elapsed * 1.6) * 0.34;
  cat.rotation.y = (HOUSES[2].side < 0 ? Math.PI / 2 : -Math.PI / 2)
                 + Math.sin(elapsed * 0.31) * 0.22;
}

function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
}
loop();

/* ============================================================
   11. 目視できない環境向けの検証口
   ============================================================ */
window.__machiya = {
  /* pane 非表示で viewport が 0x0 の環境向け：描画寸法を手で決めて一枚描く */
  size: function(w, h){
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
    renderer.render(scene, camera);
    return { w: w, h: h };
  },
  /* 画面の一部だけ読む（水面の細い光など、全画面平均に埋もれるものの実証用） */
  rect: function(px, py, w, h){
    renderer.render(scene, camera);
    const gl = renderer.getContext();
    const buf = new Uint8Array(w * h * 4);
    gl.readPixels(px, gl.drawingBufferHeight - py - h, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    let sum = 0, mx = 0;
    for (let i = 0; i < w * h; i++){
      const l = (buf[i*4] + buf[i*4+1] + buf[i*4+2]) / 3;
      sum += l; if (l > mx) mx = l;
    }
    return { mean: +(sum / (w * h)).toFixed(2), max: Math.round(mx) };
  },
  /* 世界座標 → 画面ピクセル（rect の狙いを付ける用） */
  proj: function(x, y, z){
    const v = new THREE.Vector3(x, y, z).project(camera);
    const gl = renderer.getContext();
    return { ndc: [+v.x.toFixed(3), +v.y.toFixed(3)],
             px: [Math.round((v.x + 1) / 2 * gl.drawingBufferWidth),
                  Math.round((1 - (v.y + 1) / 2) * gl.drawingBufferHeight)],
             inFront: v.z < 1 };
  },
  /* 手送りで時間を進める（preview では rAF が止まることがあるため） */
  step: function(frames, dt){
    frames = frames || 1; dt = dt || 1/60;
    for (let i = 0; i < frames; i++) update(dt);
    renderer.render(scene, camera);
    return { elapsed: +elapsed.toFixed(2), idx: idx, phase: phase };
  },
  /* 実際に描かれた画素を読む（スクリーンショットが撮れない環境の代替） */
  pixels: function(){
    renderer.render(scene, camera);
    const gl = renderer.getContext();
    const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
    const buf = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    let sum = 0, nonBlack = 0, warm = 0, maxL = 0;
    const n = w * h;
    for (let i = 0; i < n; i++){
      const r = buf[i*4], g2 = buf[i*4+1], b = buf[i*4+2];
      const l = (r + g2 + b) / 3;
      sum += l;
      if (l > 12) nonBlack++;
      if (r > 90 && r > b + 26) warm++;
      if (l > maxL) maxL = l;
    }
    return {
      size: w + 'x' + h,
      meanLuma: +(sum / n).toFixed(2),
      maxLuma: maxL,
      nonBlackPct: +(nonBlack / n * 100).toFixed(1),
      warmPct: +(warm / n * 100).toFixed(1)
    };
  },
  info: function(){
    let meshes = 0;
    scene.traverse(o => { if (o.isMesh || o.isPoints) meshes++; });
    return {
      houses: houseGroups.length,
      tour: TOUR.length,
      spot: TOUR[idx].name,
      meshes: meshes,
      drawCalls: renderer.info.render.calls,
      triangles: renderer.info.render.triangles,
      camera: camera.position.toArray().map(v => +v.toFixed(2)),
      target: curTgt.toArray().map(v => +v.toFixed(2)),
      idx: idx, phase: phase, auto: auto,
      lights: roamLights.map(l => +l.intensity.toFixed(2)),
      fxOn: Object.keys(FX).filter(k => FX[k]).join(','),
      fxCounts: { glints: glintClouds.length, touro: nagashiTouro.length,
                  kawagiri: kawagiris.length, streaks: mirrorStreaks.length,
                  walkers: walkers.length, kodachi: kodachiPlanes.length,
                  take: chikurin.N, sasa: chikurin.canopy.length,
                  shafts: chikurin.shafts.length,
                  meteorOn: meteor ? meteor.life >= 0 : false },
      fudaOn: fuda.classList.contains('on'),
      fudaView: fuda.classList.contains('view'),
      enterShown: elEnt.style.display !== 'none',
      enterHref: elEnt.getAttribute('href')
    };
  },
  /* 停留中の対象が本当に画面の中に写っているか（町屋は看板・暖簾・提灯、名所は橋・峰・舟を投影） */
  aim: function(){
    const v = new THREE.Vector3();
    const proj = o => {
      if (o.isVector3) v.copy(o); else o.getWorldPosition(v);
      const dist = v.distanceTo(camera.position);
      v.project(camera);
      return {
        ndc: [+v.x.toFixed(3), +v.y.toFixed(3)],
        inFront: v.z < 1,
        onScreen: Math.abs(v.x) <= 1 && Math.abs(v.y) <= 1 && v.z < 1,
        dist: +dist.toFixed(2)
      };
    };
    if (idx >= NH){
      return {
        idx: idx, name: TOUR[idx].name,
        bridge : proj(new THREE.Vector3(0, deckY(0.5), (BRIDGE_Z0 + BRIDGE_Z1) / 2)),
        peak   : proj(new THREE.Vector3(MTS[0].cx, MTS[0].r * MTS[0].sy, MTS[0].cz + MTS[0].r * MTS[0].sz * 0.5)),
        kagari : proj(boats[0].position),
        touro  : proj(touros[2].g.position),
        nagashi: nagashiTouro.length ? proj(nagashiTouro[0].position) : null,
        walker : walkers.length ? proj(walkers[0].position) : null
      };
    }
    const g = houseGroups[idx];
    g.updateMatrixWorld(true);
    const parts = {
      sign   : g.userData.sign,
      noren  : g.userData.norenRoot,
      lantern: g.userData.lantern
    };
    const out = { idx: idx, name: HOUSES[idx].name };
    Object.keys(parts).forEach(k => {
      out[k] = parts[k] ? proj(parts[k]) : null;
    });
    return out;
  },
  /* 画面中央から光線を飛ばし、狙った町屋に当たるか */
  centerHit: function(){
    const r = new THREE.Raycaster();
    r.setFromCamera(new THREE.Vector2(0, 0), camera);
    const hits = r.intersectObjects(houseGroups, true);
    if (!hits.length) return { hit:null };
    let o = hits[0].object;
    while (o && houseGroups.indexOf(o) === -1) o = o.parent;
    const i = houseGroups.indexOf(o);
    return { hit: i, isCurrent: i === idx, dist: +hits[0].distance.toFixed(2) };
  },
  goTo: function(i){ goTo(i, true); return idx; },
  setAuto: function(v){ auto = !!v; syncAutoBtn(); return auto; },
  FX: FX
};

})();
</script>
